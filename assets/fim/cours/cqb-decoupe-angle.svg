<text x="200" y="120" class="m" style="letter-spacing:2px">PIÈCE</text>
<text x="240" y="280" class="m r">position de départ</text>
<rect x="500" y="262" width="270" height="106" fill="#151821" stroke="#4FD895" stroke-opacity=".7"/>
<text x="512" y="284" class="mw" style="fill:#4FD895;letter-spacing:1px">PRINCIPE</text>
<text x="512" y="304" class="s">Rester loin de la porte,</text>
<text x="512" y="322" class="s">avancer à petits pas,</text>
<text x="512" y="340" class="s">arme pointée sur la</text>
<text x="512" y="358" class="s">limite de chaque tranche.</text>
