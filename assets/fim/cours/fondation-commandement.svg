<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Organigramme : Administrateur, Conseil O5, Directeur du Site-15, départements, puis chaîne FIM jusqu'aux opérateurs. Alpha-1 rattachée directement au Conseil O5.">
<title>Chaîne de commandement de la Fondation</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.b{font:14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.bb{font:700 14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.d{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.s{font:12px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.m{font:10px "JetBrains Mono",Consolas,monospace;letter-spacing:1px;fill:#9297A8}
.c{text-anchor:middle}
.p{fill:#151821;stroke:#2A2E3A}
.l{stroke:#5A6072;stroke-width:1.5;fill:none}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5A6072"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#F0525A"/></marker>
</defs>
<rect width="800" height="450" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · FONDATION</text>
<text x="28" y="60" class="t">Chaîne de commandement</text>

<!-- Administrateur -->
<rect x="320" y="76" width="160" height="32" class="p"/>
<text x="400" y="97" class="bb c">Administrateur</text>
<line x1="400" y1="108" x2="400" y2="124" class="l" marker-end="url(#a)"/>

<!-- Conseil O5 -->
<rect x="295" y="126" width="210" height="38" fill="#151821" stroke="#6E76FF"/>
<text x="400" y="143" class="bb c">Conseil O5</text>
<text x="400" y="158" class="m c">13 MEMBRES</text>

<!-- Comité d'Éthique -->
<rect x="80" y="130" width="170" height="30" class="p"/>
<text x="165" y="150" class="d c">Comité d'Éthique</text>
<line x1="250" y1="145" x2="295" y2="145" stroke="#5A6072" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="272" y="138" class="m c">AVIS</text>

<!-- Alpha-1 -->
<rect x="560" y="126" width="190" height="38" fill="#2A1418" stroke="#F0525A"/>
<text x="655" y="143" class="bb c" fill="#F0525A" style="fill:#F0525A">Alpha-1</text>
<text x="655" y="158" class="m c">FORCE DU CONSEIL O5</text>
<line x1="557" y1="145" x2="505" y2="145" stroke="#F0525A" stroke-width="1.5" stroke-dasharray="5 3"/>
<path d="M548 141L556 145L548 149" fill="none" stroke="#F0525A" stroke-width="1.5"/>
<path d="M514 141L506 145L514 149" fill="none" stroke="#F0525A" stroke-width="1.5"/>

<line x1="400" y1="164" x2="400" y2="180" class="l" marker-end="url(#a)"/>

<!-- Directeur -->
<rect x="295" y="182" width="210" height="32" class="p"/>
<text x="400" y="203" class="bb c">Directeur du Site-15</text>

<!-- distribution -->
<path d="M400 214V226M85 226H715M85 226V238M211 226V238M337 226V238M463 226V238M589 226V238M715 226V238" class="l"/>

<!-- Départements -->
<rect x="29" y="240" width="112" height="40" class="p"/>
<text x="85" y="265" class="d c">DSE / EIT</text>
<rect x="155" y="240" width="112" height="40" fill="#1B1F33" stroke="#6E76FF" stroke-width="1.5"/>
<text x="211" y="257" class="d c">Commandement</text>
<text x="211" y="273" class="d c" style="font-weight:700">FIM</text>
<rect x="281" y="240" width="112" height="40" class="p"/>
<text x="337" y="265" class="d c">Scientifique</text>
<rect x="407" y="240" width="112" height="40" class="p"/>
<text x="463" y="265" class="d c">Médical</text>
<rect x="533" y="240" width="112" height="40" class="p"/>
<text x="589" y="265" class="d c">Ingénierie</text>
<rect x="659" y="240" width="112" height="40" class="p"/>
<text x="715" y="265" class="d c">Administration</text>

<!-- Chaîne FIM -->
<line x1="211" y1="280" x2="211" y2="296" stroke="#6E76FF" stroke-width="1.5"/>
<rect x="151" y="298" width="120" height="28" class="p"/>
<text x="211" y="317" class="d c">Chef d'unité</text>
<line x1="211" y1="326" x2="211" y2="338" stroke="#6E76FF" stroke-width="1.5"/>
<rect x="151" y="340" width="120" height="28" class="p"/>
<text x="211" y="359" class="d c">Chef d'équipe</text>
<line x1="211" y1="368" x2="211" y2="380" stroke="#6E76FF" stroke-width="1.5"/>
<rect x="151" y="382" width="120" height="28" fill="#1B1F33" stroke="#6E76FF"/>
<text x="211" y="401" class="d c" style="font-weight:700">Opérateurs</text>

<!-- Légende -->
<rect x="420" y="300" width="352" height="108" class="p"/>
<text x="436" y="320" class="m">LÉGENDE</text>
<line x1="436" y1="342" x2="476" y2="342" class="l"/>
<text x="490" y="346" class="s">Ligne hiérarchique (ordres)</text>
<line x1="436" y1="366" x2="476" y2="366" stroke="#5A6072" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="490" y="370" class="s">Contrôle et avis, sans commandement</text>
<line x1="436" y1="390" x2="476" y2="390" stroke="#F0525A" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="490" y="394" class="s">Rattachement direct au Conseil O5</text>

<text x="28" y="434" class="s">Les FIM du Site-15 obéissent au Directeur du Site ; Alpha-1 ne répond qu'au Conseil O5.</text>
</svg>
