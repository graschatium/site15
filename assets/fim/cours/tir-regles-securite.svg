<text x="28" y="34" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#6E76FF" letter-spacing="2">FIM · TIR</text>
<text x="28" y="60" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="22" fill="#E8EAF0" font-weight="700">Les 4 règles de sécurité</text>
<rect x="28.5" y="84.5" width="176" height="315" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<circle cx="50" cy="106" r="13" fill="#6E76FF"/>
<text x="50" y="110.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><g transform="translate(54.5 146) scale(1.0)"><path d="M0 0 H90 V18 H30 L26 54 H8 L12 18 H0 Z" fill="#E8EAF0"/>
<path d="M30 30 H44 V18" fill="none" stroke="#E8EAF0" stroke-width="3"/>
<line x1="36" y1="18" x2="35" y2="27" stroke="#E8EAF0" stroke-width="3"/>
</g><polygon points="158.5,168 162.5,160 166.5,168" fill="#C9862A"/>
<rect x="158.5" y="168" width="8" height="22" fill="#F0A83C"/>
<polygon points="172.5,168 176.5,160 180.5,168" fill="#C9862A"/>
<rect x="172.5" y="168" width="8" height="22" fill="#F0A83C"/>
<text x="116.5" y="262" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">Toute arme est</text><text x="116.5" y="280" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">toujours chargée</text><text x="116.5" y="306" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">Même « vide », même</text><text x="116.5" y="322" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">à l'entraînement.</text><rect x="217.5" y="84.5" width="176" height="315" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<circle cx="239" cy="106" r="13" fill="#6E76FF"/>
<text x="239" y="110.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><g transform="translate(217.5 150) scale(0.8)"><path d="M0 0 H90 V18 H30 L26 54 H8 L12 18 H0 Z" fill="#E8EAF0"/>
<path d="M30 30 H44 V18" fill="none" stroke="#E8EAF0" stroke-width="3"/>
<line x1="36" y1="18" x2="35" y2="27" stroke="#E8EAF0" stroke-width="3"/>
</g><line x1="291.5" y1="157" x2="339.5" y2="157" stroke="#F0525A" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="357.5" cy="150.0" r="9.0" fill="#F0A83C"/>
<rect x="345.5" y="162.0" width="24.0" height="36.0" fill="#F0A83C"/>
<circle cx="319.5" cy="157" r="15" fill="none" stroke="#F0525A" stroke-width="4"/>
<line x1="308.5" y1="146" x2="330.5" y2="168" stroke="#F0525A" stroke-width="4"/>
<text x="305.5" y="262" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">Canon jamais vers</text><text x="305.5" y="280" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">ce qu'on ne veut</text><text x="305.5" y="298" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">pas détruire</text><text x="305.5" y="324" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">Coéquipiers, civils,</text><text x="305.5" y="340" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">personnel Fondation.</text><rect x="406.5" y="84.5" width="176" height="315" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<circle cx="428" cy="106" r="13" fill="#6E76FF"/>
<text x="428" y="110.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><g transform="translate(434.5 140) scale(1.3)"><path d="M0 0 H90 V18 H30 L26 54 H8 L12 18 H0 Z" fill="#E8EAF0"/>
<path d="M30 30 H44 V18" fill="none" stroke="#E8EAF0" stroke-width="3"/>
<line x1="36" y1="18" x2="35" y2="27" stroke="#E8EAF0" stroke-width="3"/>
<line x1="22" y1="10" x2="70" y2="10" stroke="#4FD895" stroke-width="7"/>
</g><text x="494.5" y="238" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#4FD895" text-anchor="middle">doigt le long</text><text x="494.5" y="262" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">Doigt hors de</text><text x="494.5" y="280" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">la détente</text><text x="494.5" y="306" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">Le long de la carcasse</text><text x="494.5" y="322" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">jusqu'à la décision</text><text x="494.5" y="338" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">de tirer.</text><rect x="595.5" y="84.5" width="176" height="315" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<circle cx="617" cy="106" r="13" fill="#6E76FF"/>
<text x="617" y="110.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><path d="M607.5 170 Q621.5 160 635.5 170 Q621.5 180 607.5 170 Z" fill="none" stroke="#E8EAF0" stroke-width="2"/>
<circle cx="621.5" cy="170" r="3.5" fill="#E8EAF0"/>
<line x1="639.5" y1="170" x2="649.5" y2="170" stroke="#9297A8" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="673.5" cy="170" r="22" fill="none" stroke="#F0525A" stroke-width="3"/>
<circle cx="673.5" cy="170" r="14" fill="none" stroke="#F0525A" stroke-width="3"/>
<circle cx="673.5" cy="170" r="6" fill="none" stroke="#F0525A" stroke-width="3"/>
<line x1="697.5" y1="170" x2="721.5" y2="170" stroke="#F0A83C" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ma)"/>
<circle cx="739.5" cy="156.2" r="8.1" fill="#F0A83C"/>
<rect x="728.7" y="167.0" width="21.6" height="32.4" fill="#F0A83C"/>
<text x="683.5" y="262" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">Identifier la cible</text><text x="683.5" y="280" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">et ce qu'il y a</text><text x="683.5" y="298" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E8EAF0" font-weight="700" text-anchor="middle">derrière</text><text x="683.5" y="324" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">Une balle peut</text><text x="683.5" y="340" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8" text-anchor="middle">traverser ou manquer.</text>
<line x1="28" y1="412" x2="772" y2="412" stroke="#2A2E3A" stroke-width="1"/>
<text x="28" y="433" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9297A8">Valables en permanence, à l'entraînement comme en intervention. Une seule règle oubliée suffit à un accident.</text>
</svg>
