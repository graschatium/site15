<text x="28" y="60" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="22" fill="#E8EAF0" font-weight="700">Maîtrise au sol</text>
<rect x="28.5" y="84.5" width="363" height="215" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
