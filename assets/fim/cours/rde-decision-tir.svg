<rect x="584" y="302" width="5" height="56" fill="#F0525A"/>
<text x="600" y="324" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#F0525A" font-weight="700" letter-spacing="1">RDE-3</text><text x="600" y="344" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">Feu libre</text><text x="584" y="380" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#9297A8">Niveau fixé par le</text><text x="584" y="394" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#9297A8">commandement.</text>
<line x1="28" y1="412" x2="772" y2="412" stroke="#2A2E3A" stroke-width="1"/>
<text x="28" y="433" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9297A8">Chaque « non » arrête la décision de tir. En cas de doute, on ne tire pas.</text>
</svg>
