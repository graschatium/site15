<rect x="584" y="174" width="5" height="56" fill="#4FD895"/>
<text x="600" y="196" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4FD895" font-weight="700" letter-spacing="1">RDE-1</text><text x="600" y="216" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Riposte (défaut)</text><rect x="584.5" y="238.5" width="187" height="55" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<rect x="584" y="238" width="5" height="56" fill="#F0A83C"/>
