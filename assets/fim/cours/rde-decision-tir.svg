<rect x="300" y="274" width="5" height="44" fill="#F0A83C"/>
<text x="318" y="106" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#F0525A" font-weight="700">PAS DE TIR</text><text x="318" y="123" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#E8EAF0">sauf trahison avérée + ordre</text><text x="318" y="177" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Sommation / interpellation</text><text x="318" y="239" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Couverture, rendre compte</text><text x="318" y="301" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Se décaler, chercher un angle</text><rect x="28.5" y="336.5" width="199" height="43" fill="#4FD895" fill-opacity="0.2" stroke="#4FD895" stroke-width="1"/>
<text x="128" y="364" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="17" fill="#4FD895" font-weight="700" text-anchor="middle">TIR</text><text x="244" y="363" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#9297A8">tir maîtrisé, puis compte rendu immédiat</text><text x="584" y="100" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#6E76FF" letter-spacing="2">NIVEAUX RDE</text><rect x="584.5" y="110.5" width="187" height="55" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<rect x="584" y="110" width="5" height="56" fill="#9297A8"/>
