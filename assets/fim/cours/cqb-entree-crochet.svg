<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Entrée en crochet : colonne partagée, 1 et 3 à gauche, 2 et 4 à droite. Le 1 et le 2 pivotent autour du chambranle de leur côté puis longent leur propre mur, sans se croiser.">
<title>Entrée en crochet</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.b{font:14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.bb{font:700 14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.s{font:13px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.m{font:11px "JetBrains Mono",Consolas,monospace;fill:#9297A8}
.mw{font:700 11px "JetBrains Mono",Consolas,monospace;fill:#E8EAF0}
.n{font:700 13px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#FFFFFF;text-anchor:middle}
.c{text-anchor:middle}
.r{text-anchor:end}
.w{stroke:#9297A8;stroke-width:6;stroke-linecap:square;fill:none}
.f{fill:#151821}
.mv{stroke:#4FD895;stroke-width:3;fill:none}
.sec{fill:#6E76FF;fill-opacity:.12;stroke:#6E76FF;stroke-opacity:.5;stroke-dasharray:4 3}
.dz{fill:#F0525A;fill-opacity:.15}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4FD895"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F0525A"/></marker>
</defs>
<rect width="800" height="450" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · CQB</text>
<text x="28" y="60" class="t">Entrée en crochet</text>
<rect x="220" y="95" width="360" height="195" class="f"/>
<path d="M240,262 L260.8,143.8 A120,120 0 0 1 352.8,221.0 Z" class="sec"/>
<path d="M560,262 L447.2,221.0 A120,120 0 0 1 539.2,143.8 Z" class="sec"/>
<path d="M367,290 L220,290 L220,95 L580,95 L580,290 L433,290" class="w"/>
<path d="M352,304 C394,302 394,262 362,262 L258,262" class="mv" marker-end="url(#ah)"/>
<path d="M448,304 C406,302 406,262 438,262 L542,262" class="mv" marker-end="url(#ah)"/>
<circle cx="240" cy="262" r="14" fill="#6E76FF" fill-opacity=".35" stroke="#E8EAF0" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="240" y="266.6" class="n">1</text>
<circle cx="560" cy="262" r="14" fill="#6E76FF" fill-opacity=".35" stroke="#E8EAF0" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="560" y="266.6" class="n">2</text>
<circle cx="345" cy="316" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="345" y="320.6" class="n">1</text>
<circle cx="310" cy="316" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="310" y="320.6" class="n">3</text>
<circle cx="455" cy="316" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="455" y="320.6" class="n">2</text>
<circle cx="490" cy="316" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="490" y="320.6" class="n">4</text>
<text x="400" y="350" class="m c">colonne partagée de part et d'autre de la porte</text>
<text x="400" y="226" class="m c">pivot sur le chambranle</text>
<text x="400" y="240" class="m c">puis longe son mur</text>
<rect x="600" y="100" width="176" height="106" fill="#151821" stroke="#4FD895" stroke-opacity=".7"/>
<text x="612" y="122" class="mw" style="fill:#4FD895;letter-spacing:1px">AVANTAGE</text>
<text x="612" y="142" class="s">Chacun reste de</text>
<text x="612" y="160" class="s">son côté : aucune</text>
<text x="612" y="178" class="s">trajectoire ne</text>
<text x="612" y="196" class="s">se croise.</text>
<rect x="600" y="226" width="176" height="88" fill="#151821" stroke="#6E76FF" stroke-opacity=".7"/>
<text x="612" y="248" class="mw" style="fill:#6E76FF;letter-spacing:1px">POINT CLÉ</text>
<text x="612" y="268" class="s">Pivoter au ras du</text>
<text x="612" y="286" class="s">cadre, sans marquer</text>
<text x="612" y="304" class="s">l'arrêt dans la porte.</text>
<line x1="28" y1="408" x2="772" y2="408" stroke="#2A2E3A"/>
<circle cx="35" cy="426" r="7" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1"/>
<text x="48" y="430" class="m">Opérateur</text>
<circle cx="135" cy="426" r="7" fill="#6E76FF" fill-opacity=".35" stroke="#E8EAF0" stroke-width="1" stroke-dasharray="2 2"/>
<text x="148" y="430" class="m">Position finale</text>
<path d="M268,426 L288,426" class="mv" marker-end="url(#ah)"/>
<text x="300" y="430" class="m">Déplacement</text>
<path d="M393,432 L411,420 L411,432 Z" class="sec"/>
<text x="419" y="430" class="m">Secteur couvert</text>
</svg>
