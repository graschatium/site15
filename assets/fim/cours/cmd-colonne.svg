<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Colonne de cinq opérateurs dans un couloir : tête, chef, porteur du kit, second et serre-file, avec les secteurs avant et arrière.">
<title>Les rôles dans une équipe en progression</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.h{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.hc{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0;text-anchor:middle}
.s{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.sc{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8;text-anchor:middle}
.q{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6}
.qc{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6;text-anchor:middle}
.m{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px}
.mc{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;text-anchor:middle}
.n{font:700 13px "JetBrains Mono",Consolas,monospace}
.f{font:12px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6072"/></marker></defs>
<rect width="800" height="450" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · COMMANDEMENT</text>
<text x="28" y="60" class="t">Les rôles dans une équipe en progression</text>
<rect x="28" y="120" width="744" height="150" fill="#12141B" stroke="#2A2E3A"/>
<line x1="28" y1="120" x2="772" y2="120" stroke="#5B6072" stroke-width="3"/><line x1="28" y1="270" x2="772" y2="270" stroke="#5B6072" stroke-width="3"/>
<text x="400" y="108" class="mc" fill="#5B6072">SENS DE PROGRESSION</text>
<line x1="480" y1="104" x2="560" y2="104" stroke="#5B6072" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M660 195 L772 135 L772 255 Z" fill="#F0525A" opacity=".12"/>
<path d="M140 195 L28 140 L28 250 Z" fill="#5AA9FF" opacity=".12"/>
<circle cx="640" cy="195" r="20" fill="#151821" stroke="#F0525A" stroke-width="2.5"/>
<path d="M654 195 L670 195" stroke="#F0525A" stroke-width="3"/>
<text x="640" y="300" class="mc" fill="#F0525A">TÊTE</text>
<text x="640" y="322" class="sc">Ouvre la route,</text>
<text x="640" y="339" class="sc">annonce les contacts</text>
<circle cx="515" cy="195" r="20" fill="#151821" stroke="#6E76FF" stroke-width="2.5"/>
<path d="M529 195 L545 195" stroke="#6E76FF" stroke-width="3"/>
<text x="515" y="300" class="mc" fill="#6E76FF">CHEF</text>
<text x="515" y="322" class="sc">Voit et commande,</text>
<text x="515" y="339" class="sc">rend compte</text>
<circle cx="390" cy="195" r="20" fill="#151821" stroke="#F0A83C" stroke-width="2.5"/>
<path d="M404 195 L420 195" stroke="#F0A83C" stroke-width="3"/>
<text x="390" y="300" class="mc" fill="#F0A83C">KIT</text>
<text x="390" y="322" class="sc">Matériel de</text>
<text x="390" y="339" class="sc">confinement, protégé</text>
<circle cx="265" cy="195" r="20" fill="#151821" stroke="#A78BFA" stroke-width="2.5"/>
<path d="M279 195 L295 195" stroke="#A78BFA" stroke-width="3"/>
<text x="265" y="300" class="mc" fill="#A78BFA">SECOND</text>
<text x="265" y="322" class="sc">Remplace le chef,</text>
<text x="265" y="339" class="sc">surveille l'arrière</text>
<circle cx="150" cy="195" r="20" fill="#151821" stroke="#5AA9FF" stroke-width="2.5"/>
<path d="M136 195 L120 195" stroke="#5AA9FF" stroke-width="3"/>
<text x="150" y="300" class="mc" fill="#5AA9FF">SERRE-FILE</text>
<text x="150" y="322" class="sc">Couvre l'arrière,</text>
<text x="150" y="339" class="sc">compte les hommes</text>
<text x="712" y="150" class="mc" fill="#F0525A">SECTEUR AVANT</text>
<text x="88" y="150" class="mc" fill="#5AA9FF">SECTEUR ARRIÈRE</text>
<rect x="28" y="378" width="744" height="50" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="378" width="3" height="50" fill="#6E76FF"/>
<text x="46" y="400" class="m" fill="#4FD895">LE MÉDIC</text>
<text x="140" y="400" class="s">se place près du chef. Le second est désigné au briefing : si le chef tombe,</text>
<text x="140" y="418" class="s">il annonce « Je prends le commandement ».</text>
</svg>
