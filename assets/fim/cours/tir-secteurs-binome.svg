<text x="428" y="340" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#E8EAF0">Le tir de 2 traverse 1 : ligne de tir</text><text x="428" y="358" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#E8EAF0">obstruée. Se décaler avant de tirer.</text>
