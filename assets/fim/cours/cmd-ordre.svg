<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" width="800" height="452" role="img" aria-label="Les cinq temps d'un ordre (situation, mission, exécution, règles et liaisons, questions) avec un exemple, et les qualités d'un bon ordre.">
<title>L'ordre en cinq temps</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.h{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.hc{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0;text-anchor:middle}
.s{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.sc{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8;text-anchor:middle}
.q{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6}
.qc{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6;text-anchor:middle}
.m{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px}
.mc{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;text-anchor:middle}
.n{font:700 13px "JetBrains Mono",Consolas,monospace}
.f{font:12px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6072"/></marker></defs>
<rect width="800" height="452" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="451" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · COMMANDEMENT</text>
<text x="28" y="60" class="t">L'ordre en cinq temps</text>
<rect x="28" y="86" width="744" height="52" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="86" width="3" height="52" fill="#6E76FF"/>
<text x="46" y="108" class="n" fill="#6E76FF">1</text>
<text x="70" y="108" class="m" fill="#6E76FF">SITUATION</text>
<text x="70" y="126" class="s">Ce qui se passe et où</text>
<text x="330" y="117" class="q">« SCP-939 hors confinement, couloir B de la ZCL. »</text>
<rect x="28" y="148" width="744" height="52" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="148" width="3" height="52" fill="#A78BFA"/>
<text x="46" y="170" class="n" fill="#A78BFA">2</text>
<text x="70" y="170" class="m" fill="#A78BFA">MISSION</text>
<text x="70" y="188" class="s">Ce qu'on fait, en une phrase</text>
<text x="330" y="179" class="q">« On le repousse dans sa cellule. »</text>
<rect x="28" y="210" width="744" height="52" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="210" width="3" height="52" fill="#F0A83C"/>
<text x="46" y="232" class="n" fill="#F0A83C">3</text>
<text x="70" y="232" class="m" fill="#F0A83C">EXÉCUTION</text>
<text x="70" y="250" class="s">Qui fait quoi, dans quel ordre</text>
<text x="330" y="241" class="q">« Leroy en tête, Moreau au kit, Petit serre-file. »</text>
<rect x="28" y="272" width="744" height="52" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="272" width="3" height="52" fill="#F0525A"/>
<text x="46" y="294" class="n" fill="#F0525A">4</text>
<text x="70" y="294" class="m" fill="#F0525A">RÈGLES ET LIAISONS</text>
<text x="70" y="312" class="s">RDE, canal, mot de repli</text>
<text x="330" y="303" class="q">« RDE-2. Canal ops. Repli au mot RIDEAU. »</text>
<rect x="28" y="334" width="744" height="52" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="334" width="3" height="52" fill="#4FD895"/>
<text x="46" y="356" class="n" fill="#4FD895">5</text>
<text x="70" y="356" class="m" fill="#4FD895">QUESTIONS ?</text>
<text x="70" y="374" class="s">Puis on fait répéter</text>
<text x="330" y="365" class="q">« Petit, ton rôle ? »</text>
<rect x="28" y="404" width="139" height="28" fill="none" stroke="#6E76FF" stroke-opacity=".5"/>
<text x="97.5" y="422" class="mc" fill="#6E76FF">NOMINATIF</text>
<rect x="179" y="404" width="139" height="28" fill="none" stroke="#6E76FF" stroke-opacity=".5"/>
<text x="248.5" y="422" class="mc" fill="#6E76FF">PRÉCIS</text>
<rect x="330" y="404" width="139" height="28" fill="none" stroke="#6E76FF" stroke-opacity=".5"/>
<text x="399.5" y="422" class="mc" fill="#6E76FF">COURT</text>
<rect x="481" y="404" width="139" height="28" fill="none" stroke="#6E76FF" stroke-opacity=".5"/>
<text x="550.5" y="422" class="mc" fill="#6E76FF">VÉRIFIÉ</text>
<rect x="632" y="404" width="139" height="28" fill="none" stroke="#6E76FF" stroke-opacity=".5"/>
<text x="701.5" y="422" class="mc" fill="#6E76FF">RÉALISABLE</text>
</svg>
