<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Points de domination : pièce après l'entrée. Le 1 et le 2 dans les angles du mur d'entrée, dos au mur, le 3 au centre du mur du fond, le 4 tient la porte. Les secteurs ne se chevauchent pas.">
<title>Points de domination</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.b{font:14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.bb{font:700 14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.s{font:13px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.m{font:11px "JetBrains Mono",Consolas,monospace;fill:#9297A8}
.mw{font:700 11px "JetBrains Mono",Consolas,monospace;fill:#E8EAF0}
.n{font:700 13px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#FFFFFF;text-anchor:middle}
.c{text-anchor:middle}
.r{text-anchor:end}
.w{stroke:#9297A8;stroke-width:6;stroke-linecap:square;fill:none}
.f{fill:#151821}
.mv{stroke:#4FD895;stroke-width:3;fill:none}
.sec{fill:#6E76FF;fill-opacity:.12;stroke:#6E76FF;stroke-opacity:.5;stroke-dasharray:4 3}
.dz{fill:#F0525A;fill-opacity:.15}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4FD895"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F0525A"/></marker>
</defs>
<rect width="800" height="450" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · CQB</text>
<text x="28" y="60" class="t">Points de domination</text>
<rect x="200" y="90" width="400" height="240" class="f"/>
<path d="M574,304 L455.2,287.3 A120,120 0 0 1 557.3,185.2 Z" class="sec"/>
<path d="M226,304 L242.7,185.2 A120,120 0 0 1 344.8,287.3 Z" class="sec"/>
<path d="M400,116 L477.8,170.5 A95,95 0 0 1 322.2,170.5 Z" class="sec"/>
<path d="M452,304 L439.8,372.9 A70,70 0 0 1 384.4,322.1 Z" class="sec"/>
<path d="M367,330 L200,330 L200,90 L600,90 L600,330 L433,330" class="w"/>
<circle cx="574" cy="304" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="574" y="308.6" class="n">1</text>
<circle cx="226" cy="304" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="226" y="308.6" class="n">2</text>
<circle cx="400" cy="116" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="400" y="120.6" class="n">3</text>
<circle cx="452" cy="304" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="452" y="308.6" class="n">4</text>
<text x="495" y="205" class="m c">secteur 1</text>
<text x="305" y="205" class="m c">secteur 2</text>
<text x="400" y="196" class="m c">secteur 3</text>
<text x="470" y="362" class="m">4 · tient la porte (couloir)</text>
<rect x="616" y="96" width="160" height="106" fill="#151821" stroke="#6E76FF" stroke-opacity=".7"/>
<text x="628" y="118" class="mw" style="fill:#6E76FF;letter-spacing:1px">POSITIONS</text>
<text x="628" y="138" class="s">1 · angle droit</text>
<text x="628" y="156" class="s">2 · angle gauche</text>
<text x="628" y="174" class="s">3 · mur du fond</text>
<text x="628" y="192" class="s">4 · porte</text>
<rect x="616" y="216" width="160" height="106" fill="#151821" stroke="#4FD895" stroke-opacity=".7"/>
<text x="628" y="238" class="mw" style="fill:#4FD895;letter-spacing:1px">RÈGLE</text>
<text x="628" y="258" class="s">Dos au mur, hors</text>
<text x="628" y="276" class="s">de l'embrasure,</text>
<text x="628" y="294" class="s">secteurs jointifs</text>
<text x="628" y="312" class="s">sans chevauchement.</text>
<line x1="28" y1="408" x2="772" y2="408" stroke="#2A2E3A"/>
<circle cx="35" cy="426" r="7" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1"/>
<text x="48" y="430" class="m">Opérateur</text>
<path d="M128,432 L146,420 L146,432 Z" class="sec"/>
<text x="154" y="430" class="m">Secteur de tir</text>
<path d="M269,426 L285,426" class="w" style="stroke-width:5"/>
<text x="295" y="430" class="m">Mur</text>
</svg>
