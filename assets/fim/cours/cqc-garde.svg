<text x="468" y="198.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="496" y="184" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#E8EAF0" font-weight="700">Mains hautes</text><text x="496" y="203" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">Poings à hauteur du visage,</text><text x="496" y="219" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">coudes serrés contre les côtes.</text><rect x="440.5" y="238.5" width="331" height="67" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<circle cx="468" cy="272" r="13" fill="#F0A83C"/>
<text x="468" y="276.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="496" y="262" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#E8EAF0" font-weight="700">Genoux fléchis</text><text x="496" y="281" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">Poids réparti, centre de gravité bas :</text><text x="496" y="297" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">on encaisse sans perdre l'équilibre.</text><rect x="440.5" y="316.5" width="331" height="67" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<circle cx="468" cy="350" r="13" fill="#F0A83C"/>
<text x="468" y="354.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="496" y="340" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#E8EAF0" font-weight="700">Pieds décalés</text><text x="496" y="359" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">Écart largeur d'épaules, pied fort</text><text x="496" y="375" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">en arrière, appui sur l'avant du pied.</text>
<line x1="28" y1="412" x2="772" y2="412" stroke="#2A2E3A" stroke-width="1"/>
<text x="28" y="433" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9297A8">Vue de profil · bleu foncé = membres arrière. Adopter la garde dès qu'une interpellation peut dégénérer.</text>
