<circle cx="468" cy="116" r="13" fill="#F0A83C"/>
<text x="468" y="120.68" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="496" y="106" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#E8EAF0" font-weight="700">Menton rentré</text><text x="496" y="125" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">Protège mâchoire et gorge ;</text><text x="496" y="141" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">le regard passe au-dessus des poings.</text><rect x="440.5" y="160.5" width="331" height="67" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
