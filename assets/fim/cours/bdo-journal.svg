<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Exemple de journal de bord avec les six types d'entrée (info, contact, objectif, perte, renfort, repli) et les règles d'une bonne entrée.">
<title>Tenir le journal de bord</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.h{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.hc{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0;text-anchor:middle}
.s{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.sc{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8;text-anchor:middle}
.q{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6}
.qc{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6;text-anchor:middle}
.m{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px}
.mc{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;text-anchor:middle}
.n{font:700 13px "JetBrains Mono",Consolas,monospace}
.f{font:12px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6072"/></marker></defs>
<rect width="800" height="440" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="439" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · BUREAU DES OPÉRATIONS</text>
<text x="28" y="60" class="t">Tenir le journal de bord</text>
<line x1="104" y1="96" x2="104" y2="384" stroke="#2A2E3A" stroke-width="2"/>
<text x="28" y="122" class="n" fill="#9297A8">21:02</text>
<circle cx="104" cy="117" r="6" fill="#0E1016" stroke="#9297A8" stroke-width="2.5"/>
<rect x="124" y="104" width="92" height="26" fill="#9297A8" fill-opacity=".14" stroke="#9297A8" stroke-opacity=".7"/>
<text x="170" y="121" class="mc" fill="#E8EAF0">INFO</text>
<text x="232" y="122" class="s" fill="#E8EAF0">Équipe au ralliement, 4 opérateurs.</text>
<text x="28" y="170" class="n" fill="#9297A8">21:09</text>
<circle cx="104" cy="165" r="6" fill="#0E1016" stroke="#F0525A" stroke-width="2.5"/>
<rect x="124" y="152" width="92" height="26" fill="#F0525A" fill-opacity=".14" stroke="#F0525A" stroke-opacity=".7"/>
<text x="170" y="169" class="mc" fill="#F0525A">CONTACT</text>
<text x="232" y="170" class="s" fill="#E8EAF0">Contact 939, couloir B, distance 20 m.</text>
<text x="28" y="218" class="n" fill="#9297A8">21:14</text>
<circle cx="104" cy="213" r="6" fill="#0E1016" stroke="#4FD895" stroke-width="2.5"/>
<rect x="124" y="200" width="92" height="26" fill="#4FD895" fill-opacity=".14" stroke="#4FD895" stroke-opacity=".7"/>
<text x="170" y="217" class="mc" fill="#4FD895">OBJECTIF</text>
<text x="232" y="218" class="s" fill="#E8EAF0">Phase 1 terminée, sas sécurisé.</text>
<text x="28" y="266" class="n" fill="#9297A8">21:16</text>
<circle cx="104" cy="261" r="6" fill="#0E1016" stroke="#E0443F" stroke-width="2.5"/>
<rect x="124" y="248" width="92" height="26" fill="#E0443F" fill-opacity=".14" stroke="#E0443F" stroke-opacity=".7"/>
<text x="170" y="265" class="mc" fill="#E0443F">PERTE</text>
<text x="232" y="266" class="s" fill="#E8EAF0">RENARD-3 à terre, couloir B.</text>
<text x="28" y="314" class="n" fill="#9297A8">21:17</text>
<circle cx="104" cy="309" r="6" fill="#0E1016" stroke="#5AA9FF" stroke-width="2.5"/>
<rect x="124" y="296" width="92" height="26" fill="#5AA9FF" fill-opacity=".14" stroke="#5AA9FF" stroke-opacity=".7"/>
<text x="170" y="313" class="mc" fill="#5AA9FF">RENFORT</text>
<text x="232" y="314" class="s" fill="#E8EAF0">2 opérateurs Nu-7 envoyés en renfort.</text>
<text x="28" y="362" class="n" fill="#9297A8">21:20</text>
<circle cx="104" cy="357" r="6" fill="#0E1016" stroke="#F0A83C" stroke-width="2.5"/>
<rect x="124" y="344" width="92" height="26" fill="#F0A83C" fill-opacity=".14" stroke="#F0A83C" stroke-opacity=".7"/>
<text x="170" y="361" class="mc" fill="#F0A83C">REPLI</text>
<text x="232" y="362" class="s" fill="#E8EAF0">Repli sur le checkpoint, mot RIDEAU.</text>
<rect x="560" y="96" width="212" height="196" fill="#151821" stroke="#2A2E3A"/><rect x="560" y="96" width="3" height="196" fill="#4FD895"/>
<text x="576" y="120" class="m" fill="#4FD895">UNE BONNE ENTRÉE</text>
<text x="576" y="148" class="s" fill="#E8EAF0">✓  Courte : une ligne, un fait</text>
<text x="576" y="174" class="s" fill="#E8EAF0">✓  Factuelle : pas d'opinion</text>
<text x="576" y="200" class="s" fill="#E8EAF0">✓  Datée : l'heure</text>
<text x="576" y="226" class="s" fill="#E8EAF0">✓  Située : le lieu</text>
<text x="576" y="252" class="s" fill="#E8EAF0">✓  Sourcée si besoin</text>
<rect x="560" y="306" width="212" height="78" fill="#151821" stroke="#2A2E3A"/><rect x="560" y="306" width="3" height="78" fill="#F0525A"/>
<text x="576" y="330" class="m" fill="#F0525A">À BANNIR</text>
<text x="576" y="354" class="q">« Moreau a encore fait</text>
<text x="576" y="372" class="q">n'importe quoi. »</text>
<text x="28" y="420" class="q">Le journal est la mémoire officielle de l'opération : il pré-remplit le débriefing.</text>
</svg>
