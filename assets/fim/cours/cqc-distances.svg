<rect x="460" y="84" width="6" height="96" fill="#F0525A"/>
<text x="484" y="112" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#F0525A" font-weight="700">Zone de contact (bras tendu)</text><text x="484" y="136" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#E8EAF0">L'individu peut frapper ou saisir.</text><text x="484" y="154" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#E8EAF0">N'y entrer que pour menotter ou maîtriser.</text><rect x="460.5" y="190.5" width="311" height="95" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<rect x="460" y="190" width="6" height="96" fill="#F0A83C"/>
<text x="484" y="218" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#F0A83C" font-weight="700">Distance de réaction ≈ 2 pas</text><text x="484" y="242" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#E8EAF0">Assez près pour donner les ordres,</text><text x="484" y="260" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#E8EAF0">assez loin pour réagir à un geste.</text><rect x="460.5" y="296.5" width="311" height="95" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<rect x="460" y="296" width="6" height="96" fill="#4FD895"/>
<text x="484" y="324" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#4FD895" font-weight="700">Zone de sécurité</text><text x="484" y="348" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#E8EAF0">Observation, couverture du binôme,</text><text x="484" y="366" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#E8EAF0">approche et repli.</text>
<line x1="28" y1="412" x2="772" y2="412" stroke="#2A2E3A" stroke-width="1"/>
<text x="28" y="433" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9297A8">Vue de dessus · on donne les ordres depuis la zone orange, jamais au contact.</text>
