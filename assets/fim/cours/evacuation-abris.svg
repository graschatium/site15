<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Chronologie de l'évacuation : alerte et abris ouverts, fermeture automatique après 2 à 3 minutes, personnel resté dehors pris en charge par les FIM, puis extraction, examen et quarantaine.">
<title>La course contre les abris</title>
