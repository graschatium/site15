<text x="612" y="214" class="m" fill="#6E76FF">FIN D'ALERTE</text><text x="612" y="238" class="h">Fin</text>
<text x="612" y="264" class="b">Extraction,</text>
<text x="612" y="282" class="b">examen médical,</text>
<text x="612" y="300" class="b">quarantaine.</text>
<path d="M679 336H689V350H703V360H689V374H679V360H665V350H679Z" fill="none" stroke="#6E76FF" stroke-width="2"/>
<text x="28" y="432" class="s">Après la fermeture, plus personne n'entre : les FIM recherchent et récupèrent les manquants.</text>
