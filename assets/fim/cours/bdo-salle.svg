<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" width="800" height="452" role="img" aria-label="Flux d'information entre le terrain, la salle du BDO (indicatif BUREAU), le Commandement (NID) et les départements, et l'ordre de priorité des messages radio.">
<title>La salle des opérations</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.h{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.hc{font:700 15px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0;text-anchor:middle}
.s{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.sc{font:12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8;text-anchor:middle}
.q{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6}
.qc{font:italic 12.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#C9CCD6;text-anchor:middle}
.m{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px}
.mc{font:700 10.5px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;text-anchor:middle}
.n{font:700 13px "JetBrains Mono",Consolas,monospace}
.f{font:12px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6072"/></marker></defs>
<rect width="800" height="452" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="451" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · BUREAU DES OPÉRATIONS</text>
<text x="28" y="60" class="t">La salle des opérations</text>
<text x="28" y="96" class="m" fill="#F0A83C">TERRAIN</text>
<rect x="28" y="108" width="170" height="38" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="108" width="3" height="38" fill="#F0A83C"/>
<text x="42" y="132" class="s" fill="#E8EAF0">RENARD-1 (chef)</text>
<rect x="28" y="156" width="170" height="38" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="156" width="3" height="38" fill="#F0A83C"/>
<text x="42" y="180" class="s" fill="#E8EAF0">RENARD-2</text>
<rect x="28" y="204" width="170" height="38" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="204" width="3" height="38" fill="#F0A83C"/>
<text x="42" y="228" class="s" fill="#E8EAF0">MARTEAU-2 (renfort)</text>
<rect x="286" y="96" width="228" height="190" fill="#151821" stroke="#6E76FF" stroke-width="2"/>
<text x="400" y="124" class="mc" fill="#6E76FF">SALLE · BUREAU</text>
<text x="400" y="156" class="sc" fill="#E8EAF0">Écoute le réseau</text>
<text x="400" y="180" class="sc" fill="#E8EAF0">Note au journal</text>
<text x="400" y="204" class="sc" fill="#E8EAF0">Transmet</text>
<text x="400" y="228" class="sc" fill="#E8EAF0">Anticipe (renforts, Médical)</text>
<text x="400" y="272" class="qc">Ne commande pas à la place du chef</text>
<text x="602" y="96" class="m" fill="#A78BFA">COMMANDEMENT</text>
<rect x="602" y="108" width="170" height="38" fill="#151821" stroke="#2A2E3A"/><rect x="602" y="108" width="3" height="38" fill="#A78BFA"/>
<text x="616" y="132" class="s" fill="#E8EAF0">NID : décisions, codes</text>
<text x="602" y="176" class="m" fill="#5AA9FF">DÉPARTEMENTS</text>
<rect x="602" y="188" width="170" height="28" fill="#151821" stroke="#2A2E3A"/><rect x="602" y="188" width="3" height="28" fill="#5AA9FF"/>
<text x="616" y="207" class="s" fill="#E8EAF0">Médical</text>
<rect x="602" y="222" width="170" height="28" fill="#151821" stroke="#2A2E3A"/><rect x="602" y="222" width="3" height="28" fill="#5AA9FF"/>
<text x="616" y="241" class="s" fill="#E8EAF0">Sécurité (DSE)</text>
<rect x="602" y="256" width="170" height="28" fill="#151821" stroke="#2A2E3A"/><rect x="602" y="256" width="3" height="28" fill="#5AA9FF"/>
<text x="616" y="275" class="s" fill="#E8EAF0">Ingénierie / Scientifique</text>
<line x1="202" y1="127" x2="282" y2="127" stroke="#5B6072" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="202" y1="175" x2="282" y2="175" stroke="#5B6072" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="202" y1="223" x2="282" y2="223" stroke="#5B6072" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="518" y1="127" x2="598" y2="127" stroke="#5B6072" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="518" y1="236" x2="598" y2="236" stroke="#5B6072" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="28" y="324" class="m" fill="#E8EAF0">PRIORITÉ DES MESSAGES RADIO</text>
<rect x="28" y="338" width="176" height="44" fill="#F0525A" fill-opacity=".12" stroke="#F0525A" stroke-opacity=".6"/>
<text x="40" y="365" class="n" fill="#F0525A">1</text>
<text x="60" y="365" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#F0525A">AU SOL · MÉDIC</text>
<rect x="216" y="338" width="176" height="44" fill="#F0A83C" fill-opacity=".12" stroke="#F0A83C" stroke-opacity=".6"/>
<text x="228" y="365" class="n" fill="#F0A83C">2</text>
<text x="248" y="365" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#F0A83C">CONTACT · BRÈCHE</text>
<rect x="404" y="338" width="176" height="44" fill="#5AA9FF" fill-opacity=".12" stroke="#5AA9FF" stroke-opacity=".6"/>
<text x="416" y="365" class="n" fill="#5AA9FF">3</text>
<text x="436" y="365" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#5AA9FF">COMPTES RENDUS</text>
<rect x="592" y="338" width="176" height="44" fill="#5B6072" fill-opacity=".12" stroke="#5B6072" stroke-opacity=".6"/>
<text x="604" y="365" class="n" fill="#9297A8">4</text>
<text x="624" y="365" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#9297A8">LE RESTE</text>
<text x="28" y="412" class="q">Format : « BUREAU à RENARD-1, Médical en route au checkpoint, terminé. »</text>
<text x="28" y="432" class="q">Plusieurs opérations : chaque message commence par le nom de code (« FAUCON : renfort en route »).</text>
</svg>
