<text x="170" y="311" class="b">Défense</text>
<text x="330" y="311" class="s">Attaque du Site · Nu-7 prend le commandement</text>
<rect x="696.5" y="294.5" width="69" height="23" fill="#0E1016" stroke="#B07CFF"/>
<text x="731" y="311" class="q" fill="#B07CFF">P2</text>
