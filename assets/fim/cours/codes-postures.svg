<rect x="28" y="328" width="20" height="35" fill="#E8EAF0"/>
<text x="62" y="351" class="k" fill="#E8EAF0">BLANC</text>
<text x="170" y="351" class="b">Identification</text>
<text x="330" y="351" class="s">Intrus non identifiés · pas de tir sans ordre</text>
