<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Échelle des huit codes d'alerte du Site-15, de VERT Garnison en posture P5 à NOIR Dernier rempart en posture P1.">
<title>Codes d'alerte du Site-15</title>
<style>
