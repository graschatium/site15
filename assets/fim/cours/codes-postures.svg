<text x="731" y="391" class="q" fill="#7A7F8E">P1</text>
<path d="M786 90V400" stroke="#2A2E3A" stroke-width="2"/>
<path d="M781 390L786 400L791 390Z" fill="#5A6072"/>
<text x="28" y="434" class="s">Posture P5 → P1 : du plus calme au plus critique. Seul le Commandement annonce ou lève un code.</text>
