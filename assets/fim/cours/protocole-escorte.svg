<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Formation d'escorte en losange vue de dessus : tête, flanc gauche, flanc droit et serre-file autour de l'anomalie ou de la personne escortée.">
<title>Formation d'escorte</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.h{font:700 14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.b{font:700 13.5px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.s{font:12px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.m{font:10px "JetBrains Mono",Consolas,monospace;letter-spacing:1.5px;fill:#9297A8}
.o{fill:#6E76FF;stroke:#E8EAF0;stroke-width:1.5}
.v{fill:#6E76FF;fill-opacity:0.14;stroke:#6E76FF;stroke-opacity:0.4}
.c{text-anchor:middle}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9297A8"/></marker>
</defs>
<rect width="800" height="450" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · PROTOCOLES</text>
<text x="28" y="60" class="t">Formation d'escorte / transfert</text>

<!-- sens de déplacement -->
<text x="170" y="88" class="m">SENS DE DÉPLACEMENT</text>
<line x1="170" y1="98" x2="470" y2="98" stroke="#9297A8" stroke-width="2" marker-end="url(#a)"/>

<!-- couloir -->
<rect x="80" y="112" width="490" height="300" fill="#12141B" stroke="#2A2E3A" stroke-dasharray="6 4"/>

<!-- secteurs de surveillance -->
<path d="M484 262L540 230V294Z" class="v"/>
<path d="M156 262L100 230V294Z" class="v"/>
<path d="M320 148L288 118H352Z" class="v"/>
<path d="M320 376L288 406H352Z" class="v"/>

<!-- losange -->
<path d="M170 262L320 162L470 262L320 362Z" fill="none" stroke="#5A6072" stroke-width="1.5" stroke-dasharray="5 4"/>

<!-- opérateurs -->
<rect x="456" y="248" width="28" height="28" class="o"/>
<text x="470" y="238" class="h c">Tête</text>
<rect x="156" y="248" width="28" height="28" class="o"/>
<text x="162" y="236" class="h c">Serre-file</text>
<rect x="306" y="148" width="28" height="28" class="o"/>
<text x="346" y="167" class="h">Flanc gauche</text>
<rect x="306" y="348" width="28" height="28" class="o"/>
<text x="346" y="367" class="h">Flanc droit</text>

<!-- escorté -->
<rect x="302" y="244" width="36" height="36" fill="#1E1626" stroke="#B07CFF" stroke-width="1.5"/>
<path d="M310 252L330 272M330 252L310 272" stroke="#B07CFF" stroke-width="3"/>
<text x="320" y="300" class="m c" style="fill:#B07CFF">ANOMALIE OU</text>
<text x="320" y="313" class="m c" style="fill:#B07CFF">PERSONNE ESCORTÉE</text>

<!-- règles -->
<rect x="584" y="84" width="188" height="328" fill="#151821" stroke="#2A2E3A"/>
<text x="598" y="106" class="m" style="fill:#6E76FF;letter-spacing:2px">RÈGLES</text>
<rect x="598" y="124" width="3" height="48" fill="#4FD895"/>
<text x="610" y="138" class="b">Déplacement continu</text>
<text x="610" y="157" class="s">On ne s'arrête pas</text>
<text x="610" y="172" class="s">dans les couloirs.</text>
<rect x="598" y="194" width="3" height="48" fill="#5AA9FF"/>
<text x="610" y="208" class="b">Radio réduite</text>
<text x="610" y="227" class="s">Annonces courtes,</text>
<text x="610" y="242" class="s">canal dédié.</text>
<rect x="598" y="264" width="3" height="128" fill="#F0525A"/>
<text x="610" y="278" class="b">En cas d'attaque</text>
<text x="610" y="304" class="s"><tspan fill="#E8EAF0">1.</tspan> Couvrir l'escorté</text>
<text x="610" y="328" class="s"><tspan fill="#E8EAF0">2.</tspan> L'abriter</text>
<text x="610" y="352" class="s"><tspan fill="#E8EAF0">3.</tspan> Riposter</text>
<text x="610" y="384" class="m">DANS CET ORDRE</text>

<text x="28" y="434" class="s">Chaque opérateur surveille son secteur ; l'escorté reste toujours au centre de la formation.</text>
</svg>
