<text x="200" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">ORDRE</text>
<text x="200" y="191" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">PUBLIÉ</text>
<text x="200" y="230" class="f" style="font-size:11px">Onglet</text>
<text x="200" y="246" class="f" style="font-size:11px">Opérations</text>
