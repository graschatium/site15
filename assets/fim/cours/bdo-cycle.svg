<text x="28" y="34" class="e">FIM · BUREAU DES OPÉRATIONS</text>
<text x="28" y="60" class="t">Le cycle de vie d'une opération</text>
<rect x="28" y="120" width="74" height="150" fill="#151821" stroke="#2A2E3A"/>
<rect x="28" y="120" width="74" height="3" fill="#6E76FF"/>
<text x="36" y="146" class="n" fill="#6E76FF">01</text>
<text x="36" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">DEMANDE</text>
<text x="36" y="230" class="f" style="font-size:11px">Incident,</text>
<text x="36" y="246" class="f" style="font-size:11px">ordre</text>
