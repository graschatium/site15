<text x="118" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">PLANIFI-</text>
<text x="118" y="191" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">CATION</text>
<text x="118" y="230" class="f" style="font-size:11px">Unité,</text>
<text x="118" y="246" class="f" style="font-size:11px">équipe</text>
