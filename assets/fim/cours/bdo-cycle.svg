<text x="364" y="146" class="n" fill="#F0A83C">05</text>
<text x="364" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">LANCEMENT</text>
<text x="364" y="230" class="f" style="font-size:11px">Au</text>
<text x="364" y="246" class="f" style="font-size:11px">ralliement</text>
<line x1="430" y1="195" x2="438" y2="195" stroke="#5B6072" stroke-width="1.5"/>
<rect x="438" y="120" width="74" height="150" fill="#151821" stroke="#2A2E3A"/>
<rect x="438" y="120" width="74" height="3" fill="#F0A83C"/>
<text x="446" y="146" class="n" fill="#F0A83C">06</text>
<text x="446" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">CONDUITE</text>
<text x="446" y="230" class="f" style="font-size:11px">Radio,</text>
<text x="446" y="246" class="f" style="font-size:11px">journal</text>
<line x1="512" y1="195" x2="520" y2="195" stroke="#5B6072" stroke-width="1.5"/>
