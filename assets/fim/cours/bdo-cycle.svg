<text x="282" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">ANNONCE</text>
<text x="282" y="230" class="f" style="font-size:11px">Discord,</text>
<text x="282" y="246" class="f" style="font-size:11px">présences</text>
