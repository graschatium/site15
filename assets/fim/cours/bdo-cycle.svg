<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" width="800" height="445" role="img" aria-label="Les neuf étapes d'une opération, de la demande à l'analyse, avec les statuts du terminal : planifiée, en cours, terminée.">
<title>Le cycle de vie d'une opération</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
