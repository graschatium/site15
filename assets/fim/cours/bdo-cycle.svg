<text x="528" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">CLÔTURE</text>
<text x="528" y="230" class="f" style="font-size:11px">Compte</text>
<text x="528" y="246" class="f" style="font-size:11px">final</text>
<line x1="594" y1="195" x2="602" y2="195" stroke="#5B6072" stroke-width="1.5"/>
<rect x="602" y="120" width="74" height="150" fill="#151821" stroke="#2A2E3A"/>
<rect x="602" y="120" width="74" height="3" fill="#4FD895"/>
<text x="610" y="146" class="n" fill="#4FD895">08</text>
<text x="610" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">DÉBRIEF.</text>
<text x="610" y="230" class="f" style="font-size:11px">Rapport</text>
<text x="610" y="246" class="f" style="font-size:11px">après action</text>
<line x1="676" y1="195" x2="684" y2="195" stroke="#5B6072" stroke-width="1.5"/>
<rect x="684" y="120" width="74" height="150" fill="#151821" stroke="#2A2E3A"/>
<rect x="684" y="120" width="74" height="3" fill="#5AA9FF"/>
<text x="692" y="146" class="n" fill="#5AA9FF">09</text>
<text x="692" y="176" class="m" style="font-size:9.5px;letter-spacing:1px" fill="#E8EAF0">ANALYSE</text>
<text x="692" y="230" class="f" style="font-size:11px">Leçons,</text>
<text x="692" y="246" class="f" style="font-size:11px">doctrine</text>
<text x="28" y="104" class="m" fill="#5B6072">STATUT DANS LE TERMINAL</text>
<rect x="192" y="290" width="156" height="30" fill="#9297A8" fill-opacity=".14" stroke="#9297A8" stroke-opacity=".6"/>
<text x="270.0" y="310" class="mc" fill="#E8EAF0">PLANIFIÉE</text>
<rect x="356" y="290" width="156" height="30" fill="#F0A83C" fill-opacity=".14" stroke="#F0A83C" stroke-opacity=".6"/>
<text x="434.0" y="310" class="mc" fill="#F0A83C">EN COURS</text>
<rect x="520" y="290" width="156" height="30" fill="#4FD895" fill-opacity=".14" stroke="#4FD895" stroke-opacity=".6"/>
<text x="598.0" y="310" class="mc" fill="#4FD895">TERMINÉE</text>
<rect x="28" y="344" width="744" height="78" fill="#151821" stroke="#2A2E3A"/><rect x="28" y="344" width="3" height="78" fill="#6E76FF"/>
<text x="46" y="368" class="m" fill="#6E76FF">POUR LE BDO</text>
<text x="46" y="390" class="s">Une opération n'est finie qu'une fois clôturée ET débriefée. Le terminal affiche « à rédiger »</text>
<text x="46" y="408" class="s">tant que le débriefing manque. L'analyse transforme les leçons en doctrine et en cours.</text>
</svg>
