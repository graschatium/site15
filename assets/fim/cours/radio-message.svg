<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Quatre blocs : qui appelle, qui est appelé, quoi, où, avec l'exemple RENARD-2 à NID : contact SCP-049, couloir est ZCL, vers l'infirmerie ; puis le SITREP : situation, position, effectifs, besoins.">
<title>Structure d'un message radio</title>
