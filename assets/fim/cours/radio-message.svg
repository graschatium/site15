<text x="422" y="116" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#F0A83C" font-weight="700" letter-spacing="2">03</text><text x="422" y="142" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#E8EAF0" font-weight="700">QUOI</text><text x="422" y="162" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9297A8">L'information clé</text><rect x="418.5" y="174.5" width="152" height="37" fill="#0E1016" stroke="#F0A83C" stroke-width="1"/>
