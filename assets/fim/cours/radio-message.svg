<text x="44" y="258" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#9297A8" letter-spacing="2">EXEMPLE</text><text x="44" y="288" font-family="JetBrains Mono, Consolas, monospace" font-size="14.5" font-weight="700" fill="#E8EAF0">« <tspan fill="#6E76FF">RENARD-2</tspan> <tspan fill="#B07CFF">à NID</tspan> : <tspan fill="#F0A83C">CONTACT SCP-049</tspan>, <tspan fill="#4FD895">couloir est ZCL, vers l'infirmerie</tspan>. »</text><rect x="28.5" y="320.5" width="743" height="79" fill="#151821" stroke="#2A2E3A" stroke-width="1"/>
<text x="44" y="342" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#6E76FF" letter-spacing="2">SITREP · COMPTE RENDU DE SITUATION</text><rect x="44" y="358" width="8" height="8" fill="#6E76FF"/>
<text x="60" y="367" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Situation</text><text x="60" y="386" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">ce qui se passe</text><rect x="226" y="358" width="8" height="8" fill="#6E76FF"/>
<text x="242" y="367" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Position</text><text x="242" y="386" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">où vous êtes</text><rect x="408" y="358" width="8" height="8" fill="#6E76FF"/>
<text x="424" y="367" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Effectifs</text><text x="424" y="386" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">combien, blessés ?</text><rect x="590" y="358" width="8" height="8" fill="#6E76FF"/>
<text x="606" y="367" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Besoins</text><text x="606" y="386" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12" fill="#9297A8">renforts, soins, munitions</text>
<line x1="28" y1="412" x2="772" y2="412" stroke="#2A2E3A" stroke-width="1"/>
<text x="28" y="433" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9297A8">Court, clair, indicatifs en premier. Attendre l'accusé « reçu » avant de répéter.</text>
