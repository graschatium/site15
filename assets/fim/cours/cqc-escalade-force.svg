<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Escalier en quatre niveaux du vert au rouge : coopère, résiste sans violence, agresse à mains nues, menace avec une arme, avec la réponse adaptée à chaque niveau.">
<title>Proportionnalité de la force</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4FD895"/>
</marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F0525A"/>
</marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9297A8"/>
</marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F0A83C"/>
</marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6E76FF"/>
</marker></defs>
<rect width="800" height="450" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#6E76FF" letter-spacing="2">FIM · CQC</text>
<text x="28" y="60" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="22" fill="#E8EAF0" font-weight="700">Proportionnalité de la force</text>
<text x="28" y="100" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0" font-weight="700">Nécessaire · proportionnée · limitée dans le temps</text><text x="28" y="120" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="13" fill="#9297A8">On répond au niveau de menace, jamais au-dessus.</text><rect x="28" y="300" width="180" height="100" fill="#4FD895" fill-opacity="0.16"/>
<rect x="28" y="300" width="180" height="4" fill="#4FD895"/>
<text x="28" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#9297A8" letter-spacing="2">NIVEAU 1</text><text x="28" y="287" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#4FD895" font-weight="700">Coopère</text><text x="42" y="326" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#4FD895" letter-spacing="2">RÉPONSE</text><text x="42" y="348" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">Ordres verbaux,</text><text x="42" y="366" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">menottage.</text><rect x="216" y="240" width="180" height="160" fill="#F0A83C" fill-opacity="0.16"/>
<rect x="216" y="240" width="180" height="4" fill="#F0A83C"/>
<text x="216" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#9297A8" letter-spacing="2">NIVEAU 2</text><text x="216" y="227" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#F0A83C" font-weight="700">Résiste sans violence</text><text x="230" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#F0A83C" letter-spacing="2">RÉPONSE</text><text x="230" y="288" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">Contrôle, clé</text><text x="230" y="306" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">articulaire,</text><text x="230" y="324" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">amenée au sol.</text><rect x="404" y="180" width="180" height="220" fill="#F07A45" fill-opacity="0.16"/>
<rect x="404" y="180" width="180" height="4" fill="#F07A45"/>
<text x="404" y="146" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#9297A8" letter-spacing="2">NIVEAU 3</text><text x="404" y="167" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#F07A45" font-weight="700">Agresse à mains nues</text><text x="418" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#F07A45" letter-spacing="2">RÉPONSE</text><text x="418" y="228" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">Frappes de</text><text x="418" y="246" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">dégagement,</text><text x="418" y="264" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">puis maîtrise.</text><rect x="592" y="120" width="180" height="280" fill="#F0525A" fill-opacity="0.16"/>
<rect x="592" y="120" width="180" height="4" fill="#F0525A"/>
<text x="592" y="86" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#9297A8" letter-spacing="2">NIVEAU 4</text><text x="592" y="107" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="15" fill="#F0525A" font-weight="700">Menace avec une arme</text><text x="606" y="146" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#F0525A" letter-spacing="2">RÉPONSE</text><text x="606" y="168" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">Désarmement ou</text><text x="606" y="186" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">arme à feu</text><text x="606" y="204" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="14" fill="#E8EAF0">selon les RDE.</text>
<line x1="28" y1="412" x2="772" y2="412" stroke="#2A2E3A" stroke-width="1"/>
<text x="28" y="433" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9297A8">La force cesse dès que la menace cesse : on redescend l'escalier.</text>
</svg>
