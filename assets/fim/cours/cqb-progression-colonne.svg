<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Progression en colonne dans un couloir à trois portes latérales : la tête couvre l'avant, le milieu couvre les portes latérales, le 3 tient la porte ouverte jusqu'au passage du serre-file qui couvre l'arrière.">
<title>Progression en colonne</title>
