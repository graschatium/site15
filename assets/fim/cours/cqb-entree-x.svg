<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Entrée en X : colonne de quatre à gauche d'une porte centrale. Le 1 file en diagonale vers l'angle opposé droit, le 2 passe derrière lui vers l'angle opposé gauche ; les trajectoires se croisent dans l'embrasure.">
<title>Entrée en X (en croix)</title>
<style>
.e{font:11px "JetBrains Mono",Consolas,monospace;letter-spacing:2px;fill:#6E76FF}
.t{font:700 22px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.b{font:14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.bb{font:700 14px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#E8EAF0}
.s{font:13px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#9297A8}
.m{font:11px "JetBrains Mono",Consolas,monospace;fill:#9297A8}
.mw{font:700 11px "JetBrains Mono",Consolas,monospace;fill:#E8EAF0}
.n{font:700 13px "Space Grotesk","Segoe UI",Arial,sans-serif;fill:#FFFFFF;text-anchor:middle}
.c{text-anchor:middle}
.r{text-anchor:end}
.w{stroke:#9297A8;stroke-width:6;stroke-linecap:square;fill:none}
.f{fill:#151821}
.mv{stroke:#4FD895;stroke-width:3;fill:none}
.sec{fill:#6E76FF;fill-opacity:.12;stroke:#6E76FF;stroke-opacity:.5;stroke-dasharray:4 3}
.dz{fill:#F0525A;fill-opacity:.15}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4FD895"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F0525A"/></marker>
</defs>
<rect width="800" height="450" fill="#0E1016"/>
<rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#2A2E3A"/>
<text x="28" y="34" class="e">FIM · CQB</text>
<text x="28" y="60" class="t">Entrée en X (en croix)</text>
<rect x="200" y="95" width="420" height="205" class="f"/>
<path d="M590,125 L558.9,240.9 A120,120 0 0 1 474.1,156.1 Z" class="sec"/>
<path d="M230,125 L345.9,156.1 A120,120 0 0 1 261.1,240.9 Z" class="sec"/>
<path d="M377,300 L200,300 L200,95 L620,95 L620,300 L443,300" class="w"/>
<path d="M320,338 Q415,365 418,300 L246,140" class="mv" marker-end="url(#ah)"/>
<path d="M367,315 L398,296 L576,144" class="mv" marker-end="url(#ah)"/>
<circle cx="406" cy="289" r="9" fill="none" stroke="#E8EAF0" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="452" y="266" class="m">croisement</text>
<text x="452" y="280" class="m">dans l'embrasure</text>
<circle cx="590" cy="125" r="14" fill="#6E76FF" fill-opacity=".35" stroke="#E8EAF0" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="590" y="129.6" class="n">1</text>
<circle cx="230" cy="125" r="14" fill="#6E76FF" fill-opacity=".35" stroke="#E8EAF0" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="230" y="129.6" class="n">2</text>
<circle cx="355" cy="324" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="355" y="328.6" class="n">1</text>
<circle cx="320" cy="324" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="320" y="328.6" class="n">2</text>
<circle cx="285" cy="324" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="285" y="328.6" class="n">3</text>
<circle cx="250" cy="324" r="14" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="250" y="328.6" class="n">4</text>
<text x="250" y="362" class="m">colonne à gauche de la porte</text>
<text x="510" y="212" class="mw">1er</text>
<text x="510" y="226" class="mw">angle droit</text>
<text x="310" y="212" class="mw r">2e</text>
<text x="310" y="226" class="mw r">angle gauche</text>
<rect x="636" y="100" width="140" height="88" fill="#151821" stroke="#6E76FF" stroke-opacity=".7"/>
<text x="648" y="122" class="mw" style="fill:#6E76FF;letter-spacing:1px">TOP DÉPART</text>
<text x="648" y="142" class="s">Le 2 part quand</text>
<text x="648" y="160" class="s">le 1 a franchi</text>
<text x="648" y="178" class="s">le seuil.</text>
<rect x="636" y="210" width="140" height="106" fill="#151821" stroke="#4FD895" stroke-opacity=".7"/>
<text x="648" y="232" class="mw" style="fill:#4FD895;letter-spacing:1px">RÈGLE</text>
<text x="648" y="252" class="s">Le 1 prend le côté</text>
<text x="648" y="270" class="s">opposé à la colonne,</text>
<text x="648" y="288" class="s">le 2 le côté de</text>
<text x="648" y="306" class="s">la colonne.</text>
<line x1="28" y1="408" x2="772" y2="408" stroke="#2A2E3A"/>
<circle cx="35" cy="426" r="7" fill="#6E76FF" stroke="#E8EAF0" stroke-width="1"/>
<text x="48" y="430" class="m">Opérateur (ordre)</text>
<circle cx="188" cy="426" r="7" fill="#6E76FF" fill-opacity=".35" stroke="#E8EAF0" stroke-width="1" stroke-dasharray="2 2"/>
<text x="201" y="430" class="m">Position finale</text>
<path d="M321,426 L341,426" class="mv" marker-end="url(#ah)"/>
<text x="353" y="430" class="m">Déplacement</text>
<path d="M446,432 L464,420 L464,432 Z" class="sec"/>
<text x="472" y="430" class="m">Secteur couvert</text>
</svg>
