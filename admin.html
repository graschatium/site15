  // -----------------------------------------------------------------
  // Animation
  // -----------------------------------------------------------------
  let animationsViewMode = 'table'; // 'table' | 'calendar' — mémorisé pendant la session

  async function loadAnimationsTab() {
    const body = document.getElementById('console-body');
    body.innerHTML = "<div class=\"center-msg\">Chargement de l'emploi du temps…</div>";

    let data;
    try {
      data = await apiFetch('/api/admin/animations');
    } catch (err) {
      body.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    renderAnimationsSection(data.animations || []);
  }

  // Pour les rôles avec droit de gestion : bascule Tableau / Calendrier.
  // Pour les autres (lecture seule) : uniquement le calendrier, pas de choix.
  function renderAnimationsSection(animations) {
    const body = document.getElementById('console-body');

    if (!context.canManageAnimations) {
      body.innerHTML = '<div id="animations-view"></div>';
      renderAnimationsEdtView(animations, document.getElementById('animations-view'));
      return;
    }

    body.innerHTML = `
      <div class="view-toggle">
        <button class="toggle-btn${animationsViewMode === 'table' ? ' active' : ''}" id="toggle-table-view">Tableau</button>
        <button class="toggle-btn${animationsViewMode === 'calendar' ? ' active' : ''}" id="toggle-calendar-view">Calendrier</button>
      </div>
      <div id="animations-view"></div>
    `;

    document.getElementById('toggle-table-view').addEventListener('click', () => {
      animationsViewMode = 'table';
      renderAnimationsSection(animations);
    });
    document.getElementById('toggle-calendar-view').addEventListener('click', () => {
      animationsViewMode = 'calendar';
      renderAnimationsSection(animations);
    });

    const container = document.getElementById('animations-view');
    if (animationsViewMode === 'calendar') {
      renderAnimationsEdtView(animations, container);
    } else {
      renderAnimationsManageView(animations, container);
    }
  }

  function renderAnimationsManageView(animations, container) {
    container.innerHTML = `
      <div class="record-block">
        <div class="record-block-head"><h2>Planning</h2><span class="count">${animations.length} session(s)</span></div>
        ${
          animations.length
            ? `<table>
                <thead><tr><th>Date</th><th>Heure</th><th>Titre</th><th>Hébergeur</th><th>Description</th><th></th></tr></thead>
                <tbody>
                  ${animations
                    .map(
                      (a) => `
                    <tr data-animation-id="${escapeHtml(a.id)}">
                      <td class="mono-cell">${escapeHtml(a.date || '—')}</td>
                      <td class="mono-cell">${escapeHtml(a.time || '—')}</td>
                      <td>${escapeHtml(a.title || '—')}</td>
                      <td>${escapeHtml(a.host || '—')}</td>
                      <td>${escapeHtml(a.description || '—')}</td>
                      <td><button class="btn danger small delete-animation-btn" data-animation-id="${escapeHtml(a.id)}">Supprimer</button></td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucune animation planifiée.</div>'
        }
      </div>

      <div class="subsection">
        <h3>Planifier une animation</h3>
        <form id="add-animation-form">
          <div class="field-grid">
            <div class="field-row"><label>Titre *</label><input type="text" id="animation-title" required></div>
            <div class="field-row"><label>Hébergeur</label><input type="text" id="animation-host" placeholder="Optionnel"></div>
            <div class="field-row"><label>Date</label><input type="date" id="animation-date"></div>
            <div class="field-row"><label>Heure</label><input type="time" id="animation-time"></div>
          </div>
          <div class="field-row"><label>Description</label><textarea id="animation-description" rows="2"></textarea></div>
          <button class="btn" type="submit">Ajouter au planning</button>
        </form>
      </div>
    `;

    container.querySelectorAll('.delete-animation-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Supprimer cette animation du planning ?')) return;
        try {
          await apiFetch(`/api/admin/animations/${encodeURIComponent(btn.dataset.animationId)}`, { method: 'DELETE' });
          showToast('Animation supprimée.', 'success');
          loadAnimationsTab();
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
    });

    document.getElementById('add-animation-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('animation-title').value.trim();
      const date = document.getElementById('animation-date').value;
      const time = document.getElementById('animation-time').value;
      const host = document.getElementById('animation-host').value.trim();
      const description = document.getElementById('animation-description').value.trim();

      if (!title) {
        showToast('Le titre est obligatoire.', 'error');
        return;
      }

      try {
        await apiFetch('/api/admin/animations', { method: 'POST', body: JSON.stringify({ title, date, time, host, description }) });
        showToast('Animation ajoutée.', 'success');
        loadAnimationsTab();
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    });
  }

  // Vue calendrier "EDT" en grille hebdomadaire. Lecture seule pour tout le
  // monde (même les managers, qui utilisent le tableau pour ajouter/
  // supprimer — cette vue sert juste à visualiser). Navigation semaine par
  // semaine ; chaque session est casée dans la colonne du jour et la ligne
  // de l'heure (arrondie à l'heure pleine, pas de positionnement au pixel
  // près faute de durée renseignée).
  function renderAnimationsEdtView(allAnimations, container) {
    const HOURS = Array.from({ length: 16 }, (_, i) => 8 + i); // 08h -> 23h
    const DAY_LABELS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = (day === 0 ? -6 : 1) - day;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function isoDate(d) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    let weekStart = getMonday(new Date());

    function draw() {
      const days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        return d;
      });
      const dayISOs = days.map(isoDate);
      const todayISO = isoDate(new Date());

      const eventsByCell = {};
      allAnimations.forEach((a) => {
        if (!dayISOs.includes(a.date)) return;
        const hourNum = parseInt((a.time || '').split(':')[0], 10);
        const h = Number.isFinite(hourNum) ? Math.min(Math.max(hourNum, 8), 23) : 8;
        const key = `${a.date}_${h}`;
        (eventsByCell[key] = eventsByCell[key] || []).push(a);
      });

      const rangeLabel = `${days[0].toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' })} – ${days[6].toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}`;

      container.innerHTML = `
        <div class="edt-toolbar">
          <button class="btn ghost small" id="edt-prev">◀ Précédente</button>
          <span class="edt-range mono">${rangeLabel}</span>
          <button class="btn ghost small" id="edt-next">Suivante ▶</button>
        </div>
        <div class="edt-grid-wrap">
          <div class="edt-grid">
            <div class="edt-corner"></div>
            ${days
              .map(
                (d, i) =>
                  `<div class="edt-day-head${dayISOs[i] === todayISO ? ' today' : ''}">${DAY_LABELS[i]}<span class="mono">${d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })}</span></div>`
              )
              .join('')}
            ${HOURS.map(
              (h) => `
              <div class="edt-time-cell mono">${String(h).padStart(2, '0')}:00</div>
              ${dayISOs
                .map((iso) => {
                  const evs = eventsByCell[`${iso}_${h}`] || [];
                  return `<div class="edt-cell${iso === todayISO ? ' today' : ''}">${evs
                    .map(
                      (a) =>
                        `<div class="edt-event" title="${escapeHtml(a.description || '')}"><strong>${escapeHtml(a.title || '')}</strong>${a.host ? `<span>${escapeHtml(a.host)}</span>` : ''}</div>`
                    )
                    .join('')}</div>`;
                })
                .join('')}
            `
            ).join('')}
          </div>
        </div>
      `;

      document.getElementById('edt-prev').addEventListener('click', () => {
        weekStart.setDate(weekStart.getDate() - 7);
        draw();
      });
      document.getElementById('edt-next').addEventListener('click', () => {
        weekStart.setDate(weekStart.getDate() + 7);
        draw();
      });
    }

    draw();
  }

  // -----------------------------------------------------------------
  // Candidatures
  // -----------------------------------------------------------------
  const APPLICATION_STATUS_LABELS = {
    pending: { label: '🟡 En attente', cls: 'status-inactif' },
    accepted: { label: '🟢 Acceptée', cls: 'status-actif' },
    rejected: { label: '🔴 Refusée', cls: 'status-archivé' },
  };

  async function loadApplicationsTab() {
    const body = document.getElementById('console-body');
    body.innerHTML = '<div class="center-msg">Chargement des candidatures…</div>';

    let appsData;
    let formsData;
    try {
      [appsData, formsData] = await Promise.all([
        apiFetch('/api/admin/applications'),
        apiFetch('/api/admin/forms'),
      ]);
    } catch (err) {
      body.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const applications = appsData.applications || [];
    const forms = formsData.forms || [];
    const formsById = Object.fromEntries(forms.map((f) => [f.id, f]));

    body.innerHTML = `
      <div class="record-block">
        <div class="record-block-head"><h2>Formulaires</h2><span class="count">${forms.length}</span></div>
        ${
          forms.length
            ? `<table>
                <thead><tr><th>Titre</th><th>Sections</th><th>Statut</th><th></th></tr></thead>
                <tbody>
                  ${forms
                    .map(
                      (f) => `
                    <tr>
                      <td>${escapeHtml(f.title)} <span class="mono-cell">(${escapeHtml(f.id)})</span></td>
                      <td class="mono-cell">${(f.sections || []).length}</td>
                      <td><span class="status-pill ${f.active ? 'status-actif' : 'status-archivé'}">${f.active ? 'Actif' : 'Archivé'}</span></td>
                      <td>
                        <button class="btn ghost small edit-form-btn" data-form-id="${escapeHtml(f.id)}">Modifier</button>
                        <button class="btn small toggle-form-active-btn" data-form-id="${escapeHtml(f.id)}" data-active="${f.active ? '1' : '0'}">${f.active ? 'Archiver' : 'Réactiver'}</button>
                      </td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucun formulaire.</div>'
        }
        <div style="margin-top:14px;">
          <button class="btn ghost small" id="create-form-btn">+ Créer un formulaire</button>
        </div>
      </div>

      <div class="field-grid" style="max-width:560px;">
        <div class="field-row">
          <label>Filtrer par formulaire</label>
          <select id="application-form-filter">
            <option value="">Tous</option>
            ${forms.map((f) => `<option value="${escapeHtml(f.id)}">${escapeHtml(f.title)}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <label>Filtrer par statut</label>
          <select id="application-status-filter">
            <option value="">Toutes</option>
            <option value="pending">En attente</option>
            <option value="accepted">Acceptées</option>
            <option value="rejected">Refusées</option>
          </select>
        </div>
      </div>

      <div class="record-block">
        <div class="record-block-head"><h2>Candidatures</h2><span class="count" id="applications-count">${applications.length}</span></div>
        <div id="applications-list"></div>
      </div>
    `;

    function currentFilters() {
      return {
        formId: document.getElementById('application-form-filter').value,
        status: document.getElementById('application-status-filter').value,
      };
    }

    function applyFilters() {
      const { formId, status } = currentFilters();
      let list = applications;
      if (formId) list = list.filter((a) => a.formId === formId);
      if (status) list = list.filter((a) => a.status === status);
      renderList(list);
    }

    function renderList(list) {
      const container = document.getElementById('applications-list');
      document.getElementById('applications-count').textContent = list.length;

      if (!list.length) {
        container.innerHTML = '<div class="empty-row">Aucune candidature.</div>';
        return;
      }

      container.innerHTML = `
        <table>
          <thead><tr><th>Candidat</th><th>Formulaire</th><th>Soumise le</th><th>Statut</th><th></th></tr></thead>
          <tbody>
            ${list
              .map((a) => {
                const st = APPLICATION_STATUS_LABELS[a.status] || APPLICATION_STATUS_LABELS.pending;
                const formTitle = formsById[a.formId]?.title || a.formId || '—';
                return `
              <tr data-application-id="${escapeHtml(a.id)}" class="application-row">
                <td class="mono-cell">${escapeHtml(a.username || a.discordId || '—')}</td>
                <td>${escapeHtml(formTitle)}</td>
                <td class="mono-cell">${a.submittedAt ? new Date(a.submittedAt).toLocaleString('fr-FR') : '—'}</td>
                <td><span class="status-pill ${st.cls}">${st.label}</span></td>
                <td><button class="btn ghost small view-application-btn" data-application-id="${escapeHtml(a.id)}">Voir</button></td>
              </tr>
              <tr class="application-detail-row" data-detail-for="${escapeHtml(a.id)}" style="display:none;">
                <td colspan="5"><div class="application-detail" id="detail-${escapeHtml(a.id)}"></div></td>
              </tr>`;
              })
              .join('')}
          </tbody>
        </table>
      `;

      container.querySelectorAll('.view-application-btn').forEach((btn) => {
        btn.addEventListener('click', () => toggleApplicationDetail(btn.dataset.applicationId));
      });
    }

    async function toggleApplicationDetail(id) {
      const row = document.querySelector(`.application-detail-row[data-detail-for="${id}"]`);
      const isOpen = row.style.display !== 'none';
      if (isOpen) {
        row.style.display = 'none';
        return;
      }

      const detailEl = document.getElementById(`detail-${id}`);
      detailEl.innerHTML = '<div class="center-msg">Chargement…</div>';
      row.style.display = '';

      let detailData;
      try {
        detailData = await apiFetch(`/api/admin/applications/${encodeURIComponent(id)}`);
      } catch (err) {
        detailEl.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
        return;
      }

      const { application, form } = detailData;
      const questionsById = {};
      (form?.sections || []).forEach((s) => s.questions.forEach((q) => { questionsById[q.id] = q; }));

      const answersHtml = Object.entries(application.answers || {})
        .map(([qId, value]) => {
          const q = questionsById[qId];
          const label = q ? q.label : qId;
          return `<div class="answer-block"><div class="answer-q">${escapeHtml(label)}</div><div class="answer-a">${escapeHtml(String(value))}</div></div>`;
        })
        .join('');

      detailEl.innerHTML = `
        <div class="answers-grid">${answersHtml}</div>
        <div class="subsection" style="margin-top:18px;">
          <h3>Décision</h3>
          <div class="field-row"><label>Note (optionnelle)</label><textarea id="review-note-${id}" rows="2">${escapeHtml(application.reviewNote || '')}</textarea></div>
          <div style="display:flex; gap:10px;">
            <button class="btn" data-action="accept" data-application-id="${id}">Accepter</button>
            <button class="btn danger" data-action="reject" data-application-id="${id}" style="border-color:var(--bad); color:var(--bad);">Refuser</button>
          </div>
        </div>
      `;

      detailEl.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const status = btn.dataset.action === 'accept' ? 'accepted' : 'rejected';
          const note = document.getElementById(`review-note-${id}`).value.trim();
          try {
            await apiFetch(`/api/admin/applications/${encodeURIComponent(id)}`, {
              method: 'PATCH',
              body: JSON.stringify({ status, note }),
            });
            showToast('Candidature mise à jour.', 'success');
            loadApplicationsTab();
          } catch (err) {
            showToast(`Erreur : ${err.message}`, 'error');
          }
        });
      });
    }

    renderList(applications);

    document.getElementById('application-status-filter').addEventListener('change', applyFilters);
    document.getElementById('application-form-filter').addEventListener('change', applyFilters);

    document.getElementById('create-form-btn').addEventListener('click', () => openFormBuilder(null));
    body.querySelectorAll('.edit-form-btn').forEach((btn) => {
      btn.addEventListener('click', () => openFormBuilder(formsById[btn.dataset.formId]));
    });
    body.querySelectorAll('.toggle-form-active-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const wasActive = btn.dataset.active === '1';
        try {
          await apiFetch(`/api/admin/forms/${encodeURIComponent(btn.dataset.formId)}`, {
            method: 'PATCH',
            body: JSON.stringify({ active: !wasActive }),
          });
          showToast(wasActive ? 'Formulaire archivé.' : 'Formulaire réactivé.', 'success');
          loadApplicationsTab();
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
    });
  }

  // -----------------------------------------------------------------
  // Form builder — création/édition d'un formulaire de recrutement, sans
  // toucher au code. L'état en mémoire (builderState) ne garde QUE la
  // structure (sections/questions/types) nécessaire au rendu ; les valeurs
  // textuelles (titres, intitulés, options) sont relues directement dans le
  // DOM au moment de l'enregistrement ou avant toute modification de
  // structure (syncBuilderStateFromDom), pour ne jamais perdre ce que
  // l'utilisateur a tapé lors d'un ajout/suppression de question.
  // -----------------------------------------------------------------
  let builderState = null;

  function emptyQuestion() {
    return { id: `q_${Math.random().toString(36).slice(2, 9)}`, type: 'short', label: '', required: true, options: [], checkboxLabel: "J'accepte" };
  }

  function emptySection() {
    return { title: '', questions: [emptyQuestion()] };
  }

  function openFormBuilder(existingForm) {
    if (existingForm) {
      builderState = {
        id: existingForm.id,
        title: existingForm.title || '',
        description: existingForm.description || '',
        active: existingForm.active !== false,
        summaryQuestionIds: existingForm.summaryQuestionIds || [],
        sections: (existingForm.sections || []).map((s) => ({
          title: s.title || '',
          questions: (s.questions || []).map((q) => ({
            id: q.id,
            type: q.type,
            label: q.label || '',
            required: !!q.required,
            options: q.options || [],
            checkboxLabel: q.checkboxLabel || "J'accepte",
          })),
        })),
      };
    } else {
      builderState = { id: null, title: '', description: '', active: true, summaryQuestionIds: [], sections: [emptySection()] };
    }

    document.getElementById('console-title').textContent = existingForm ? 'Modifier le formulaire' : 'Nouveau formulaire';
    document.getElementById('console-subtitle').textContent = 'Sections et questions du formulaire de candidature.';

    const body = document.getElementById('console-body');
    body.innerHTML = '<div id="form-builder"></div>';
    renderBuilder();
  }

  function closeFormBuilder() {
    builderState = null;
    switchTab('applications');
  }

  function syncBuilderStateFromDom() {
    if (!builderState) return;
    const root = document.getElementById('form-builder');
    if (!root) return;

    builderState.title = root.querySelector('#builder-title')?.value ?? builderState.title;
    builderState.description = root.querySelector('#builder-description')?.value ?? builderState.description;
    builderState.active = root.querySelector('#builder-active')?.checked ?? builderState.active;

    builderState.sections.forEach((section, si) => {
      const sectionEl = root.querySelector(`[data-section-index="${si}"]`);
      if (!sectionEl) return;
      section.title = sectionEl.querySelector('.builder-section-title')?.value ?? section.title;

      section.questions.forEach((q, qi) => {
        const qEl = sectionEl.querySelector(`[data-question-index="${qi}"]`);
        if (!qEl) return;
        q.label = qEl.querySelector('.builder-q-label')?.value ?? q.label;
        q.type = qEl.querySelector('.builder-q-type')?.value ?? q.type;
        q.required = qEl.querySelector('.builder-q-required')?.checked ?? q.required;
        if (q.type === 'choice') {
          const raw = qEl.querySelector('.builder-q-options')?.value ?? '';
          q.options = raw.split(',').map((o) => o.trim()).filter(Boolean);
        }
        if (q.type === 'checkbox') {
          q.checkboxLabel = qEl.querySelector('.builder-q-checkbox-label')?.value ?? q.checkboxLabel;
        }
      });
    });
  }

  const QUESTION_TYPE_LABELS = {
    short: 'Réponse courte',
    long: 'Réponse longue',
    choice: 'Choix multiple',
    checkbox: 'Case à cocher',
    scale: 'Échelle 1-10',
  };

  function renderBuilder() {
    const root = document.getElementById('form-builder');

    root.innerHTML = `
      <div class="field-row"><label>Titre du formulaire *</label><input type="text" id="builder-title" value="${escapeHtml(builderState.title)}"></div>
      <div class="field-row"><label>Description</label><textarea id="builder-description" rows="2">${escapeHtml(builderState.description)}</textarea></div>
      <div class="field-row" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="builder-active" ${builderState.active ? 'checked' : ''}>
        <label style="margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);">Formulaire actif (visible sur /postuler.html)</label>
      </div>

      <div id="builder-sections">
        ${builderState.sections
          .map(
            (section, si) => `
          <div class="builder-section" data-section-index="${si}">
            <div class="builder-section-head">
              <input type="text" class="builder-section-title" placeholder="Titre de la section" value="${escapeHtml(section.title)}">
              <button type="button" class="btn danger small builder-remove-section" data-section-index="${si}">Supprimer la section</button>
            </div>
            ${section.questions
              .map(
                (q, qi) => `
              <div class="builder-question" data-question-index="${qi}">
                <div class="field-grid">
                  <div class="field-row"><label>Intitulé de la question *</label><input type="text" class="builder-q-label" value="${escapeHtml(q.label)}"></div>
                  <div class="field-row">
                    <label>Type</label>
                    <select class="builder-q-type" data-section-index="${si}" data-question-index="${qi}">
                      ${Object.entries(QUESTION_TYPE_LABELS)
                        .map(([val, lbl]) => `<option value="${val}" ${q.type === val ? 'selected' : ''}>${lbl}</option>`)
                        .join('')}
                    </select>
                  </div>
                </div>
                ${
                  q.type === 'choice'
                    ? `<div class="field-row"><label>Options (séparées par des virgules)</label><input type="text" class="builder-q-options" value="${escapeHtml((q.options || []).join(', '))}"></div>`
                    : ''
                }
                ${
                  q.type === 'checkbox'
                    ? `<div class="field-row"><label>Texte de la case à cocher</label><input type="text" class="builder-q-checkbox-label" value="${escapeHtml(q.checkboxLabel || '')}"></div>`
                    : ''
                }
                <div class="field-row" style="display:flex; align-items:center; gap:8px;">
                  <input type="checkbox" class="builder-q-required" ${q.required ? 'checked' : ''}>
                  <label style="margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);">Obligatoire</label>
                  <button type="button" class="btn danger small builder-remove-question" data-section-index="${si}" data-question-index="${qi}" style="margin-left:auto;">Retirer</button>
                </div>
              </div>
            `
              )
              .join('')}
            <button type="button" class="btn ghost small builder-add-question" data-section-index="${si}">+ Ajouter une question</button>
          </div>
        `
          )
          .join('')}
      </div>
      <button type="button" class="btn ghost small" id="builder-add-section">+ Ajouter une section</button>

      <div style="margin-top:26px; display:flex; gap:10px;">
        <button type="button" class="btn" id="builder-save">Enregistrer le formulaire</button>
        <button type="button" class="btn ghost" id="builder-cancel">Annuler</button>
      </div>
    `;

    root.querySelectorAll('.builder-q-type').forEach((sel) => {
      sel.addEventListener('change', () => {
        syncBuilderStateFromDom();
        const si = Number(sel.dataset.sectionIndex);
        const qi = Number(sel.dataset.questionIndex);
        builderState.sections[si].questions[qi].type = sel.value;
        renderBuilder();
      });
    });

    root.querySelectorAll('.builder-remove-section').forEach((btn) => {
      btn.addEventListener('click', () => {
        syncBuilderStateFromDom();
        builderState.sections.splice(Number(btn.dataset.sectionIndex), 1);
        if (!builderState.sections.length) builderState.sections.push(emptySection());
        renderBuilder();
      });
    });

    root.querySelectorAll('.builder-remove-question').forEach((btn) => {
      btn.addEventListener('click', () => {
        syncBuilderStateFromDom();
        const si = Number(btn.dataset.sectionIndex);
        builderState.sections[si].questions.splice(Number(btn.dataset.questionIndex), 1);
        if (!builderState.sections[si].questions.length) builderState.sections[si].questions.push(emptyQuestion());
        renderBuilder();
      });
    });

    root.querySelectorAll('.builder-add-question').forEach((btn) => {
      btn.addEventListener('click', () => {
        syncBuilderStateFromDom();
        builderState.sections[Number(btn.dataset.sectionIndex)].questions.push(emptyQuestion());
        renderBuilder();
      });
    });

    document.getElementById('builder-add-section').addEventListener('click', () => {
      syncBuilderStateFromDom();
      builderState.sections.push(emptySection());
      renderBuilder();
    });

    document.getElementById('builder-cancel').addEventListener('click', closeFormBuilder);

    document.getElementById('builder-save').addEventListener('click', async () => {
      syncBuilderStateFromDom();

      if (!builderState.title.trim()) {
        showToast('Le titre du formulaire est obligatoire.', 'error');
        return;
      }
      for (const section of builderState.sections) {
        for (const q of section.questions) {
          if (!q.label.trim()) {
            showToast('Chaque question doit avoir un intitulé.', 'error');
            return;
          }
          if (q.type === 'choice' && !(q.options || []).length) {
            showToast('Ajoute au moins une option pour une question à choix multiple.', 'error');
            return;
          }
        }
      }

      const payload = {
        title: builderState.title.trim(),
        description: builderState.description.trim(),
        active: builderState.active,
        summaryQuestionIds: builderState.summaryQuestionIds,
        sections: builderState.sections.map((s) => ({
          title: s.title.trim(),
          questions: s.questions.map((q) => ({
            id: q.id,
            type: q.type,
            label: q.label.trim(),
            required: !!q.required,
            ...(q.type === 'choice' ? { options: q.options } : {}),
            ...(q.type === 'checkbox' ? { checkboxLabel: q.checkboxLabel || "J'accepte" } : {}),
          })),
        })),
      };

      try {
        if (builderState.id) {
          await apiFetch(`/api/admin/forms/${encodeURIComponent(builderState.id)}`, { method: 'PATCH', body: JSON.stringify(payload) });
        } else {
          await apiFetch('/api/admin/forms', { method: 'POST', body: JSON.stringify(payload) });
        }
        showToast('Formulaire enregistré.', 'success');
        closeFormBuilder();
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    });
  }

  // -----------------------------------------------------------------
  // Permissions
  // -----------------------------------------------------------------
  async function loadPermissionsTab() {
    const body = document.getElementById('console-body');
    body.innerHTML = '<div class="center-msg">Chargement des permissions…</div>';

    let permData;
    let rolesData;
    try {
      [permData, rolesData] = await Promise.all([
        apiFetch('/api/admin/permissions'),
        apiFetch('/api/admin/permissions/roles'),
      ]);
    } catch (err) {
      body.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const configured = permData.permissions || [];
    const allRoles = rolesData.roles || [];
    const configuredIds = new Set(configured.map((p) => p.roleId));
    const unconfiguredRoles = allRoles.filter((r) => !configuredIds.has(r.id));

    const rosterLabel = { edit: 'Modification', view: 'Lecture seule', null: 'Aucun' };

    body.innerHTML = `
      <div class="record-block">
        <div class="record-block-head"><h2>Rôles configurés</h2><span class="count">${configured.length}</span></div>
        ${
          configured.length
            ? `<table>
                <thead><tr><th>Rôle</th><th>Rosters</th><th>Sanctions</th><th>Absences</th><th>Animation</th><th>Candidatures</th><th></th></tr></thead>
                <tbody>
                  ${configured
                    .map(
                      (p) => `
                    <tr data-role-id="${escapeHtml(p.roleId)}">
                      <td>${escapeHtml(p.label || p.roleId)} <span class="mono-cell">(${escapeHtml(p.roleId)})</span></td>
                      <td>
                        <select class="perm-rosters-select" data-role-id="${escapeHtml(p.roleId)}">
                          <option value="" ${!p.rosters ? 'selected' : ''}>Aucun</option>
                          <option value="view" ${p.rosters === 'view' ? 'selected' : ''}>Lecture seule</option>
                          <option value="edit" ${p.rosters === 'edit' ? 'selected' : ''}>Modification</option>
                        </select>
                      </td>
                      <td><input type="checkbox" class="perm-check" data-role-id="${escapeHtml(p.roleId)}" data-field="sanctions" ${p.sanctions ? 'checked' : ''}></td>
                      <td><input type="checkbox" class="perm-check" data-role-id="${escapeHtml(p.roleId)}" data-field="absences" ${p.absences ? 'checked' : ''}></td>
                      <td><input type="checkbox" class="perm-check" data-role-id="${escapeHtml(p.roleId)}" data-field="animations" ${p.animations ? 'checked' : ''}></td>
                      <td><input type="checkbox" class="perm-check" data-role-id="${escapeHtml(p.roleId)}" data-field="applications" ${p.applications ? 'checked' : ''}></td>
                      <td>
                        <button class="btn small save-permission-btn" data-role-id="${escapeHtml(p.roleId)}" data-label="${escapeHtml(p.label || p.roleId)}">Enregistrer</button>
                        <button class="btn danger small remove-permission-btn" data-role-id="${escapeHtml(p.roleId)}">Retirer</button>
                      </td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucun rôle configuré.</div>'
        }
      </div>

      <div class="subsection">
        <h3>Ajouter un rôle</h3>
        <div class="field-row" style="max-width:320px;">
          <label>Rôle Discord</label>
          <select id="new-role-select">
            <option value="">— Choisir un rôle —</option>
            ${unconfiguredRoles.map((r) => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field-grid" style="max-width:520px;">
          <div class="field-row">
            <label>Rosters</label>
            <select id="new-role-rosters">
              <option value="">Aucun</option>
              <option value="view">Lecture seule</option>
              <option value="edit">Modification</option>
            </select>
          </div>
          <div class="field-row" style="display:flex; align-items:center; gap:20px; padding-top:22px; flex-wrap:wrap;">
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);"><input type="checkbox" id="new-role-sanctions"> Sanctions</label>
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);"><input type="checkbox" id="new-role-absences"> Absences</label>
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);"><input type="checkbox" id="new-role-animations"> Animation</label>
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);"><input type="checkbox" id="new-role-applications"> Candidatures</label>
          </div>
        </div>
        <button class="btn" id="add-role-permission-btn" type="button">Ajouter</button>
      </div>
    `;

    async function savePermission(roleId, label) {
      const row = body.querySelector(`tr[data-role-id="${roleId}"]`);
      const rosters = row.querySelector('.perm-rosters-select').value || null;
      const sanctions = row.querySelector('[data-field="sanctions"]').checked;
      const absences = row.querySelector('[data-field="absences"]').checked;
      const animations = row.querySelector('[data-field="animations"]').checked;
      const applications = row.querySelector('[data-field="applications"]').checked;

      try {
        await apiFetch(`/api/admin/permissions/${encodeURIComponent(roleId)}`, {
          method: 'PUT',
          body: JSON.stringify({ label, rosters, sanctions, absences, animations, applications }),
        });
        showToast('Permissions enregistrées.', 'success');
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    }

    body.querySelectorAll('.save-permission-btn').forEach((btn) => {
      btn.addEventListener('click', () => savePermission(btn.dataset.roleId, btn.dataset.label));
    });

    body.querySelectorAll('.remove-permission-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Retirer tous les droits panel de ce rôle ?')) return;
        try {
          await apiFetch(`/api/admin/permissions/${encodeURIComponent(btn.dataset.roleId)}`, { method: 'DELETE' });
          showToast('Permissions retirées.', 'success');
          loadPermissionsTab();
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
    });

    document.getElementById('add-role-permission-btn').addEventListener('click', async () => {
      const select = document.getElementById('new-role-select');
      const roleId = select.value;
      if (!roleId) {
        showToast('Choisis un rôle.', 'error');
        return;
      }
      const label = select.options[select.selectedIndex].text;
      const rosters = document.getElementById('new-role-rosters').value || null;
      const sanctions = document.getElementById('new-role-sanctions').checked;
      const absences = document.getElementById('new-role-absences').checked;
      const animations = document.getElementById('new-role-animations').checked;
      const applications = document.getElementById('new-role-applications').checked;

      try {
        await apiFetch(`/api/admin/permissions/${encodeURIComponent(roleId)}`, {
          method: 'PUT',
          body: JSON.stringify({ label, rosters, sanctions, absences, animations, applications }),
        });
        showToast('Rôle ajouté.', 'success');
        loadPermissionsTab();
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    });
  }

  // -----------------------------------------------------------------
  // Dossier
  // -----------------------------------------------------------------
  const DOSSIER_SANCTION_LABELS = { ban: 'Bannissement', mute: 'Mute', kick: 'Expulsion', warn: 'Avertissement' };
  const DOSSIER_ABSENCE_LABELS = { rp: '🎭 RP', staff: '🛠️ Staff' };

  async function loadDossierTab() {
    const body = document.getElementById('console-body');
    body.innerHTML = `
      <div class="field-row" style="max-width:440px;">
        <label>Pseudo Roblox ou ID Discord</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="dossier-search-input" placeholder="Ex: firefox_ultra1">
          <button class="btn" id="dossier-search-btn" type="button">Chercher</button>
        </div>
      </div>
      <div id="dossier-results"></div>
    `;

    const input = document.getElementById('dossier-search-input');
    const runSearch = () => searchDossier(input.value.trim());
    document.getElementById('dossier-search-btn').addEventListener('click', runSearch);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
  }

  async function searchDossier(query) {
    const results = document.getElementById('dossier-results');
    if (!query) { results.innerHTML = ''; return; }

    results.innerHTML = '<div class="center-msg">Recherche…</div>';

    let data;
    try {
      data = await apiFetch(`/api/admin/dossier?q=${encodeURIComponent(query)}`);
    } catch (err) {
      results.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const { identity, robloxUsername, characters, sanctions, absences, canAddSanction } = data;

    const identityBlock = `
      <div class="card">
        <p><strong>Pseudo Roblox :</strong> ${escapeHtml(robloxUsername)}</p>
        ${
          identity
            ? `<p><strong>Compte Discord lié :</strong> <span class="mono-cell">${escapeHtml(identity.discordId)}</span> — ${identity.verified ? 'vérifié OAuth' : 'lien manuel'}</p>`
            : '<p>Aucun compte Discord lié trouvé pour ce pseudo.</p>'
        }
      </div>
    `;

    const charactersBlock = `
      <div class="record-block">
        <div class="record-block-head"><h2>Rosters</h2><span class="count">${characters.length}</span></div>
        ${
          characters.length
            ? `<table>
                <thead><tr><th>Département</th><th>Nom</th><th>Grade</th><th>Statut</th><th>Commande</th></tr></thead>
                <tbody>
                  ${characters
                    .map(
                      (c) => `
                    <tr>
                      <td class="mono-cell">${escapeHtml(c.deptId)}</td>
                      <td>${escapeHtml(c.name || '—')}</td>
                      <td>${escapeHtml(c.rank || '—')}</td>
                      <td><span class="status-pill status-${c.status || 'actif'}">${escapeHtml(c.status || 'actif')}</span></td>
                      <td>${c.command ? `<button class="btn ghost small copy-command-btn" data-command="${escapeHtml(c.command)}">Copier</button>` : '—'}</td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucun personnage trouvé.</div>'
        }
      </div>
    `;

    const sanctionsBlock = `
      <div class="record-block">
        <div class="record-block-head"><h2>Sanctions</h2><span class="count">${sanctions.length}</span></div>
        ${
          sanctions.length
            ? `<table>
                <thead><tr><th>Type</th><th>Raison</th><th>Modérateur</th><th>Date</th></tr></thead>
                <tbody>
                  ${sanctions
                    .map(
                      (s) => `
                    <tr>
                      <td>${escapeHtml(DOSSIER_SANCTION_LABELS[s.type] || s.type || '—')}</td>
                      <td>${escapeHtml(s.reason || '—')}</td>
                      <td>${escapeHtml(s.mod || '—')}</td>
                      <td class="mono-cell">${escapeHtml(s.date || '—')}</td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucune sanction.</div>'
        }
        ${
          canAddSanction
            ? `<form id="dossier-add-sanction-form" style="margin-top:18px;">
                <div class="field-grid">
                  <div class="field-row">
                    <label>Type *</label>
                    <select id="dossier-sanction-type">
                      <option value="warn">Avertissement</option>
                      <option value="kick">Expulsion</option>
                      <option value="mute">Mute</option>
                      <option value="ban">Bannissement</option>
                    </select>
                  </div>
                  <div class="field-row"><label>Durée</label><input type="text" id="dossier-sanction-duration" placeholder="Ex: 24h, permanent..."></div>
                </div>
                <div class="field-row"><label>Raison *</label><textarea id="dossier-sanction-reason" rows="2" required></textarea></div>
                <button class="btn" type="submit">Ajouter la sanction</button>
              </form>`
            : ''
        }
      </div>
    `;

    const absencesBlock = `
      <div class="record-block">
        <div class="record-block-head"><h2>Absences</h2><span class="count">${absences.length}</span></div>
        ${
          absences.length
            ? `<table>
                <thead><tr><th>Catégorie</th><th>Raison</th><th>Statut</th><th>Déclarée le</th></tr></thead>
                <tbody>
                  ${absences
                    .map(
                      (a) => `
                    <tr>
                      <td>${DOSSIER_ABSENCE_LABELS[a.category] || '🎭 RP'}</td>
                      <td>${escapeHtml(a.reason || '—')}</td>
                      <td>${a.status === 'returned' ? '🟢 De retour' : '🔴 Absent'}</td>
                      <td class="mono-cell">${a.declaredAt ? new Date(a.declaredAt).toLocaleString('fr-FR') : '—'}</td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucune absence.</div>'
        }
      </div>
    `;

    results.innerHTML = identityBlock + charactersBlock + sanctionsBlock + absencesBlock;

    results.querySelectorAll('.copy-command-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.command);
          showToast('Commande copiée.', 'success');
        } catch (err) {
          showToast('Impossible de copier.', 'error');
        }
      });
    });

    const sanctionForm = document.getElementById('dossier-add-sanction-form');
    if (sanctionForm) {
      sanctionForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('dossier-sanction-type').value;
        const duration = document.getElementById('dossier-sanction-duration').value.trim();
        const reason = document.getElementById('dossier-sanction-reason').value.trim();

        if (!reason) { showToast('La raison est obligatoire.', 'error'); return; }

        try {
          await apiFetch('/api/admin/sanctions', { method: 'POST', body: JSON.stringify({ username: robloxUsername, type, reason, duration }) });
          showToast('Sanction ajoutée.', 'success');
          searchDossier(robloxUsername);
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
    }
  }

  // -----------------------------------------------------------------
  // Point d'entrée
  // -----------------------------------------------------------------
  async function init() {
    const token = getToken();
    if (!token) { renderLoggedOut(); return; }

    try {
      context = await apiFetch('/api/admin/context');
    } catch (err) {
      if (err.message === 'forbidden') renderForbidden();
      else if (err.message === 'not_authenticated') renderLoggedOut();
      else renderError(`Impossible de charger la console : ${err.message}`);
      return;
    }

    if (!context.isAdminAnywhere) { renderForbidden(); return; }

    renderShell();
  }

  init();
</script>
<script src="assets/auth-menu.js" defer></script>
</body>
</html>
