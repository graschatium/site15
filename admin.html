<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://graschatium.github.io/site15/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #08090C;
    --void-2: #0D0F14;
    --panel: #12141B;
    --panel-raised: #171922;
    --line: #23262F;
    --line-soft: rgba(255,255,255,0.06);
    --accent: #6E76FF;
    --accent-soft: rgba(110,118,255,0.10);
    --accent-2: #A78BFA;
    --ink: #ECEDF1;
    --ink-dim: #9297A8;
    --ink-faint: #565B6B;
    --good: #4FD895;
    --warn: #F0A83C;
    --bad: #F0525A;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }

  ::selection{ background:var(--accent); color:var(--void); }
  a{ color:inherit; text-decoration:none; }

  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Space Grotesk', sans-serif; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }

  /* ---------- Shared site header ---------- */

  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    padding:22px 0;
    background:rgba(8,9,12,0.5);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid transparent;
    transition:border-color .4s ease, background .4s ease;
  }
  header.scrolled{ background:rgba(8,9,12,0.82); border-bottom-color:var(--line); }

  .nav-inner{ display:flex; align-items:center; justify-content:space-between; }

  .wordmark{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; letter-spacing:0.02em;
    display:flex; align-items:center; gap:10px;
  }
  .wordmark .logo-mark{ width:30px; height:30px; object-fit:contain; }

  nav ul{ display:flex; align-items:center; gap:36px; list-style:none; }
  nav a{ font-size:13px; color:var(--ink-dim); transition:color .25s ease; }
  nav a:hover, nav a:focus-visible{ color:var(--ink); outline:none; }
  nav a.current{ color:var(--ink); }

  .auth-menu{ position:relative; }
  .auth-login-btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Inter', sans-serif; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:6px; border:1px solid var(--line);
    color:var(--ink); background:transparent;
    transition:border-color .25s ease, color .25s ease, transform .2s ease;
  }
  .auth-login-btn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .auth-login-btn svg{ width:14px; height:14px; }
  .auth-btn{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    background:transparent; border:1px solid transparent; padding:5px 10px 5px 6px; border-radius:8px;
    font-family:'Inter', sans-serif; font-size:13px; color:var(--ink-dim);
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .auth-btn:hover{ color:var(--ink); border-color:var(--line); background:rgba(255,255,255,0.02); }
  .auth-menu.open .auth-btn{ color:var(--ink); border-color:var(--line); }
  .auth-avatar{
    width:26px; height:26px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background:var(--accent-soft); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:11px; color:var(--accent);
  }
  .auth-avatar img{ width:100%; height:100%; object-fit:cover; }
  .auth-name{ max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .auth-caret{ width:11px; height:11px; flex-shrink:0; transition:transform .25s ease; }
  .auth-menu.open .auth-caret{ transform:rotate(180deg); }
  .auth-dropdown{
    position:absolute; top:calc(100% + 12px); right:0; min-width:210px;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:10px; padding:6px;
    opacity:0; visibility:hidden; transform:translateY(-8px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s;
    box-shadow:0 24px 48px rgba(0,0,0,0.5); z-index:200;
  }
  .auth-menu.open .auth-dropdown{ opacity:1; visibility:visible; transform:translateY(0); }
  .auth-dropdown a, .auth-dropdown button{
    display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:6px;
    font-family:'Inter', sans-serif; font-size:13px; color:var(--ink-dim);
    background:transparent; border:none; cursor:pointer; text-align:left;
    transition:background .15s ease, color .15s ease;
  }
  .auth-dropdown a:hover, .auth-dropdown button:hover{ background:var(--void-2); color:var(--ink); }
  .auth-dropdown button.danger:hover{ color:var(--bad); }
  .auth-dropdown svg{ width:15px; height:15px; flex-shrink:0; }
  .auth-dropdown hr{ border:none; border-top:1px solid var(--line); margin:6px 2px; }

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:1px solid var(--accent); outline-offset:2px;
  }

  /* ---------- Console shell ---------- */

  main{ padding-top:88px; min-height:100vh; }

  .console{ display:flex; align-items:stretch; min-height:calc(100vh - 88px); }

  .console-loading, .console-message{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:80px 24px; text-align:center;
  }
  .console-message-inner{ max-width:380px; }
  .console-message-inner .display{ font-size:22px; margin-bottom:10px; }
  .console-message-inner p{ color:var(--ink-dim); font-size:14px; line-height:1.6; }
  .console-message-inner a{ color:var(--accent); text-decoration:underline; }

  .sidebar{
    width:252px; flex-shrink:0; border-right:1px solid var(--line);
    padding:28px 18px; display:flex; flex-direction:column; gap:26px;
    position:sticky; top:88px; align-self:flex-start; height:calc(100vh - 88px);
  }

  .sidebar-brand{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.14em;
    color:var(--ink-faint); text-transform:uppercase; padding:0 10px;
  }

  .clearance-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 14px 16px;
  }
  .clearance-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em;
    color:var(--ink-faint); text-transform:uppercase; display:block; margin-bottom:10px;
  }
  .clearance-badges{ display:flex; flex-wrap:wrap; gap:6px; }
  .clearance-badge{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.03em;
    padding:4px 8px; border-radius:4px; background:var(--accent-soft); color:var(--accent-2);
    border:1px solid rgba(110,118,255,0.25);
  }

  .sidebar-nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:8px; border:none; background:transparent;
    color:var(--ink-dim); font-family:'Inter', sans-serif; font-size:13.5px; font-weight:500;
    cursor:pointer; text-align:left; width:100%; position:relative;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:0.85; }
  .nav-item:hover{ background:var(--panel); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--ink); }
  .nav-item.active::before{
    content:''; position:absolute; left:-18px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--accent);
  }

  .sidebar-footer{ margin-top:auto; }
  .sidebar-footer .mono{ font-size:10px; color:var(--ink-faint); letter-spacing:0.08em; padding:0 10px; }

  .console-main{ flex:1; min-width:0; padding:40px 44px 80px; }

  .console-header{ margin-bottom:30px; }
  .console-header h1{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:600; letter-spacing:-0.01em; }
  .console-header p{ margin-top:6px; color:var(--ink-dim); font-size:13.5px; max-width:560px; }

  .console-body{ display:flex; flex-direction:column; gap:0; }

  /* ---------- Content primitives ---------- */

  .record-block{ margin-bottom:36px; }
  .record-block-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;
  }
  .record-block-head h2{ font-family:'Space Grotesk', sans-serif; font-size:15.5px; font-weight:600; }
  .record-block-head .count{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-faint); }

  .center-msg{ text-align:center; padding:56px 20px; color:var(--ink-dim); font-size:13.5px; }
  .empty-row{
    color:var(--ink-faint); font-size:13px; padding:22px 18px; text-align:center;
    border:1px dashed var(--line); border-radius:10px;
  }

  select, input, textarea{
    font-family:'Inter', sans-serif; font-size:13.5px; color:var(--ink);
    background:var(--void-2); border:1px solid var(--line); border-radius:7px;
    padding:9px 12px; width:100%;
  }
  select:focus, input:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  textarea{ resize:vertical; font-family:'Inter', sans-serif; }
  label{
    font-size:10.5px; color:var(--ink-faint); display:block; margin-bottom:6px;
    font-family:'JetBrains Mono', monospace; letter-spacing:0.06em; text-transform:uppercase;
  }

  .field-row{ margin-bottom:14px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .btn{
    font-family:'Inter', sans-serif; font-size:13px; font-weight:600;
    padding:9px 18px; border-radius:7px; border:1px solid var(--accent);
    color:var(--void); background:var(--accent); cursor:pointer;
    transition:transform .15s ease, opacity .15s ease, background .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); background:#7B82FF; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
  .btn.ghost{ background:transparent; color:var(--ink-dim); border-color:var(--line); }
  .btn.ghost:hover{ color:var(--ink); border-color:var(--accent); background:transparent; }
  .btn.danger{ background:transparent; border-color:var(--line); color:var(--ink-faint); }
  .btn.danger:hover{ border-color:var(--bad); color:var(--bad); background:transparent; transform:none; }
  .btn.small{ padding:6px 12px; font-size:12px; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:22px;
  }
  .card p{ font-size:13.5px; color:var(--ink-dim); line-height:1.7; }
  .card p strong{ color:var(--ink); font-weight:600; }
  .card p + p{ margin-top:4px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:11px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  thead th{ border-bottom:1px solid var(--line); }
  th{
    color:var(--ink-faint); font-family:'JetBrains Mono', monospace; font-size:10.5px;
    letter-spacing:0.06em; text-transform:uppercase; font-weight:500;
  }
  tbody tr{ transition:background .12s ease; }
  tbody tr:hover{ background:rgba(255,255,255,0.015); }
  td.mono-cell{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-dim); }

  .status-pill{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:10.5px;
    font-family:'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:0.04em;
  }
  .status-actif{ background:rgba(79,216,149,0.12); color:var(--good); }
  .status-inactif{ background:rgba(240,168,60,0.12); color:var(--warn); }
  .status-archivé{ background:rgba(240,82,90,0.12); color:var(--bad); }

  .subsection{ margin-top:28px; padding-top:24px; border-top:1px solid var(--line); }
  .subsection h3{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600; margin-bottom:16px; }

  /* ---------- EDT grid (read-only animation view) ---------- */

  .edt-toolbar{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:18px; }
  .edt-range{ font-size:12px; color:var(--ink-dim); min-width:170px; text-align:center; }
  .edt-grid-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .edt-grid{ display:grid; grid-template-columns:64px repeat(7, minmax(110px, 1fr)); min-width:820px; }
  .edt-corner{ border-bottom:1px solid var(--line); border-right:1px solid var(--line); background:var(--panel); }
  .edt-day-head{
    padding:10px 8px; text-align:center; font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:600;
    border-bottom:1px solid var(--line); border-right:1px solid var(--line-soft); background:var(--panel);
    display:flex; flex-direction:column; gap:2px;
  }
  .edt-day-head .mono{ font-size:10.5px; color:var(--ink-faint); font-weight:400; }
  .edt-day-head.today{ color:var(--accent-2); background:var(--accent-soft); }
  .edt-time-cell{
    padding:6px 8px; font-size:10.5px; color:var(--ink-faint); border-right:1px solid var(--line);
    border-bottom:1px solid var(--line-soft); display:flex; align-items:flex-start; justify-content:flex-end;
    background:var(--void-2);
  }
  .edt-cell{
    min-height:46px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
    padding:3px; display:flex; flex-direction:column; gap:3px;
  }
  .edt-cell.today{ background:rgba(110,118,255,0.045); }
  .edt-event{
    background:var(--accent-soft); border-left:2px solid var(--accent); border-radius:4px;
    padding:4px 6px; font-size:11px; line-height:1.35; color:var(--ink);
  }
  .edt-event strong{ display:block; font-weight:600; font-size:11.5px; }
  .edt-event span{ display:block; color:var(--ink-dim); font-size:10px; margin-top:1px; }

  .toast{
    position:fixed; bottom:24px; right:24px; z-index:200;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:8px;
    padding:12px 18px; font-size:13px; max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    display:none;
  }
  .toast.show{ display:block; }
  .toast.error{ border-color:var(--bad); color:var(--bad); }
  .toast.success{ border-color:var(--good); color:var(--good); }

  @media (max-width:900px){
    main{ padding-top:76px; }
    .console{ flex-direction:column; }
    .sidebar{
      position:static; width:100%; height:auto; flex-direction:row; align-items:center;
      overflow-x:auto; padding:14px 16px; gap:16px; border-right:none; border-bottom:1px solid var(--line);
    }
    .sidebar-brand, .clearance-card, .sidebar-footer{ display:none; }
    .sidebar-nav{ flex-direction:row; gap:6px; }
    .nav-item{ white-space:nowrap; }
    .nav-item.active::before{ display:none; }
    .console-main{ padding:28px 20px 60px; }
    .field-grid{ grid-template-columns:1fr; }
    nav a:not(.auth-menu):not(.current){ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav-inner">
    <a href="index.html" class="wordmark">
      <img src="ressources/voidline-logo-white.png" class="logo-mark" alt="" aria-hidden="true" />
      VOIDLINE STUDIO
    </a>
    <nav>
      <ul>
        <li><a href="index.html#top">Accueil</a></li>
        <li><a href="account.html">Mon compte</a></li>
        <li class="nav-admin-link" style="display:none;"><a href="admin.html" class="current">Console</a></li>
        <li class="auth-menu" id="auth-menu"></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="console" id="console-root">
    <div class="console-loading"><span class="center-msg">Chargement…</span></div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() {
    return localStorage.getItem(TOKEN_KEY);
  }

  const header = document.querySelector('header');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 20);
  });

  const consoleRoot = document.getElementById('console-root');
  const toastEl = document.getElementById('toast');

  function showToast(message, type) {
    toastEl.textContent = message;
    toastEl.className = `toast show${type ? ` ${type}` : ''}`;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 3500);
  }

  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || `Erreur ${res.status}`);
    }
    return data;
  }

  // -----------------------------------------------------------------
  // État global
  // -----------------------------------------------------------------
  let context = null;
  let currentDeptId = null;
  let activeTab = null;

  const ICONS = {
    dossier: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>',
    rosters: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M6 16c.6-1.8 1.8-2.7 3-2.7s2.4.9 3 2.7"/><path d="M14 9h4M14 13h4"/></svg>',
    sanctions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M12 8v5M12 16.2v.1"/></svg>',
    absences: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    animations: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="15.5" cy="14" r="1"/></svg>',
    permissions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="3.5"/><path d="M10.5 13l8-8M15 8l2 2M18 5l2 2"/></svg>',
  };

  const TAB_META = {
    dossier: { title: 'Dossier', subtitle: "Recherche croisée d'un joueur : rosters, sanctions et absences réunis." },
    rosters: { title: 'Rosters', subtitle: "Effectifs par département, avec la commande de rôle prête à copier." },
    sanctions: { title: 'Sanctions', subtitle: 'Historique des sanctions et ajout de nouvelles entrées.' },
    absences: { title: 'Absences', subtitle: 'Déclarations en cours, RP comme Staff, tous serveurs confondus.' },
    animations: { title: 'Animation', subtitle: "Planning des sessions d'animation." },
    permissions: { title: 'Permissions', subtitle: 'Droits accordés à chaque rôle du serveur staff.' },
  };

  function renderLoggedOut() {
    consoleRoot.innerHTML = `
      <div class="console-message">
        <div class="console-message-inner">
          <div class="display">Accès restreint</div>
          <p>Connecte-toi d'abord pour ouvrir la console.<br><br><a href="account.html">Aller à Mon compte</a></p>
        </div>
      </div>
    `;
  }

  function renderForbidden() {
    consoleRoot.innerHTML = `
      <div class="console-message">
        <div class="console-message-inner">
          <div class="display">Clairance insuffisante</div>
          <p>Aucun rôle staff détecté sur ton compte pour l'un des accès de cette console.</p>
        </div>
      </div>
    `;
  }

  function renderError(message) {
    consoleRoot.innerHTML = `<div class="console-message"><div class="console-message-inner"><p>${escapeHtml(message)}</p></div></div>`;
  }

  function renderShell() {
    const tabs = [];
    if (context.isAdminAnywhere) tabs.push('dossier');
    if (context.rosterLevel) tabs.push('rosters');
    if (context.canManageSanctions) tabs.push('sanctions');
    if (context.canManageAbsences) tabs.push('absences');

  function switchTab(tabId) {
    if (!tabId) return;
    activeTab = tabId;
    consoleRoot.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', b.dataset.tab === tabId));

    const meta = TAB_META[tabId];
    document.getElementById('console-title').textContent = meta.title;
    document.getElementById('console-subtitle').textContent = meta.subtitle;

    if (tabId === 'dossier') loadDossierTab();
    else if (tabId === 'rosters') loadRostersTab();
    else if (tabId === 'sanctions') loadSanctionsTab();
    else if (tabId === 'absences') loadAbsencesTab();
    else if (tabId === 'animations') loadAnimationsTab();
    else if (tabId === 'permissions') loadPermissionsTab();
  }

  // Vue lecture seule "EDT" en grille hebdomadaire, pour tout le monde qui
  // n'a pas canManageAnimations mais a accès à la console. Navigation
  // semaine par semaine ; chaque session est casée dans la colonne du jour
  // et la ligne de l'heure (arrondie à l'heure pleine, pas de positionnement
  // au pixel près faute de durée renseignée).
  function renderAnimationsEdtView(allAnimations) {
    const body = document.getElementById('console-body');
    const HOURS = Array.from({ length: 16 }, (_, i) => 8 + i); // 08h -> 23h
    const DAY_LABELS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = (day === 0 ? -6 : 1) - day;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function isoDate(d) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    let weekStart = getMonday(new Date());

    function draw() {
      const days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        return d;
      });
      const dayISOs = days.map(isoDate);
      const todayISO = isoDate(new Date());

      const eventsByCell = {};
      allAnimations.forEach((a) => {
        if (!dayISOs.includes(a.date)) return;
        const hourNum = parseInt((a.time || '').split(':')[0], 10);
        const h = Number.isFinite(hourNum) ? Math.min(Math.max(hourNum, 8), 23) : 8;
        const key = `${a.date}_${h}`;
        (eventsByCell[key] = eventsByCell[key] || []).push(a);
      });

      const rangeLabel = `${days[0].toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' })} – ${days[6].toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}`;

      body.innerHTML = `
        <div class="edt-toolbar">
          <button class="btn ghost small" id="edt-prev">◀ Précédente</button>
          <span class="edt-range mono">${rangeLabel}</span>
          <button class="btn ghost small" id="edt-next">Suivante ▶</button>
        </div>
        <div class="edt-grid-wrap">
          <div class="edt-grid">
            <div class="edt-corner"></div>
            ${days
              .map(
                (d, i) =>
                  `<div class="edt-day-head${dayISOs[i] === todayISO ? ' today' : ''}">${DAY_LABELS[i]}<span class="mono">${d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })}</span></div>`
              )
              .join('')}
            ${HOURS.map(
              (h) => `
              <div class="edt-time-cell mono">${String(h).padStart(2, '0')}:00</div>
              ${dayISOs
                .map((iso) => {
                  const evs = eventsByCell[`${iso}_${h}`] || [];
                  return `<div class="edt-cell${iso === todayISO ? ' today' : ''}">${evs
                    .map(
                      (a) =>
                        `<div class="edt-event" title="${escapeHtml(a.description || '')}"><strong>${escapeHtml(a.title || '')}</strong>${a.host ? `<span>${escapeHtml(a.host)}</span>` : ''}</div>`
                    )
                    .join('')}</div>`;
                })
                .join('')}
            `
            ).join('')}
          </div>
        </div>
      `;

      document.getElementById('edt-prev').addEventListener('click', () => {
        weekStart.setDate(weekStart.getDate() - 7);
        draw();
      });
      document.getElementById('edt-next').addEventListener('click', () => {
        weekStart.setDate(weekStart.getDate() + 7);
        draw();
      });
    }

    draw();
  }

                      <td>
                        <select class="perm-rosters-select" data-role-id="${escapeHtml(p.roleId)}">
                          <option value="" ${!p.rosters ? 'selected' : ''}>Aucun</option>
                          <option value="view" ${p.rosters === 'view' ? 'selected' : ''}>Lecture seule</option>
                          <option value="edit" ${p.rosters === 'edit' ? 'selected' : ''}>Modification</option>
                        </select>
                      </td>
                      <td><input type="checkbox" class="perm-check" data-role-id="${escapeHtml(p.roleId)}" data-field="sanctions" ${p.sanctions ? 'checked' : ''}></td>
                      <td><input type="checkbox" class="perm-check" data-role-id="${escapeHtml(p.roleId)}" data-field="absences" ${p.absences ? 'checked' : ''}></td>
                      <td><input type="checkbox" class="perm-check" data-role-id="${escapeHtml(p.roleId)}" data-field="animations" ${p.animations ? 'checked' : ''}></td>
                      <td>
                        <button class="btn small save-permission-btn" data-role-id="${escapeHtml(p.roleId)}" data-label="${escapeHtml(p.label || p.roleId)}">Enregistrer</button>
                        <button class="btn danger small remove-permission-btn" data-role-id="${escapeHtml(p.roleId)}">Retirer</button>
                      </td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucun rôle configuré.</div>'
        }
      </div>

      <div class="subsection">
        <h3>Ajouter un rôle</h3>
        <div class="field-row" style="max-width:320px;">
          <label>Rôle Discord</label>
          <select id="new-role-select">
            <option value="">— Choisir un rôle —</option>
            ${unconfiguredRoles.map((r) => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field-grid" style="max-width:520px;">
          <div class="field-row">
            <label>Rosters</label>
            <select id="new-role-rosters">
              <option value="">Aucun</option>
              <option value="view">Lecture seule</option>
              <option value="edit">Modification</option>
            </select>
          </div>
          <div class="field-row" style="display:flex; align-items:center; gap:20px; padding-top:22px;">
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);"><input type="checkbox" id="new-role-sanctions"> Sanctions</label>
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);"><input type="checkbox" id="new-role-absences"> Absences</label>
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);"><input type="checkbox" id="new-role-animations"> Animation</label>
          </div>
        </div>
        <button class="btn" id="add-role-permission-btn" type="button">Ajouter</button>
      </div>
    `;

    async function savePermission(roleId, label) {
      const row = body.querySelector(`tr[data-role-id="${roleId}"]`);
      const rosters = row.querySelector('.perm-rosters-select').value || null;
      const sanctions = row.querySelector('[data-field="sanctions"]').checked;
      const absences = row.querySelector('[data-field="absences"]').checked;
      const animations = row.querySelector('[data-field="animations"]').checked;

      try {
        await apiFetch(`/api/admin/permissions/${encodeURIComponent(roleId)}`, {
          method: 'PUT',
          body: JSON.stringify({ label, rosters, sanctions, absences, animations }),
        });
        showToast('Permissions enregistrées.', 'success');
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    }

    body.querySelectorAll('.save-permission-btn').forEach((btn) => {
      btn.addEventListener('click', () => savePermission(btn.dataset.roleId, btn.dataset.label));
    });

    body.querySelectorAll('.remove-permission-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Retirer tous les droits panel de ce rôle ?')) return;
        try {
          await apiFetch(`/api/admin/permissions/${encodeURIComponent(btn.dataset.roleId)}`, { method: 'DELETE' });
          showToast('Permissions retirées.', 'success');
          loadPermissionsTab();
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
    });

    document.getElementById('add-role-permission-btn').addEventListener('click', async () => {
      const select = document.getElementById('new-role-select');
      const roleId = select.value;
      if (!roleId) {
        showToast('Choisis un rôle.', 'error');
        return;
      }
      const label = select.options[select.selectedIndex].text;
      const rosters = document.getElementById('new-role-rosters').value || null;
      const sanctions = document.getElementById('new-role-sanctions').checked;
      const absences = document.getElementById('new-role-absences').checked;
      const animations = document.getElementById('new-role-animations').checked;

      try {
        await apiFetch(`/api/admin/permissions/${encodeURIComponent(roleId)}`, {
          method: 'PUT',
          body: JSON.stringify({ label, rosters, sanctions, absences, animations }),
        });
        showToast('Rôle ajouté.', 'success');
        loadPermissionsTab();
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    });
  }

  // -----------------------------------------------------------------
  // Dossier
  // -----------------------------------------------------------------
  const DOSSIER_SANCTION_LABELS = { ban: 'Bannissement', mute: 'Mute', kick: 'Expulsion', warn: 'Avertissement' };
  const DOSSIER_ABSENCE_LABELS = { rp: '🎭 RP', staff: '🛠️ Staff' };

  async function loadDossierTab() {
    const body = document.getElementById('console-body');
    body.innerHTML = `
      <div class="field-row" style="max-width:440px;">
        <label>Pseudo Roblox ou ID Discord</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="dossier-search-input" placeholder="Ex: firefox_ultra1">
          <button class="btn" id="dossier-search-btn" type="button">Chercher</button>
        </div>
      </div>
      <div id="dossier-results"></div>
    `;

    const input = document.getElementById('dossier-search-input');
    const runSearch = () => searchDossier(input.value.trim());
    document.getElementById('dossier-search-btn').addEventListener('click', runSearch);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
  }

  async function searchDossier(query) {
    const results = document.getElementById('dossier-results');
    if (!query) { results.innerHTML = ''; return; }

    results.innerHTML = '<div class="center-msg">Recherche…</div>';

    let data;
    try {
      data = await apiFetch(`/api/admin/dossier?q=${encodeURIComponent(query)}`);
    } catch (err) {
      results.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const { identity, robloxUsername, characters, sanctions, absences, canAddSanction } = data;

    const identityBlock = `
      <div class="card">
        <p><strong>Pseudo Roblox :</strong> ${escapeHtml(robloxUsername)}</p>
        ${
          identity
            ? `<p><strong>Compte Discord lié :</strong> <span class="mono-cell">${escapeHtml(identity.discordId)}</span> — ${identity.verified ? 'vérifié OAuth' : 'lien manuel'}</p>`
            : '<p>Aucun compte Discord lié trouvé pour ce pseudo.</p>'
        }
      </div>
    `;

    const charactersBlock = `
      <div class="record-block">
        <div class="record-block-head"><h2>Rosters</h2><span class="count">${characters.length}</span></div>
        ${
          characters.length
            ? `<table>
                <thead><tr><th>Département</th><th>Nom</th><th>Grade</th><th>Statut</th><th>Commande</th></tr></thead>
                <tbody>
                  ${characters
                    .map(
                      (c) => `
                    <tr>
                      <td class="mono-cell">${escapeHtml(c.deptId)}</td>
                      <td>${escapeHtml(c.name || '—')}</td>
                      <td>${escapeHtml(c.rank || '—')}</td>
                      <td><span class="status-pill status-${c.status || 'actif'}">${escapeHtml(c.status || 'actif')}</span></td>
                      <td>${c.command ? `<button class="btn ghost small copy-command-btn" data-command="${escapeHtml(c.command)}">Copier</button>` : '—'}</td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucun personnage trouvé.</div>'
        }
      </div>
    `;

    const sanctionsBlock = `
      <div class="record-block">
        <div class="record-block-head"><h2>Sanctions</h2><span class="count">${sanctions.length}</span></div>
        ${
          sanctions.length
            ? `<table>
                <thead><tr><th>Type</th><th>Raison</th><th>Modérateur</th><th>Date</th></tr></thead>
                <tbody>
                  ${sanctions
                    .map(
                      (s) => `
                    <tr>
                      <td>${escapeHtml(DOSSIER_SANCTION_LABELS[s.type] || s.type || '—')}</td>
                      <td>${escapeHtml(s.reason || '—')}</td>
                      <td>${escapeHtml(s.mod || '—')}</td>
                      <td class="mono-cell">${escapeHtml(s.date || '—')}</td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucune sanction.</div>'
        }
        ${
          canAddSanction
            ? `<form id="dossier-add-sanction-form" style="margin-top:18px;">
                <div class="field-grid">
                  <div class="field-row">
                    <label>Type *</label>
                    <select id="dossier-sanction-type">
                      <option value="warn">Avertissement</option>
                      <option value="kick">Expulsion</option>
                      <option value="mute">Mute</option>
                      <option value="ban">Bannissement</option>
                    </select>
                  </div>
                  <div class="field-row"><label>Durée</label><input type="text" id="dossier-sanction-duration" placeholder="Ex: 24h, permanent..."></div>
                </div>
                <div class="field-row"><label>Raison *</label><textarea id="dossier-sanction-reason" rows="2" required></textarea></div>
                <button class="btn" type="submit">Ajouter la sanction</button>
              </form>`
            : ''
        }
      </div>
    `;

    const absencesBlock = `
      <div class="record-block">
        <div class="record-block-head"><h2>Absences</h2><span class="count">${absences.length}</span></div>
        ${
          absences.length
            ? `<table>
                <thead><tr><th>Catégorie</th><th>Raison</th><th>Statut</th><th>Déclarée le</th></tr></thead>
                <tbody>
                  ${absences
                    .map(
                      (a) => `
                    <tr>
                      <td>${DOSSIER_ABSENCE_LABELS[a.category] || '🎭 RP'}</td>
                      <td>${escapeHtml(a.reason || '—')}</td>
                      <td>${a.status === 'returned' ? '🟢 De retour' : '🔴 Absent'}</td>
                      <td class="mono-cell">${a.declaredAt ? new Date(a.declaredAt).toLocaleString('fr-FR') : '—'}</td>
                    </tr>`
                    )
                    .join('')}
                </tbody>
              </table>`
            : '<div class="empty-row">Aucune absence.</div>'
        }
      </div>
    `;

    results.innerHTML = identityBlock + charactersBlock + sanctionsBlock + absencesBlock;

    results.querySelectorAll('.copy-command-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.command);
          showToast('Commande copiée.', 'success');
        } catch (err) {
          showToast('Impossible de copier.', 'error');
        }
      });
    });

    const sanctionForm = document.getElementById('dossier-add-sanction-form');
    if (sanctionForm) {
      sanctionForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('dossier-sanction-type').value;
        const duration = document.getElementById('dossier-sanction-duration').value.trim();
        const reason = document.getElementById('dossier-sanction-reason').value.trim();

        if (!reason) { showToast('La raison est obligatoire.', 'error'); return; }

        try {
          await apiFetch('/api/admin/sanctions', { method: 'POST', body: JSON.stringify({ username: robloxUsername, type, reason, duration }) });
          showToast('Sanction ajoutée.', 'success');
          searchDossier(robloxUsername);
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
    }
  }

  // -----------------------------------------------------------------
  // Point d'entrée
  // -----------------------------------------------------------------
  async function init() {
    const token = getToken();
    if (!token) { renderLoggedOut(); return; }

    try {
      context = await apiFetch('/api/admin/context');
    } catch (err) {
      if (err.message === 'forbidden') renderForbidden();
      else if (err.message === 'not_authenticated') renderLoggedOut();
      else renderError(`Impossible de charger la console : ${err.message}`);
      return;
    }

    if (!context.isAdminAnywhere) { renderForbidden(); return; }

    renderShell();
  }

  init();
</script>
<script src="assets/auth-menu.js" defer></script>
</body>
</html>
