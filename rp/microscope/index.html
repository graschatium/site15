<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microscope — Scientifique — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://voidline-studio.com/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #0A0B0E;
    --void-2: #101218;
    --panel: #14161D;
    --panel-raised: #191c25;
    --line: #2A2D38;
    --line-soft: rgba(255,255,255,0.06);
    --accent: #6E76FF;
    --line-bright: #6E76FF;
    --line-bright-2: #A78BFA;
    --ink: #ECEDF1;
    --ink-dim: #9297A8;
    --ink-faint: #5A5F6E;
    --good: #4FD895;
    --warn: #F0A83C;
    --bad: #F0525A;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{ background:var(--void); color:var(--ink); font-family:'Inter', sans-serif; overflow:hidden; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .topbar{
    height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 18px;
    background:var(--void-2); border-bottom:1px solid var(--line);
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim); padding:6px 10px;
    border-radius:5px; border:1px solid var(--line); transition:color .15s ease, border-color .15s ease;
  }
  .back-link:hover{ color:var(--ink); border-color:var(--line-bright); }
  .back-link svg{ width:14px; height:14px; }
  .topbar-title{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; }
  .topbar-status{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); }

  .center-msg{ display:flex; align-items:center; justify-content:center; height:calc(100vh - 48px); color:var(--ink-dim); font-size:14px; text-align:center; padding:20px; }

  .scope-page{
    height:calc(100vh - 48px); overflow-y:auto; padding:32px 20px;
    display:flex; flex-direction:column; align-items:center; gap:28px;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(110,118,255,0.06), transparent 60%);
  }

  /* ---- Viseur du microscope ---- */
  .scope-viewport{
    position:relative; width:300px; height:300px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 50% 45%, #171922 0%, #0c0d12 55%, #050508 100%);
    border:7px solid #1c1f29;
    box-shadow:0 0 0 2px var(--line), 0 30px 70px rgba(0,0,0,0.65), inset 0 0 70px rgba(0,0,0,0.85);
    overflow:hidden;
  }
  .scope-viewport::before{
    content:''; position:absolute; inset:0; opacity:0.4; pointer-events:none;
    background-image:radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1.2px);
    background-size:7px 7px;
  }
  .scope-crosshair{ position:absolute; inset:0; pointer-events:none; }
  .scope-crosshair::before, .scope-crosshair::after{ content:''; position:absolute; background:rgba(110,118,255,0.22); }
  .scope-crosshair::before{ top:0; bottom:0; left:50%; width:1px; }
  .scope-crosshair::after{ left:0; right:0; top:50%; height:1px; }
  .scope-specimen{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .6s ease;
  }
  .scope-specimen.visible{ opacity:1; }
  .scope-specimen-blob{
    width:150px; height:150px; border-radius:44% 56% 62% 38% / 48% 42% 58% 52%;
    filter:blur(1px);
    animation:scopeBlobMorph 7s ease-in-out infinite alternate;
  }
  @keyframes scopeBlobMorph{
    0%{ border-radius:44% 56% 62% 38% / 48% 42% 58% 52%; transform:rotate(0deg) scale(1); }
    100%{ border-radius:58% 42% 40% 60% / 60% 48% 52% 40%; transform:rotate(12deg) scale(1.05); }
  }
  .scope-scan-line{
    position:absolute; left:6%; right:6%; height:3px; border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(110,118,255,0.9), transparent);
    box-shadow:0 0 14px rgba(110,118,255,0.7); top:0; opacity:0;
  }
  .scope-scan-line.scanning{ animation:scopeScan 1.6s ease-in-out; }
  @keyframes scopeScan{
    0%{ top:4%; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ top:94%; opacity:0; }
  }
  .scope-idle-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); text-align:center;
    padding:0 40px; letter-spacing:0.04em; text-transform:uppercase;
  }

  .scope-panel{ width:100%; max-width:520px; }
  .scope-panel-title{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em; color:var(--ink-faint);
    text-transform:uppercase; margin-bottom:12px; padding-left:10px; border-left:2px solid var(--line-bright);
  }
  .field-row{ margin-bottom:12px; }
  .field-row label{ display:block; font-size:11.5px; color:var(--ink-faint); margin-bottom:5px; font-family:'JetBrains Mono', monospace; letter-spacing:0.03em; text-transform:uppercase; }
  input, select, textarea{
    width:100%; background:var(--void-2); border:1px solid var(--line); border-radius:5px; padding:9px 11px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:13px;
  }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn{
    padding:10px 18px; border-radius:5px; border:1px solid var(--line); background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:600; cursor:pointer; width:100%;
  }
  .btn.ghost{ background:transparent; color:var(--ink-dim); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .scope-log{ width:100%; max-width:640px; margin-bottom:40px; }
  .scope-log-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .scope-log-head h2{ font-family:'Space Grotesk', sans-serif; font-size:14px; }
  .count{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); }
  .post-card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:8px; }
  .post-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .post-card-title{ font-weight:600; font-size:13px; }
  .post-card-meta{ font-size:11.5px; color:var(--ink-faint); }
  .post-card-body{ font-size:12.5px; color:var(--ink-dim); white-space:pre-wrap; }
  .empty-row{ color:var(--ink-faint); font-size:12.5px; padding:12px 0; text-align:center; }
  .type-badge{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; margin-left:8px;
  }

  /* ---- Curseurs de réglage du microscope ---- */
  .scope-controls{ width:300px; display:flex; flex-direction:column; gap:14px; }
  .scope-control-row label{
    display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10.5px;
    letter-spacing:0.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;
  }
  .scope-control-row label span{ color:var(--line-bright-2); font-weight:600; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px;
    background:var(--line); outline:none; padding:0; border:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 0 8px rgba(110,118,255,0.6);
  }
  input[type="range"]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; border:none;
    box-shadow:0 0 8px rgba(110,118,255,0.6);
  }

  .scope-specimen-zoom-wrap{ display:flex; align-items:center; justify-content:center; }

  /* ---- Rendu plus réaliste du viseur ---- */
  .scope-graticule{ position:absolute; inset:0; pointer-events:none; opacity:0.35; }
  .scope-graticule .ring{
    position:absolute; border:1px solid rgba(110,118,255,0.18); border-radius:50%;
    top:50%; left:50%; transform:translate(-50%,-50%);
  }
  .scope-graticule .tick{
    position:absolute; background:rgba(110,118,255,0.22); top:50%; left:50%;
    width:1px; height:6px; transform-origin:0 0;
  }
  .scope-glass-sheen{
    position:absolute; inset:-20%; pointer-events:none; mix-blend-mode:screen; opacity:0.5;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.10) 45%, rgba(255,255,255,0.02) 52%, transparent 62%);
  }
  .scope-chromatic-edge{
    position:absolute; inset:0; pointer-events:none; border-radius:50%;
    box-shadow:inset 0 0 30px 4px rgba(240,82,90,0.10), inset 0 0 46px 10px rgba(79,168,240,0.08);
  }
  .scope-cell{
    position:absolute; border-radius:50%; mix-blend-mode:screen;
  }

  /* ---- Post-its ---- */
  .scope-notes{ width:100%; max-width:640px; }
  .scope-notes-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .scope-notes-head h2{ font-family:'Space Grotesk', sans-serif; font-size:14px; }
  .btn.ghost.small{ width:auto; padding:6px 12px; font-size:11.5px; border:1px solid var(--line); }
  .scope-notes-board{
    display:flex; flex-wrap:wrap; gap:16px; padding:18px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; min-height:80px;
  }
  .sticky-note{
    width:150px; min-height:140px; padding:12px 12px 8px; border-radius:2px; position:relative;
    box-shadow:0 8px 16px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.25);
    font-family:'Space Grotesk', sans-serif; display:flex; flex-direction:column;
    transition:transform .15s ease;
  }
  .sticky-note:hover{ transform:scale(1.03) rotate(0deg) !important; z-index:2; }
  .sticky-note-delete{
    position:absolute; top:4px; right:6px; background:none; border:none; cursor:pointer;
    font-size:14px; color:rgba(10,11,14,0.4); line-height:1; padding:2px;
  }
  .sticky-note-delete:hover{ color:rgba(10,11,14,0.8); }
  .sticky-note-text{
    flex:1; width:100%; background:transparent; border:none; resize:none; color:#1a1a1a;
    font-family:'Space Grotesk', sans-serif; font-size:12.5px; line-height:1.5; padding:0; margin-top:6px;
  }
  .sticky-note-text::placeholder{ color:rgba(10,11,14,0.4); }

  /* ---- Sélecteur SCP façon clipboard ---- */
  .clipboard-trigger{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    background:var(--void-2); border:1px solid var(--line); border-radius:5px; padding:9px 11px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:13px; cursor:pointer;
  }
  .clipboard-trigger:hover{ border-color:var(--line-bright); }
  .clipboard-trigger svg{ width:14px; height:14px; color:var(--ink-faint); flex-shrink:0; }

  .clipboard-panel{
    position:relative; margin-top:8px; background:#1c1e26; border:1px solid var(--line); border-radius:6px;
    padding:16px 10px 10px; box-shadow:0 16px 40px rgba(0,0,0,0.5);
  }
  .clipboard-panel::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:64px; height:16px; background:#3a3d4a; border-radius:4px; border:1px solid var(--line);
  }
  .clipboard-search{ margin-bottom:10px; }
  .clipboard-list{ max-height:220px; overflow-y:auto; padding-right:4px; }
  .clipboard-free-option{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:4px; cursor:pointer;
    font-size:12.5px; color:var(--ink-dim); border:1px dashed var(--line); margin-bottom:10px;
  }
  .clipboard-free-option:hover{ border-color:var(--line-bright); color:var(--ink); }
  .clipboard-group-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:6px 10px 4px; margin-top:4px;
  }
  .clipboard-item{
    padding:7px 10px; border-radius:4px; cursor:pointer; font-size:12.5px; color:var(--ink-dim);
  }
  .clipboard-item:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }
  .clipboard-empty{ padding:10px; font-size:12px; color:var(--ink-faint); text-align:center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/rp/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
      Retour à l'intranet
    </a>
    <span class="topbar-title">Microscope — Scientifique</span>
  </div>
  <span class="topbar-status mono" id="topbar-status">SCPSCOPE v1.0</span>
</div>

<div id="page-root">
  <div class="center-msg">Chargement…</div>
</div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';
  const SCIENCE_DEPT_ID = 'scientifique_mmqbrd32f2z7';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() { return localStorage.getItem(TOKEN_KEY); }

  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  let adminOverrideActive = false; // redemandé à chaque chargement de page, jamais persisté

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(adminOverrideActive ? { 'X-Admin-Override-Dept': SCIENCE_DEPT_ID } : {}),
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }

  const pageRoot = document.getElementById('page-root');

  // ---------------------------------------------------------------------
  // Contrôle d'accès : nécessite un personnage actif Scientifique, ou le
  // Mode Administrateur (canManagePermissions / rpFullAccess côté staff),
  // via la même case à cocher opt-in que le reste de l'intranet RP.
  // ---------------------------------------------------------------------
  async function checkAccessAndInit() {
    if (!getToken()) {
      pageRoot.innerHTML = '<div class="center-msg">Connecte-toi depuis le site avant d\'accéder au Microscope.</div>';
      return;
    }

    let context;
    try {
      context = await apiFetch('/api/rp/context');
    } catch (err) {
      pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    if (context.banned) {
      pageRoot.innerHTML = '<div class="center-msg">Accès révoqué.</div>';
      return;
    }

    const isScience = (context.characters || []).some((c) => c.deptId === SCIENCE_DEPT_ID);
    if (isScience) {
      loadScope();
      return;
    }

    if (context.canUseAdminOverride) {
      pageRoot.innerHTML = `
        <div class="center-msg" style="flex-direction:column; gap:16px;">
          <p>Aucun personnage actif dans Scientifique.</p>
          <label style="display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--accent); cursor:pointer;">
            <input type="checkbox" id="scope-admin-override-checkbox" style="width:16px; height:16px; accent-color:var(--accent); cursor:pointer;">
            Utiliser les perms administrateur ?
          </label>
          <button class="btn" id="scope-admin-override-enter" style="width:auto; padding:9px 20px;">Entrer</button>
        </div>
      `;
      document.getElementById('scope-admin-override-enter').addEventListener('click', async () => {
        const checked = document.getElementById('scope-admin-override-checkbox').checked;
        if (!checked) {
          pageRoot.innerHTML = '<div class="center-msg">Accès refusé — le Microscope est réservé au personnel actif du département Scientifique.</div>';
          return;
        }
        adminOverrideActive = true;
        pageRoot.innerHTML = '<div class="center-msg">Chargement…</div>';
        try {
          context = await apiFetch('/api/rp/context');
        } catch (err) {
          pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
          return;
        }
        loadScope();
      });
      return;
    }

    pageRoot.innerHTML = '<div class="center-msg">Accès refusé — le Microscope est réservé au personnel actif du département Scientifique.</div>';
  }

  // ---------------------------------------------------------------------
  // Interface du microscope
  // ---------------------------------------------------------------------
  const SAMPLE_TYPES = {
    biologique: { label: 'Biologique', color: '#4FD895' },
    anomalique: { label: 'Anomalique', color: '#A78BFA' },
    chimique: { label: 'Chimique', color: '#F0A83C' },
    inconnu: { label: 'Inconnu', color: '#9297A8' },
  };

  let scopeExaminations = [];
  let currentSpecimenReady = false;

  function loadScope() {
    pageRoot.innerHTML = `
      <div class="scope-page">
        <div class="scope-viewport" id="scope-viewport">
          <div class="scope-crosshair"></div>
          <div class="scope-graticule" id="scope-graticule"></div>
          <div class="scope-specimen" id="scope-specimen">
            <div class="scope-specimen-zoom-wrap" id="scope-specimen-zoom-wrap">
              <div class="scope-specimen-blob" id="scope-specimen-blob"></div>
              <div id="scope-cells"></div>
            </div>
          </div>
          <div class="scope-idle-label" id="scope-idle-label">Aucun échantillon en cours d'examen</div>
          <div class="scope-scan-line" id="scope-scan-line"></div>
          <div class="scope-chromatic-edge"></div>
          <div class="scope-glass-sheen"></div>
        </div>

        <div class="scope-controls">
          <div class="scope-control-row">
            <label>Grossissement <span id="scope-zoom-value">100x</span></label>
            <input type="range" id="scope-zoom" min="10" max="1000" step="10" value="100">
          </div>
          <div class="scope-control-row">
            <label>Réglage de lumière <span id="scope-brightness-value">50%</span></label>
            <input type="range" id="scope-brightness" min="0" max="100" value="50">
          </div>
          <div class="scope-control-row">
            <label>Concentration de lumière <span id="scope-focus-value">50%</span></label>
            <input type="range" id="scope-focus" min="0" max="100" value="50">
          </div>
        </div>

        <div class="scope-panel">
          <div class="scope-panel-title">Nouvel examen</div>
          <form id="scope-form">
            <div class="field-row">
              <label>Échantillon *</label>
              <button type="button" class="clipboard-trigger" id="scp-picker-trigger">
                <span id="scp-picker-label">📋 Choisir un SCP dans le wiki…</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="scp-picker-panel" style="display:none;"></div>
              <input type="text" id="scope-designation-free" style="display:none; margin-top:8px;" placeholder="Désignation libre (échantillon inconnu du wiki)">
              <input type="hidden" id="scope-designation" required>
            </div>
            <div class="field-row">
              <label>Type</label>
              <select id="scope-type">
                ${Object.entries(SAMPLE_TYPES).map(([id, t]) => `<option value="${id}">${t.label}</option>`).join('')}
              </select>
            </div>
            <button class="btn" type="submit" id="scope-examine-btn">Examiner</button>
          </form>

          <div id="scope-results" style="margin-top:18px; display:none;">
            <div class="field-row"><label>Observations</label><textarea id="scope-observations" rows="5" placeholder="Consigne tes observations après examen..."></textarea></div>
            <button class="btn" id="scope-save-btn" type="button">Enregistrer l'examen</button>
          </div>
        </div>

        <div class="scope-log">
          <div class="scope-log-head"><h2>Journal des examens</h2><span class="count" id="scope-log-count">0</span></div>
          <div id="scope-log-list"><div class="empty-row">Chargement…</div></div>
        </div>

        <div class="scope-notes">
          <div class="scope-notes-head">
            <h2>Notes</h2>
            <button class="btn ghost small" id="scope-add-note-btn" type="button">+ Note</button>
          </div>
          <div class="scope-notes-board" id="scope-notes-board"></div>
        </div>
      </div>
    `;

    document.getElementById('scope-form').addEventListener('submit', (e) => {
      e.preventDefault();
      runExamination();
    });

    document.getElementById('scope-save-btn').addEventListener('click', saveExamination);

    ['scope-zoom', 'scope-brightness', 'scope-focus'].forEach((id) => {
      document.getElementById(id).addEventListener('input', updateScopeVisuals);
    });
    updateScopeVisuals();
    buildGraticule();

    document.getElementById('scope-add-note-btn').addEventListener('click', () => addStickyNote());
    renderStickyNotes();

    initScpPicker();

    loadScopeLog();
  }

  // ---------------------------------------------------------------------
  // Sélecteur SCP façon clipboard — tire les vraies fiches du wiki
  // (Archives Scientifique), groupées par classification. Option "Libre /
  // Inconnu" en secours pour un échantillon absent du wiki.
  // ---------------------------------------------------------------------
  let selectedScpId = null; // null = mode libre/manuel
  let wikiScpEntries = [];

  const CLASSIFICATION_META = {
    safe: { label: 'Sûr', color: 'var(--good)' },
    euclid: { label: 'Euclide', color: 'var(--warn)' },
    keter: { label: 'Keter', color: 'var(--bad)' },
  };

  async function initScpPicker() {
    const trigger = document.getElementById('scp-picker-trigger');
    const panel = document.getElementById('scp-picker-panel');
    const freeInput = document.getElementById('scope-designation-free');
    const hiddenInput = document.getElementById('scope-designation');

    try {
      const data = await apiFetch('/api/rp/science/publications');
      wikiScpEntries = (data.publications || []).filter((p) => p.docType === 'objet');
    } catch (err) {
      wikiScpEntries = [];
    }

    function selectFree() {
      selectedScpId = null;
      document.getElementById('scp-picker-label').textContent = '🔓 Échantillon libre / inconnu';
      freeInput.style.display = 'block';
      freeInput.focus();
      hiddenInput.value = freeInput.value;
      panel.style.display = 'none';
    }

    function selectScp(entry) {
      selectedScpId = entry.id;
      document.getElementById('scp-picker-label').textContent = `📋 ${entry.title}`;
      freeInput.style.display = 'none';
      hiddenInput.value = entry.title;
      panel.style.display = 'none';
    }

    function renderPanel(filterText) {
      const q = (filterText || '').toLowerCase();
      const groups = { safe: [], euclid: [], keter: [] };
      wikiScpEntries.forEach((entry) => {
        if (entry.classification && groups[entry.classification] && entry.title.toLowerCase().includes(q)) {
          groups[entry.classification].push(entry);
        }
      });

      const groupsHtml = Object.entries(groups)
        .map(([key, entries]) => {
          if (!entries.length) return '';
          const meta = CLASSIFICATION_META[key];
          return `
            <div class="clipboard-group-label" style="color:${meta.color};">${meta.label}</div>
            ${entries.map((e) => `<div class="clipboard-item" data-scp-id="${e.id}">${escapeHtml(e.title)}</div>`).join('')}
          `;
        })
        .join('');

      panel.innerHTML = `
        <div class="clipboard-panel">
          <input type="text" class="clipboard-search" id="clipboard-search-input" placeholder="Rechercher un SCP..." value="${escapeHtml(filterText || '')}">
          <div class="clipboard-free-option" id="clipboard-free-option">🔓 Échantillon libre / inconnu (non répertorié)</div>
          <div class="clipboard-list">
            ${groupsHtml || '<div class="clipboard-empty">Aucun SCP trouvé dans le wiki.</div>'}
          </div>
        </div>
      `;

      document.getElementById('clipboard-free-option').addEventListener('click', selectFree);
      panel.querySelectorAll('.clipboard-item').forEach((el) => {
        el.addEventListener('click', () => {
          const entry = wikiScpEntries.find((e) => e.id === el.dataset.scpId);
          if (entry) selectScp(entry);
        });
      });

      const searchInput = document.getElementById('clipboard-search-input');
      searchInput.addEventListener('input', () => renderPanel(searchInput.value));
      // Garde le focus sur la recherche à chaque re-render du panneau,
      // sinon taper une lettre le referme à chaque frappe.
      searchInput.focus();
      searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
    }

    trigger.addEventListener('click', () => {
      const isOpen = panel.style.display !== 'none';
      panel.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) renderPanel('');
    });

    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) {
        panel.style.display = 'none';
      }
    });

    freeInput.addEventListener('input', () => {
      hiddenInput.value = freeInput.value;
    });
  }

  // Génère la graticule (anneaux + graduations radiales) une seule fois —
  // purement décoratif, façon réticule de mesure d'un vrai oculaire.
  function buildGraticule() {
    const graticule = document.getElementById('scope-graticule');
    let html = '';
    [40, 80, 120].forEach((r) => {
      html += `<div class="ring" style="width:${r * 2}px; height:${r * 2}px;"></div>`;
    });
    for (let i = 0; i < 24; i += 1) {
      const angle = (360 / 24) * i;
      html += `<div class="tick" style="transform:rotate(${angle}deg) translate(0, -142px);"></div>`;
    }
    graticule.innerHTML = html;
  }

  // Regénère une texture "cellulaire" (petits amas translucides) à chaque
  // examen, pour que le spécimen ait un aspect granuleux/organique plutôt
  // qu'une simple tache lisse — purement décoratif.
  // Petit générateur pseudo-aléatoire à graine (LCG) — permet de faire
  // apparaître TOUJOURS le même motif de cellules pour un même SCP précis
  // (graine = son id de fiche wiki), plutôt qu'un aspect différent à
  // chaque examen. Sans graine (échantillon libre), reste aléatoire.
  function seededRandom(seedStr) {
    let s = 0;
    for (let i = 0; i < seedStr.length; i += 1) {
      s = (s * 31 + seedStr.charCodeAt(i)) >>> 0;
    }
    return function next() {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  function buildSpecimenCells(color, seed) {
    const container = document.getElementById('scope-cells');
    const rand = seed ? seededRandom(seed) : Math.random;
    let html = '';
    const count = 10 + Math.floor(rand() * 8);
    for (let i = 0; i < count; i += 1) {
      const size = 8 + rand() * 22;
      const x = 20 + rand() * 110;
      const y = 20 + rand() * 110;
      const opacity = (0.15 + rand() * 0.35).toFixed(2);
      html += `<div class="scope-cell" style="width:${size}px; height:${size}px; left:${x}px; top:${y}px; background:${color}; opacity:${opacity};"></div>`;
    }
    container.innerHTML = html;
  }

  // Applique en direct grossissement / luminosité / concentration de
  // lumière sur le viseur — purement visuel, rien n'est envoyé au serveur.
  function updateScopeVisuals() {
    const zoom = Number(document.getElementById('scope-zoom').value);
    const brightness = Number(document.getElementById('scope-brightness').value);
    const focus = Number(document.getElementById('scope-focus').value);

    document.getElementById('scope-zoom-value').textContent = `${zoom}x`;
    document.getElementById('scope-brightness-value').textContent = `${brightness}%`;
    document.getElementById('scope-focus-value').textContent = `${focus}%`;

    // Grossissement : zoome le spécimen (sans toucher à sa propre animation
    // de morphing/rotation, gérée séparément par CSS sur le blob lui-même).
    const scale = 0.4 + (zoom / 1000) * 2.6;
    const wrap = document.getElementById('scope-specimen-zoom-wrap');
    wrap.style.transform = `scale(${scale})`;

    // Concentration de lumière : plus c'est concentré (proche de 100%),
    // plus l'image est nette ; diffus (proche de 0%) = flou, comme un
    // condenseur mal réglé sur un vrai microscope.
    const blurAmount = (100 - focus) / 10;
    wrap.style.filter = `blur(${blurAmount}px)`;

    // Réglage de lumière : assombrit/éclaircit tout le viseur.
    const brightnessValue = 0.25 + (brightness / 100) * 1.3;
    document.getElementById('scope-viewport').style.filter = `brightness(${brightnessValue})`;
  }

  function runExamination() {
    const designation = document.getElementById('scope-designation').value.trim();
    if (!designation) {
      alert('Choisis un SCP dans le wiki, ou saisis une désignation libre.');
      return;
    }

    const type = document.getElementById('scope-type').value;
    const color = (SAMPLE_TYPES[type] || SAMPLE_TYPES.inconnu).color;

    const btn = document.getElementById('scope-examine-btn');
    btn.disabled = true;
    btn.textContent = 'Analyse en cours…';

    document.getElementById('scope-idle-label').style.display = 'none';
    const scanLine = document.getElementById('scope-scan-line');
    scanLine.classList.remove('scanning');
    void scanLine.offsetWidth; // relance l'animation CSS si déjà jouée avant
    scanLine.classList.add('scanning');

    const blob = document.getElementById('scope-specimen-blob');
    blob.style.background = `radial-gradient(circle at 35% 35%, ${color}dd, ${color}55 60%, transparent 90%)`;
    blob.style.boxShadow = `0 0 40px ${color}55`;
    buildSpecimenCells(color, selectedScpId);

    setTimeout(() => {
      document.getElementById('scope-specimen').classList.add('visible');
      currentSpecimenReady = true;
      btn.disabled = false;
      btn.textContent = 'Examiner';
      document.getElementById('scope-results').style.display = 'block';
      document.getElementById('scope-observations').focus();
    }, 1700);
  }

  async function saveExamination() {
    const designation = document.getElementById('scope-designation').value.trim();
    const type = document.getElementById('scope-type').value;
    const observations = document.getElementById('scope-observations').value.trim();

    if (!designation) { alert("La désignation de l'échantillon est obligatoire."); return; }

    const saveBtn = document.getElementById('scope-save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Enregistrement…';

    try {
      await apiFetch('/api/rp/science-ops/microscope', {
        method: 'POST',
        body: JSON.stringify({ sampleDesignation: designation, sampleType: type, observations }),
      });

      // Reset de l'interface pour le prochain examen
      document.getElementById('scope-form').reset();
      document.getElementById('scope-results').style.display = 'none';
      document.getElementById('scope-observations').value = '';
      document.getElementById('scope-specimen').classList.remove('visible');
      document.getElementById('scope-idle-label').style.display = 'flex';
      currentSpecimenReady = false;

      // Remet aussi les curseurs à leurs valeurs par défaut.
      document.getElementById('scope-zoom').value = 100;
      document.getElementById('scope-brightness').value = 50;
      document.getElementById('scope-focus').value = 50;
      updateScopeVisuals();

      // Remet le sélecteur SCP à zéro.
      selectedScpId = null;
      document.getElementById('scp-picker-label').textContent = '📋 Choisir un SCP dans le wiki…';
      document.getElementById('scope-designation-free').style.display = 'none';
      document.getElementById('scope-designation-free').value = '';

      loadScopeLog();
    } catch (err) {
      alert(`Erreur : ${err.message}`);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Enregistrer l'examen";
    }
  }

  async function loadScopeLog() {
    const list = document.getElementById('scope-log-list');
    try {
      const data = await apiFetch('/api/rp/science-ops/microscope');
      scopeExaminations = data.examinations || [];
    } catch (err) {
      list.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    document.getElementById('scope-log-count').textContent = scopeExaminations.length;

    if (!scopeExaminations.length) {
      list.innerHTML = '<div class="empty-row">Aucun examen enregistré.</div>';
      return;
    }

    list.innerHTML = scopeExaminations
      .map((e) => {
        const typeMeta = SAMPLE_TYPES[e.sampleType] || SAMPLE_TYPES.inconnu;
        return `
      <div class="post-card">
        <div class="post-card-head">
          <span class="post-card-title">${escapeHtml(e.sampleDesignation)}<span class="type-badge" style="background:${typeMeta.color}22; color:${typeMeta.color};">${escapeHtml(typeMeta.label)}</span></span>
          <span class="post-card-meta">${escapeHtml(e.authorCharacterName)} — ${e.createdAt ? new Date(e.createdAt).toLocaleString('fr-FR') : ''}</span>
        </div>
        <div class="post-card-body">${escapeHtml(e.observations || 'Aucune observation notée.')}</div>
      </div>
    `;
      })
      .join('');
  }

  // ---------------------------------------------------------------------
  // Post-its — notes personnelles rapides, sauvegardées en local
  // (par navigateur), séparées du journal officiel des examens.
  // ---------------------------------------------------------------------
  const NOTES_STORAGE_KEY = 'scope_sticky_notes';
  const NOTE_COLORS = ['#F0D97A', '#F0A8C4', '#A8E0D0', '#A8C4F0', '#F0C09A'];

  function loadStickyNotesFromStorage() {
    try {
      return JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY) || '[]');
    } catch (err) {
      return [];
    }
  }

  function saveStickyNotesToStorage(notes) {
    localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(notes));
  }

  function addStickyNote() {
    const notes = loadStickyNotesFromStorage();
    notes.push({
      id: `note-${Date.now()}`,
      text: '',
      color: NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)],
      rotate: Math.round((Math.random() - 0.5) * 8),
    });
    saveStickyNotesToStorage(notes);
    renderStickyNotes();
  }

  function renderStickyNotes() {
    const board = document.getElementById('scope-notes-board');
    const notes = loadStickyNotesFromStorage();

    if (!notes.length) {
      board.innerHTML = '<div class="empty-row">Aucune note — clique sur "+ Note" pour en ajouter une.</div>';
      return;
    }

    board.innerHTML = notes
      .map(
        (n) => `
      <div class="sticky-note" style="background:${n.color}; transform:rotate(${n.rotate}deg);" data-note-id="${n.id}">
        <button class="sticky-note-delete" data-note-id="${n.id}">×</button>
        <textarea class="sticky-note-text" data-note-id="${n.id}" placeholder="Écris quelque chose...">${escapeHtml(n.text)}</textarea>
      </div>
    `
      )
      .join('');

    board.querySelectorAll('.sticky-note-delete').forEach((btn) => {
      btn.addEventListener('click', () => {
        const notes = loadStickyNotesFromStorage().filter((n) => n.id !== btn.dataset.noteId);
        saveStickyNotesToStorage(notes);
        renderStickyNotes();
      });
    });

    let saveTimeout;
    board.querySelectorAll('.sticky-note-text').forEach((textarea) => {
      textarea.addEventListener('input', () => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          const notes = loadStickyNotesFromStorage();
          const note = notes.find((n) => n.id === textarea.dataset.noteId);
          if (note) {
            note.text = textarea.value;
            saveStickyNotesToStorage(notes);
          }
        }, 400);
      });
    });
  }

  checkAccessAndInit();
</script>
