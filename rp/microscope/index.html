<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microscope — Scientifique — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://voidline-studio.com/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #0A0B0E;
    --void-2: #101218;
    --panel: #14161D;
    --panel-raised: #191c25;
    --line: #2A2D38;
    --line-soft: rgba(255,255,255,0.06);
    --accent: #6E76FF;
    --line-bright: #6E76FF;
    --line-bright-2: #A78BFA;
    --ink: #ECEDF1;
    --ink-dim: #9297A8;
    --ink-faint: #5A5F6E;
    --good: #4FD895;
    --warn: #F0A83C;
    --bad: #F0525A;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  /* Barres de défilement sombres partout — évite le blanc par défaut du
     navigateur qui tranche sur le thème (page principale, modal, listes
     déroulantes...). */
  *{ scrollbar-width:thin; scrollbar-color:#3a3d4a var(--void-2); }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:var(--void-2); }
  *::-webkit-scrollbar-thumb{ background:#3a3d4a; border-radius:4px; }
  *::-webkit-scrollbar-thumb:hover{ background:#4a4d5e; }
  html, body{ height:100%; }
  body{ background:var(--void); color:var(--ink); font-family:'Inter', sans-serif; overflow:hidden; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .topbar{
    height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 18px;
    background:var(--void-2); border-bottom:1px solid var(--line);
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim); padding:6px 10px;
    border-radius:5px; border:1px solid var(--line); transition:color .15s ease, border-color .15s ease;
  }
  .back-link:hover{ color:var(--ink); border-color:var(--line-bright); }
  .back-link svg{ width:14px; height:14px; }
  .topbar-title{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; }
  .topbar-status{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); }

  .center-msg{ display:flex; align-items:center; justify-content:center; height:calc(100vh - 48px); color:var(--ink-dim); font-size:14px; text-align:center; padding:20px; }

  .scope-page{
    height:calc(100vh - 48px); overflow-y:auto; padding:28px 20px;
    display:flex; justify-content:center;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(110,118,255,0.06), transparent 60%);
  }
  .scope-columns{ display:flex; gap:22px; width:100%; max-width:1180px; align-items:flex-start; }
  .scope-col-left{ width:270px; flex-shrink:0; display:flex; flex-direction:column; gap:18px; }
  .scope-col-middle{ flex:1; min-width:340px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .scope-col-right{ width:200px; flex-shrink:0; position:sticky; top:0; }
  .scope-panel.compact .scope-panel-title{ margin-bottom:8px; }

  /* ---- Viseur du microscope ---- */
  .scope-viewport{
    position:relative; width:300px; height:300px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 50% 45%, #171922 0%, #0c0d12 55%, #050508 100%);
    border:7px solid #1c1f29;
    box-shadow:0 0 0 2px var(--line), 0 30px 70px rgba(0,0,0,0.65), inset 0 0 70px rgba(0,0,0,0.85);
    overflow:hidden;
  }
  .scope-viewport::before{
    content:''; position:absolute; inset:0; opacity:0.4; pointer-events:none;
    background-image:radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1.2px);
    background-size:7px 7px;
  }
  .scope-crosshair{ position:absolute; inset:0; pointer-events:none; }
  .scope-crosshair::before, .scope-crosshair::after{ content:''; position:absolute; background:rgba(110,118,255,0.22); }
  .scope-crosshair::before{ top:0; bottom:0; left:50%; width:1px; }
  .scope-crosshair::after{ left:0; right:0; top:50%; height:1px; }
  .scope-specimen{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .6s ease;
  }
  .scope-specimen.visible{ opacity:1; }
  .scope-specimen-blob{
    width:150px; height:150px; border-radius:44% 56% 62% 38% / 48% 42% 58% 52%;
    filter:blur(1px);
    animation:scopeBlobMorph 7s ease-in-out infinite alternate;
  }
  @keyframes scopeBlobMorph{
    0%{ border-radius:44% 56% 62% 38% / 48% 42% 58% 52%; transform:rotate(0deg) scale(1); }
    100%{ border-radius:58% 42% 40% 60% / 60% 48% 52% 40%; transform:rotate(12deg) scale(1.05); }
  }
  .scope-scan-line{
    position:absolute; left:6%; right:6%; height:3px; border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(110,118,255,0.9), transparent);
    box-shadow:0 0 14px rgba(110,118,255,0.7); top:0; opacity:0;
  }
  .scope-scan-line.scanning{ animation:scopeScan 1.6s ease-in-out; }
  @keyframes scopeScan{
    0%{ top:4%; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ top:94%; opacity:0; }
  }
  .scope-idle-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); text-align:center;
    padding:0 40px; letter-spacing:0.04em; text-transform:uppercase;
  }

  .scope-panel{ width:100%; max-width:520px; }
  .scope-panel-title{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em; color:var(--ink-faint);
    text-transform:uppercase; margin-bottom:12px; padding-left:10px; border-left:2px solid var(--line-bright);
  }
  .field-row{ margin-bottom:12px; }
  .field-row label{ display:block; font-size:11.5px; color:var(--ink-faint); margin-bottom:5px; font-family:'JetBrains Mono', monospace; letter-spacing:0.03em; text-transform:uppercase; }
  input, select, textarea{
    width:100%; background:var(--void-2); border:1px solid var(--line); border-radius:5px; padding:9px 11px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:13px;
  }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn{
    padding:10px 18px; border-radius:5px; border:1px solid var(--line); background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:600; cursor:pointer; width:100%;
  }
  .btn.ghost{ background:transparent; color:var(--ink-dim); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .scope-log{ width:100%; max-width:640px; margin-bottom:40px; }
  .scope-log-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .scope-log-head h2{ font-family:'Space Grotesk', sans-serif; font-size:14px; }
  .count{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); }
  .post-card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:8px; }
  .post-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .post-card-title{ font-weight:600; font-size:13px; }
  .post-card-meta{ font-size:11.5px; color:var(--ink-faint); }
  .post-card-body{ font-size:12.5px; color:var(--ink-dim); white-space:pre-wrap; }
  .empty-row{ color:var(--ink-faint); font-size:12.5px; padding:12px 0; text-align:center; }
  .type-badge{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; margin-left:8px;
  }

  /* ---- Curseurs de réglage du microscope ---- */
  .scope-controls{ width:300px; display:flex; flex-direction:column; gap:14px; }
  .scope-control-row label{
    display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10.5px;
    letter-spacing:0.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;
  }
  .scope-control-row label span{ color:var(--line-bright-2); font-weight:600; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px;
    background:var(--line); outline:none; padding:0; border:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 0 8px rgba(110,118,255,0.6);
  }
  input[type="range"]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; border:none;
    box-shadow:0 0 8px rgba(110,118,255,0.6);
  }

  .scope-specimen-zoom-wrap{ display:flex; align-items:center; justify-content:center; }

  /* ---- Rendu plus réaliste du viseur ---- */
  .scope-graticule{ position:absolute; inset:0; pointer-events:none; opacity:0.35; }
  .scope-graticule .ring{
    position:absolute; border:1px solid rgba(110,118,255,0.18); border-radius:50%;
    top:50%; left:50%; transform:translate(-50%,-50%);
  }
  .scope-graticule .tick{
    position:absolute; background:rgba(110,118,255,0.22); top:50%; left:50%;
    width:1px; height:6px; transform-origin:0 0;
  }
  .scope-glass-sheen{
    position:absolute; inset:-20%; pointer-events:none; mix-blend-mode:screen; opacity:0.5;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.10) 45%, rgba(255,255,255,0.02) 52%, transparent 62%);
  }
  .scope-chromatic-edge{
    position:absolute; inset:0; pointer-events:none; border-radius:50%;
    box-shadow:inset 0 0 30px 4px rgba(240,82,90,0.10), inset 0 0 46px 10px rgba(79,168,240,0.08);
  }
  .scope-cell{
    position:absolute; border-radius:50%; mix-blend-mode:screen;
  }

  /* ---- Miniature snapshot dans le journal ---- */
  .scope-mini-preview{
    width:50px; height:50px; border-radius:50%; flex-shrink:0; position:relative; overflow:hidden;
    background:radial-gradient(circle at 50% 45%, #171922 0%, #0c0d12 60%, #050508 100%);
    border:2px solid var(--line);
  }
  .scope-mini-preview .mini-cell{ position:absolute; border-radius:50%; }

  /* ---- Stats perso ---- */
  .scope-stat-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:12px; }
  .scope-stat-row:last-child{ border-bottom:none; }
  .scope-stat-label{ color:var(--ink-faint); }
  .scope-stat-value{ color:var(--ink); font-weight:600; text-align:right; }

  /* ---- Post-its ---- */
  .scope-notes{ width:100%; max-width:640px; }
  .scope-notes-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .scope-notes-head h2{ font-family:'Space Grotesk', sans-serif; font-size:14px; }
  .btn.ghost.small{ width:auto; padding:6px 12px; font-size:11.5px; border:1px solid var(--line); }
  .scope-notes-board{
    display:flex; flex-wrap:wrap; gap:16px; padding:18px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; min-height:80px;
  }
  .sticky-note{
    width:150px; min-height:140px; padding:12px 12px 8px; border-radius:2px; position:relative;
    box-shadow:0 8px 16px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.25);
    font-family:'Space Grotesk', sans-serif; display:flex; flex-direction:column;
    transition:transform .15s ease;
  }
  .sticky-note:hover{ transform:scale(1.03) rotate(0deg) !important; z-index:2; }
  .sticky-note-delete{
    position:absolute; top:4px; right:6px; background:none; border:none; cursor:pointer;
    font-size:14px; color:rgba(10,11,14,0.4); line-height:1; padding:2px;
  }
  .sticky-note-delete:hover{ color:rgba(10,11,14,0.8); }
  .sticky-note-text{
    flex:1; width:100%; background:transparent; border:none; resize:none; color:#1a1a1a;
    font-family:'Space Grotesk', sans-serif; font-size:12.5px; line-height:1.5; padding:0; margin-top:6px;
  }
  .sticky-note-text::placeholder{ color:rgba(10,11,14,0.4); }

  /* ---- Sélecteur SCP façon clipboard ---- */
  .clipboard-trigger{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    background:var(--void-2); border:1px solid var(--line); border-radius:5px; padding:9px 11px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:13px; cursor:pointer;
  }
  .clipboard-trigger:hover{ border-color:var(--line-bright); }
  .clipboard-trigger svg{ width:14px; height:14px; color:var(--ink-faint); flex-shrink:0; }

  .clipboard-panel{
    position:relative; margin-top:8px; background:#1c1e26; border:1px solid var(--line); border-radius:6px;
    padding:16px 10px 10px; box-shadow:0 16px 40px rgba(0,0,0,0.5);
  }
  .clipboard-panel::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:64px; height:16px; background:#3a3d4a; border-radius:4px; border:1px solid var(--line);
  }
  .clipboard-search{ margin-bottom:10px; }
  .clipboard-list{ max-height:220px; overflow-y:auto; padding-right:4px; }
  .clipboard-free-option{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:4px; cursor:pointer;
    font-size:12.5px; color:var(--ink-dim); border:1px dashed var(--line); margin-bottom:10px;
  }
  .clipboard-free-option:hover{ border-color:var(--line-bright); color:var(--ink); }
  .clipboard-group-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:6px 10px 4px; margin-top:4px;
  }
  .clipboard-item{
    padding:7px 10px; border-radius:4px; cursor:pointer; font-size:12.5px; color:var(--ink-dim);
  }
  .clipboard-item:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }
  .clipboard-empty{ padding:10px; font-size:12px; color:var(--ink-faint); text-align:center; }

  /* ---- Réaction du spécimen (réglages extrêmes) ---- */
  .scope-specimen.agitated .scope-specimen-blob{ animation:scopeBlobMorph 7s ease-in-out infinite alternate, scopeAgitate 0.35s ease-in-out infinite; }
  @keyframes scopeAgitate{
    0%, 100%{ margin-left:0; margin-top:0; } 25%{ margin-left:-3px; margin-top:2px; } 50%{ margin-left:3px; margin-top:-2px; } 75%{ margin-left:-2px; margin-top:-3px; }
  }
  #scope-cells.cells-agitated .scope-cell{ animation:scopeCellJitter 0.25s ease-in-out infinite; }
  @keyframes scopeCellJitter{
    0%, 100%{ transform:translate(0,0); } 33%{ transform:translate(-2px, 1px); } 66%{ transform:translate(2px, -1px); }
  }
  .scope-warning{
    margin-top:10px; padding:8px 12px; border-radius:5px; background:rgba(240,82,90,0.1); border:1px solid rgba(240,82,90,0.3);
    color:var(--bad); font-family:'JetBrains Mono', monospace; font-size:11px; text-align:center; display:none;
  }
  .scope-warning.visible{ display:block; }

  /* ---- Bouton ambiance sonore ---- */
  .scope-ambient-btn{
    display:flex; align-items:center; gap:6px; background:var(--void-2); border:1px solid var(--line); border-radius:5px;
    padding:6px 12px; color:var(--ink-faint); font-size:11.5px; cursor:pointer; font-family:'JetBrains Mono', monospace;
  }
  .scope-ambient-btn.active{ color:var(--accent-2); border-color:var(--accent); }

  /* ---- Modal rapport d'expérience ---- */
  .scope-modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100;
  }
  .scope-modal{
    width:440px; max-width:90vw; max-height:85vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:22px; box-shadow:0 30px 70px rgba(0,0,0,0.6);
  }
  .scope-modal h3{ font-family:'Space Grotesk', sans-serif; font-size:15px; margin-bottom:16px; }
  .scope-modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .scope-modal-actions .btn.ghost{ background:var(--void-2); border:1px solid var(--line); }

  /* ---- Alerte de contamination (pur RP) ---- */
  .scope-contamination-overlay{
    position:fixed; inset:0; background:rgba(80,0,0,0.55); display:flex; align-items:center; justify-content:center;
    z-index:200; animation:contaminationFlash 1s steps(2) infinite;
  }
  @keyframes contaminationFlash{ 50%{ background:rgba(120,0,0,0.7); } }
  .scope-contamination-box{
    width:420px; max-width:90vw; background:#1a0d0d; border:2px solid var(--bad); border-radius:8px; padding:26px;
    text-align:center; box-shadow:0 0 60px rgba(240,82,90,0.4);
  }
  .scope-contamination-title{
    font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:700; color:var(--bad); letter-spacing:0.04em;
    margin-bottom:14px; animation:contaminationTitlePulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes contaminationTitlePulse{ from{ opacity:1; } to{ opacity:0.5; } }
  .scope-contamination-msg{ font-size:12.5px; color:var(--ink-dim); line-height:1.6; margin-bottom:20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/rp/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
      Retour à l'intranet
    </a>
    <span class="topbar-title">Microscope — Scientifique</span>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="scope-ambient-btn" id="scope-ambient-btn" type="button">🔊 Ambiance</button>
    <span class="topbar-status mono" id="topbar-status">SCPSCOPE v1.0</span>
  </div>
</div>

<div id="page-root">
  <div class="center-msg">Chargement…</div>
</div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';
  const SCIENCE_DEPT_ID = 'scientifique_mmqbrd32f2z7';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() { return localStorage.getItem(TOKEN_KEY); }

  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  let adminOverrideActive = false; // redemandé à chaque chargement de page, jamais persisté

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(adminOverrideActive ? { 'X-Admin-Override-Dept': SCIENCE_DEPT_ID } : {}),
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }

  const pageRoot = document.getElementById('page-root');

  // ---------------------------------------------------------------------
  // Contrôle d'accès : nécessite un personnage actif Scientifique, ou le
  // Mode Administrateur (canManagePermissions / rpFullAccess côté staff),
  // via la même case à cocher opt-in que le reste de l'intranet RP.
  // ---------------------------------------------------------------------
  async function checkAccessAndInit() {
    if (!getToken()) {
      pageRoot.innerHTML = '<div class="center-msg">Connecte-toi depuis le site avant d\'accéder au Microscope.</div>';
      return;
    }

    let context;
    try {
      context = await apiFetch('/api/rp/context');
    } catch (err) {
      pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    if (context.banned) {
      pageRoot.innerHTML = '<div class="center-msg">Accès révoqué.</div>';
      return;
    }

    const isScience = (context.characters || []).some((c) => c.deptId === SCIENCE_DEPT_ID);
    if (isScience) {
      loadScope();
      return;
    }

    if (context.canUseAdminOverride) {
      pageRoot.innerHTML = `
        <div class="center-msg" style="flex-direction:column; gap:16px;">
          <p>Aucun personnage actif dans Scientifique.</p>
          <label style="display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--accent); cursor:pointer;">
            <input type="checkbox" id="scope-admin-override-checkbox" style="width:16px; height:16px; accent-color:var(--accent); cursor:pointer;">
            Utiliser les perms administrateur ?
          </label>
          <button class="btn" id="scope-admin-override-enter" style="width:auto; padding:9px 20px;">Entrer</button>
        </div>
      `;
      document.getElementById('scope-admin-override-enter').addEventListener('click', async () => {
        const checked = document.getElementById('scope-admin-override-checkbox').checked;
        if (!checked) {
          pageRoot.innerHTML = '<div class="center-msg">Accès refusé — le Microscope est réservé au personnel actif du département Scientifique.</div>';
          return;
        }
        adminOverrideActive = true;

        try {

        } catch (err) {
          pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
          return;
        }
        loadScope();
      });
      return;
    }

    pageRoot.innerHTML = '<div class="center-msg">Accès refusé — le Microscope est réservé au personnel actif du département Scientifique.</div>';
  }

  function initScpPicker() {
    const trigger = document.getElementById('scp-picker-trigger');
    const panel = document.getElementById('scp-picker-panel');
    const freeInput = document.getElementById('scope-designation-free');
    const hiddenInput = document.getElementById('scope-designation');

    function selectFree() {
      selectedScpId = null;
      selectedScpClassification = null;
      document.getElementById('scp-picker-label').textContent = '🔓 Échantillon libre / inconnu';
      freeInput.style.display = 'block';
      freeInput.focus();
      hiddenInput.value = freeInput.value;
      panel.style.display = 'none';

    function selectScp(entry) {
      selectedScpId = entry.id;
      selectedScpClassification = entry.classification;
      document.getElementById('scp-picker-label').textContent = `📋 ${entry.id}`;
      freeInput.style.display = 'none';
      hiddenInput.value = entry.id;
      panel.style.display = 'none';
      if (entry.category) document.getElementById('scope-type').value = entry.category;

      // Règle les curseurs de lumière sur le profil propre à ce SCP.
      const profile = getScpLightProfile(entry.id, entry.classification);
      document.getElementById('scope-brightness').value = profile.idealBrightness;
      document.getElementById('scope-focus').value = profile.idealFocus;
      updateScopeVisuals();
      retuneAmbientSound();
    }

    function renderPanel(filterText) {
      const q = (filterText || '').toLowerCase();
      const groups = { safe: [], euclid: [], keter: [], thaumiel: [] };
      SCP_LIST.forEach((entry) => {
        if (groups[entry.classification] && entry.id.toLowerCase().includes(q)) {
          groups[entry.classification].push(entry);
        }
      });

      // Catalogue personnel : SCP déjà examinés au moins une fois
      // (d'après le journal), marqués d'une coche dans la liste.
      const examinedIds = new Set(scopeExaminations.map((e) => e.sampleDesignation));

      const groupsHtml = Object.entries(groups)
        .map(([key, entries]) => {
          if (!entries.length) return '';
          const meta = CLASSIFICATION_META[key];
          return `
            <div class="clipboard-group-label" style="color:${meta.color};">${meta.label}</div>
            ${entries.map((e) => `<div class="clipboard-item" data-scp-id="${e.id}">${escapeHtml(e.id)}${examinedIds.has(e.id) ? ' <span style="color:var(--good);">✓</span>' : ''}</div>`).join('')}
          `;
        })
        .join('');

      panel.innerHTML = `
        <div class="clipboard-panel">
          <input type="text" class="clipboard-search" id="clipboard-search-input" placeholder="Rechercher un SCP..." value="${escapeHtml(filterText || '')}">
          <div class="clipboard-free-option" id="clipboard-free-option">🔓 Échantillon libre / inconnu</div>
          <div class="clipboard-list">
            ${groupsHtml || '<div class="clipboard-empty">Aucun résultat.</div>'}
          </div>
        </div>
      `;

      document.getElementById('clipboard-free-option').addEventListener('click', selectFree);
      panel.querySelectorAll('.clipboard-item').forEach((el) => {
        el.addEventListener('click', () => {
          const entry = SCP_LIST.find((e) => e.id === el.dataset.scpId);
          if (entry) selectScp(entry);
        });
      });

      const searchInput = document.getElementById('clipboard-search-input');
      searchInput.addEventListener('input', () => renderPanel(searchInput.value));
      // Garde le focus sur la recherche à chaque re-render du panneau,
      // sinon taper une lettre le referme à chaque frappe.
      searchInput.focus();
      searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
    }

    trigger.addEventListener('click', () => {
      const isOpen = panel.style.display !== 'none';
      panel.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) renderPanel('');
    });

    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) {
        panel.style.display = 'none';
      }
    });

    freeInput.addEventListener('input', () => {
      hiddenInput.value = freeInput.value;
    });
  }

  // Génère la graticule (anneaux + graduations radiales) une seule fois —
  // purement décoratif, façon réticule de mesure d'un vrai oculaire.
  function buildGraticule() {
    const graticule = document.getElementById('scope-graticule');
    let html = '';
    [40, 80, 120].forEach((r) => {
      html += `<div class="ring" style="width:${r * 2}px; height:${r * 2}px;"></div>`;
    });
    for (let i = 0; i < 24; i += 1) {
      const angle = (360 / 24) * i;
      html += `<div class="tick" style="transform:rotate(${angle}deg) translate(0, -142px);"></div>`;
    }
    graticule.innerHTML = html;
  }

  // Regénère une texture "cellulaire" (petits amas translucides) à chaque
  // examen, pour que le spécimen ait un aspect granuleux/organique plutôt
  // qu'une simple tache lisse — purement décoratif.
  // Petit générateur pseudo-aléatoire à graine (LCG) — permet de faire
  // apparaître TOUJOURS le même motif de cellules pour un même SCP précis
  // (graine = son id de fiche wiki), plutôt qu'un aspect différent à
  // chaque examen. Sans graine (échantillon libre), reste aléatoire.
  function seededRandom(seedStr) {
    let s = 0;
    for (let i = 0; i < seedStr.length; i += 1) {
      s = (s * 31 + seedStr.charCodeAt(i)) >>> 0;
    }
    return function next() {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  // Profil lumineux propre à chaque SCP — dérivé de manière stable de sa
  // désignation (même graine que ses particules), donc toujours identique
  // d'une session à l'autre pour un même SCP. idealBrightness/idealFocus =
  // réglages "corrects" pour ce spécimen précis ; sensitivity = tolérance
  // avant réaction (plus petit = plus nerveux). La classification pilote la
  // tolérance globale (Keter/Thaumiel = très sensible, Sûr = quasi inerte).
  const SENSITIVITY_BY_CLASS = { safe: 45, euclid: 32, keter: 20, thaumiel: 22 };

  function getScpLightProfile(scpId, classification) {
    if (!scpId) return { idealBrightness: 50, idealFocus: 50, sensitivity: 999 }; // libre/inconnu : jamais de réaction
    const rand = seededRandom(scpId);
    const idealBrightness = Math.round(35 + rand() * 30); // 35–65
    const idealFocus = Math.round(45 + rand() * 35); // 45–80
    let sensitivity = SENSITIVITY_BY_CLASS[classification] || 35;

    // Fatigue : chaque examen consécutif du MÊME SCP réduit sa tolérance
    // (le rend plus nerveux) — pousse à varier plutôt qu'à spammer le même
    // échantillon. Plancher à 8 pour ne jamais devenir instantanément fou.
    if (scpId === lastExaminedScpId && consecutiveExamCount > 0) {
      sensitivity = Math.max(8, sensitivity - consecutiveExamCount * 4);
    }

    return { idealBrightness, idealFocus, sensitivity };
  }

  function buildSpecimenCells(color, seed) {
    const container = document.getElementById('scope-cells');
    const rand = seed ? seededRandom(seed) : Math.random;
    let html = '';
    const count = 10 + Math.floor(rand() * 8);
    for (let i = 0; i < count; i += 1) {
      const size = 8 + rand() * 22;
      const x = 20 + rand() * 110;
      const y = 20 + rand() * 110;
      const opacity = (0.15 + rand() * 0.35).toFixed(2);
      html += `<div class="scope-cell" style="width:${size}px; height:${size}px; left:${x}px; top:${y}px; background:${color}; opacity:${opacity};"></div>`;
    }
    container.innerHTML = html;
  }

  // Reconstruit une miniature statique du spécimen à partir du snapshot
  // sauvegardé avec l'examen — même graine que l'examen d'origine, donc
  // le même motif de cellules réapparaît systématiquement dans le journal.
  function buildMiniSpecimenPreview(elementId, snapshot) {
    const container = document.getElementById(elementId);
    if (!container) return;
    const rand = seededRandom(snapshot.seed || 'default');
    const color = snapshot.color || '#9297A8';
    let html = '';
    const count = 5 + Math.floor(rand() * 5);
    for (let i = 0; i < count; i += 1) {
      const size = 4 + rand() * 8;
      const x = 8 + rand() * 34;
      const y = 8 + rand() * 34;
      const opacity = (0.2 + rand() * 0.35).toFixed(2);
      html += `<div class="mini-cell" style="width:${size}px; height:${size}px; left:${x}px; top:${y}px; background:${color}; opacity:${opacity};"></div>`;
    }
    container.innerHTML = html;
    const brightness = 0.25 + ((snapshot.brightness ?? 50) / 100) * 1.3;
    container.style.filter = `brightness(${brightness})`;
  }

  // Applique en direct grossissement / luminosité / concentration de
  // lumière sur le viseur — purement visuel, rien n'est envoyé au serveur.
  function updateScopeVisuals() {
    const zoom = Number(document.getElementById('scope-zoom').value);
    const brightness = Number(document.getElementById('scope-brightness').value);
    const focus = Number(document.getElementById('scope-focus').value);

    document.getElementById('scope-zoom-value').textContent = `${zoom}x`;
    document.getElementById('scope-brightness-value').textContent = `${brightness}%`;
    document.getElementById('scope-focus-value').textContent = `${focus}%`;

    // Grossissement : zoome le spécimen (sans toucher à sa propre animation
    // de morphing/rotation, gérée séparément par CSS sur le blob lui-même).
    const scale = 0.4 + (zoom / 1000) * 2.6;
    const wrap = document.getElementById('scope-specimen-zoom-wrap');
    wrap.style.transform = `scale(${scale})`;

    // Concentration de lumière : plus c'est concentré (proche de 100%),
    // plus l'image est nette ; diffus (proche de 0%) = flou, comme un
    // condenseur mal réglé sur un vrai microscope.
    const blurAmount = (100 - focus) / 10;
    wrap.style.filter = `blur(${blurAmount}px)`;

    // Réglage de lumière : assombrit/éclaircit tout le viseur.
    const brightnessValue = 0.25 + (brightness / 100) * 1.3;
    document.getElementById('scope-viewport').style.filter = `brightness(${brightnessValue})`;

    // Réaction du spécimen : à quel point les réglages actuels s'écartent
    // du profil lumineux propre à CE SCP précis (idéal + tolérance) —
    // un échantillon libre/inconnu n'a pas de profil donc ne réagit jamais.
    const profile = getScpLightProfile(selectedScpId, selectedScpClassification);
    const deviation = Math.max(Math.abs(brightness - profile.idealBrightness), Math.abs(focus - profile.idealFocus));
    const extremeLight = deviation > profile.sensitivity;
    const specimen = document.getElementById('scope-specimen');
    const warning = document.getElementById('scope-warning');
    const shouldAgitate = currentSpecimenReady && extremeLight;

    if (shouldAgitate) {
      specimen.classList.add('agitated');
      warning.classList.add('visible');
      // Assombrissement supplémentaire du spécimen lui-même (au-delà du
      // brightness global du viseur) + particules qui s'agitent plus fort.
      wrap.style.filter = `blur(${blurAmount}px) brightness(0.55) saturate(1.4)`;
      document.getElementById('scope-cells').classList.add('cells-agitated');
    } else {
      specimen.classList.remove('agitated');
      warning.classList.remove('visible');
      wrap.style.filter = `blur(${blurAmount}px)`;
      document.getElementById('scope-cells').classList.remove('cells-agitated');
    }
  }

  function runExamination() {
    const designation = document.getElementById('scope-designation').value.trim();
    if (!designation) {
      alert('Choisis un SCP dans le wiki, ou saisis une désignation libre.');
      return;
    }

    const type = document.getElementById('scope-type').value;
    const color = (SAMPLE_TYPES[type] || SAMPLE_TYPES.inconnu).color;

    // Fatigue : incrémente si c'est le même SCP que la dernière fois,
    // repart à 1 sinon.
    if (selectedScpId && selectedScpId === lastExaminedScpId) {
      consecutiveExamCount += 1;
    } else {
      consecutiveExamCount = selectedScpId ? 1 : 0;
    }
    lastExaminedScpId = selectedScpId;

    const btn = document.getElementById('scope-examine-btn');
    btn.disabled = true;
    btn.textContent = 'Analyse en cours…';

    document.getElementById('scope-idle-label').style.display = 'none';
    const scanLine = document.getElementById('scope-scan-line');
    scanLine.classList.remove('scanning');
    void scanLine.offsetWidth; // relance l'animation CSS si déjà jouée avant
    scanLine.classList.add('scanning');

    const blob = document.getElementById('scope-specimen-blob');
    blob.style.background = `radial-gradient(circle at 35% 35%, ${color}dd, ${color}55 60%, transparent 90%)`;
    blob.style.boxShadow = `0 0 40px ${color}55`;
    buildSpecimenCells(color, selectedScpId);

    setTimeout(() => {
      document.getElementById('scope-specimen').classList.add('visible');
      currentSpecimenReady = true;
      btn.disabled = false;
      btn.textContent = 'Examiner';
      document.getElementById('scope-results').style.display = 'block';
      document.getElementById('scope-observations').focus();

      // Alerte de contamination aléatoire — pur RP, ~10% de chance, jamais
      // sur un échantillon Sûr (ça n'aurait pas de sens en RP).
      if (selectedScpClassification && selectedScpClassification !== 'safe' && Math.random() < 0.1) {
        triggerContaminationAlert(designation);
      }
    }, 1700);
  }

  // Écran d'alerte factice — le joueur doit "confirmer" pour le faire
  // disparaître, aucune conséquence réelle, juste de l'ambiance.
  function triggerContaminationAlert(designation) {
    playAlarmTone();
    // Trace locale pour la carte stats — { designation, timestamp }.
    localStorage.setItem('scope_last_alert', JSON.stringify({ designation, timestamp: Date.now() }));
    renderStatsCard();

    const overlay = document.createElement('div');
    overlay.className = 'scope-contamination-overlay';
    overlay.innerHTML = `
      <div class="scope-contamination-box">
        <div class="scope-contamination-title">⚠ ALERTE CONTAMINATION ⚠</div>
        <div class="scope-contamination-msg">Rupture de confinement détectée sur l'échantillon ${escapeHtml(designation)}.<br>Protocole de décontamination en attente de confirmation.</div>
        <button class="btn" id="scope-contamination-confirm">Confirmer et gérer l'incident</button>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('scope-contamination-confirm').addEventListener('click', () => overlay.remove());
  }

  function playAlarmTone() {
    try {
      const ctx = ambientAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 440;
      gain.gain.value = 0.04;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
      osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
      osc.stop(ctx.currentTime + 0.6);
    } catch (err) {
      // Silencieux — pas grave si l'audio échoue, l'alerte visuelle suffit.
    }
  }

  async function saveExamination() {
    const designation = document.getElementById('scope-designation').value.trim();
    const type = document.getElementById('scope-type').value;
    const observations = document.getElementById('scope-observations').value.trim();
    const synthese = document.getElementById('scope-synthese').value.trim();
    const commentaires = document.getElementById('scope-commentaires').value.trim();
    const statutInput = document.querySelector('input[name="scope-statut"]:checked');
    const statut = statutInput ? statutInput.value : null;

    if (!designation) { alert("La désignation de l'échantillon est obligatoire."); return; }

    const saveBtn = document.getElementById('scope-save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Enregistrement…';

    // Snapshot = état visuel du viseur au moment de la sauvegarde
    // (réglages + apparence du spécimen), pour pouvoir le re-rendre en
    // miniature dans le journal plus tard.
    const snapshot = {
      zoom: Number(document.getElementById('scope-zoom').value),
      brightness: Number(document.getElementById('scope-brightness').value),
      focus: Number(document.getElementById('scope-focus').value),
      color: (SAMPLE_TYPES[type] || SAMPLE_TYPES.inconnu).color,
      seed: selectedScpId || designation,
    };

    try {
      await apiFetch('/api/rp/science-ops/microscope', {
        method: 'POST',
        body: JSON.stringify({ sampleDesignation: designation, sampleType: type, observations, snapshot, synthese, statut, commentaires }),
      });

      // Reset de l'interface pour le prochain examen
      document.getElementById('scope-form').reset();
      document.getElementById('scope-results').style.display = 'none';
      document.getElementById('scope-observations').value = '';
      document.getElementById('scope-synthese').value = '';
      document.getElementById('scope-commentaires').value = '';
      document.querySelectorAll('input[name="scope-statut"]').forEach((r) => { r.checked = false; });
      document.getElementById('scope-specimen').classList.remove('visible');
      document.getElementById('scope-idle-label').style.display = 'flex';
      currentSpecimenReady = false;

      // Remet aussi les curseurs à leurs valeurs par défaut.
      document.getElementById('scope-zoom').value = 100;
      document.getElementById('scope-brightness').value = 50;
      document.getElementById('scope-focus').value = 50;
      updateScopeVisuals();

      // Remet le sélecteur SCP à zéro.
      selectedScpId = null;
      selectedScpClassification = null;
      document.getElementById('scp-picker-label').textContent = '📋 Choisir un SCP…';
      document.getElementById('scope-designation-free').style.display = 'none';
      document.getElementById('scope-designation-free').value = '';

      loadScopeLog();
    } catch (err) {
      alert(`Erreur : ${err.message}`);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Enregistrer l'examen";
    }
  }

  async function loadScopeLog() {
    const list = document.getElementById('scope-log-list');
    try {
      const data = await apiFetch('/api/rp/science-ops/microscope');
      scopeExaminations = data.examinations || [];
    } catch (err) {
      list.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    document.getElementById('scope-log-count').textContent = scopeExaminations.length;

    renderScopeLog(document.getElementById('scope-log-search').value);
    renderStatsCard();
  }

  function renderStatsCard() {
    const card = document.getElementById('scope-stats-card');
    if (!card) return;

    const total = scopeExaminations.length;

    let mostStudied = '—';
    if (total) {
      const counts = {};
      scopeExaminations.forEach((e) => {
        counts[e.sampleDesignation] = (counts[e.sampleDesignation] || 0) + 1;
      });
      mostStudied = Object.entries(counts).sort(([, a], [, b]) => b - a)[0][0];
    }

    let lastAlertText = 'Aucune';
    try {
      const lastAlert = JSON.parse(localStorage.getItem('scope_last_alert') || 'null');
      if (lastAlert) {
        lastAlertText = `${lastAlert.designation} — ${new Date(lastAlert.timestamp).toLocaleDateString('fr-FR')}`;
      }
    } catch (err) {
      lastAlertText = 'Aucune';
    }

    card.innerHTML = `
      <div class="scope-stat-row"><span class="scope-stat-label">Examens réalisés</span><span class="scope-stat-value">${total}</span></div>
      <div class="scope-stat-row"><span class="scope-stat-label">SCP le plus étudié</span><span class="scope-stat-value">${escapeHtml(mostStudied)}</span></div>
      <div class="scope-stat-row"><span class="scope-stat-label">Dernière alerte</span><span class="scope-stat-value">${escapeHtml(lastAlertText)}</span></div>
    `;
  }

  // Exporte le journal complet en un seul fichier texte téléchargeable.
  function exportFullJournal() {
    if (!scopeExaminations.length) { alert('Aucun examen à exporter.'); return; }

    const lines = scopeExaminations.map((e) => {
      const typeMeta = SAMPLE_TYPES[e.sampleType] || SAMPLE_TYPES.inconnu;
      const date = e.createdAt ? new Date(e.createdAt).toLocaleString('fr-FR') : 'Date inconnue';
      return [
        '═══════════════════════════════',
        `Échantillon : ${e.sampleDesignation}`,
        `Type : ${typeMeta.label}`,
        `Examiné par : ${e.authorCharacterName}`,
        `Date : ${date}`,
        '',
        e.observations || 'Aucune observation notée.',
      ].join('\n');
    });

    const content = `JOURNAL COMPLET — SCPSCOPE\n${scopeExaminations.length} examen(s)\n\n${lines.join('\n\n')}`;
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `journal-scpscope-${new Date().toISOString().slice(0, 10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

    const e = scopeExaminations.find((x) => x.id === examinationId);
    if (!e) return;
    const typeMeta = SAMPLE_TYPES[e.sampleType] || SAMPLE_TYPES.inconnu;
    const date = e.createdAt ? new Date(e.createdAt).toLocaleString('fr-FR') : 'Date inconnue';

    const sheet = [
      '═══════════════════════════════',
      'FICHE D\'EXAMEN MICROSCOPIQUE',
      '═══════════════════════════════',
      `Échantillon : ${e.sampleDesignation}`,
      `Type : ${typeMeta.label}`,
      `Examiné par : ${e.authorCharacterName}`,
      `Date : ${date}`,
      '',
      'OBSERVATIONS',

      ...(e.commentaires ? ['', 'COMMENTAIRES', '------------', e.commentaires] : []),

  // Post-its — notes personnelles rapides, sauvegardées en local

  // ---------------------------------------------------------------------
  const NOTES_STORAGE_KEY = 'scope_sticky_notes';
  const NOTE_COLORS = ['#F0D97A', '#F0A8C4', '#A8E0D0', '#A8C4F0', '#F0C09A'];

  function loadStickyNotesFromStorage() {
    try {
      return JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY) || '[]');
    } catch (err) {
      return [];
    }
  }

  function saveStickyNotesToStorage(notes) {
    localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(notes));
  }

  function addStickyNote() {
    const notes = loadStickyNotesFromStorage();
    notes.push({
      id: `note-${Date.now()}`,
      text: '',
      color: NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)],
      rotate: Math.round((Math.random() - 0.5) * 8),
    });
    saveStickyNotesToStorage(notes);
    renderStickyNotes();
  }

  function renderStickyNotes() {
    const board = document.getElementById('scope-notes-board');
    const notes = loadStickyNotesFromStorage();

    if (!notes.length) {
      board.innerHTML = '<div class="empty-row">Aucune note — clique sur "+ Note" pour en ajouter une.</div>';
      return;
    }

    board.innerHTML = notes
      .map(
        (n) => `
      <div class="sticky-note" style="background:${n.color}; transform:rotate(${n.rotate}deg);" data-note-id="${n.id}">
        <button class="sticky-note-delete" data-note-id="${n.id}">×</button>
        <textarea class="sticky-note-text" data-note-id="${n.id}" placeholder="Écris quelque chose...">${escapeHtml(n.text)}</textarea>
      </div>
    `
      )
      .join('');

    board.querySelectorAll('.sticky-note-delete').forEach((btn) => {
      btn.addEventListener('click', () => {
        const notes = loadStickyNotesFromStorage().filter((n) => n.id !== btn.dataset.noteId);
        saveStickyNotesToStorage(notes);
        renderStickyNotes();
      });
    });

    let saveTimeout;
    board.querySelectorAll('.sticky-note-text').forEach((textarea) => {
      textarea.addEventListener('input', () => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          const notes = loadStickyNotesFromStorage();
          const note = notes.find((n) => n.id === textarea.dataset.noteId);
          if (note) {
            note.text = textarea.value;
            saveStickyNotesToStorage(notes);
          }
        }, 400);
      });
    });
  }

  // ---------------------------------------------------------------------
  // Ambiance sonore — bourdonnement synthétisé (Web Audio API), pas de
  // fichier externe. Démarré/arrêté uniquement par clic (contrainte des
  // navigateurs), jamais automatique.
  // ---------------------------------------------------------------------
  let ambientAudioCtx = null;
  let ambientNodes = null;
  let ambientWantsPlaying = true; // activé par défaut, comme demandé

  // Fréquence de base du bourdonnement d'ambiance selon la classification
  // du SCP à l'écran — plus grave/sombre sur un Keter, neutre sur un Sûr.
  const AMBIENT_BASE_FREQ_BY_CLASS = { safe: 74, euclid: 62, keter: 46, thaumiel: 52 };

  function getAmbientBaseFreq() {
    if (!selectedScpClassification) return 62; // défaut, cohérent avec avant
    return AMBIENT_BASE_FREQ_BY_CLASS[selectedScpClassification] || 62;
  }

  function startAmbientSound() {
    if (ambientNodes) return; // déjà en cours

    if (!ambientAudioCtx) {
      ambientAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // Les navigateurs démarrent un AudioContext en "suspended" tant qu'il
    // n'y a pas eu d'interaction utilisateur — resume() est sans effet
    // s'il est déjà "running", donc sûr à appeler à chaque tentative.
    ambientAudioCtx.resume();

    const gain = ambientAudioCtx.createGain();
    gain.gain.value = 0.025; // très discret, ambiance de fond seulement
    gain.connect(ambientAudioCtx.destination);

    const baseFreq = getAmbientBaseFreq();

    const osc1 = ambientAudioCtx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = baseFreq;
    osc1.connect(gain);

    const osc2 = ambientAudioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = baseFreq + 2.5; // léger décalage -> battement lent, plus organique qu'un ton pur
    osc2.connect(gain);

    osc1.start();
    osc2.start();

    ambientNodes = { osc1, osc2, gain };
    const btn = document.getElementById('scope-ambient-btn');
    btn.classList.add('active');
    btn.textContent = '🔇 Ambiance';
  }

  // Réaccorde le bourdonnement en cours (sans le couper) quand le SCP
  // sélectionné change — transition douce sur 0.8s plutôt qu'un saut brut.
  function retuneAmbientSound() {
    if (!ambientNodes || !ambientAudioCtx) return;
    const baseFreq = getAmbientBaseFreq();
    const now = ambientAudioCtx.currentTime;
    ambientNodes.osc1.frequency.linearRampToValueAtTime(baseFreq, now + 0.8);
    ambientNodes.osc2.frequency.linearRampToValueAtTime(baseFreq + 2.5, now + 0.8);
  }

  function stopAmbientSound() {
    if (!ambientNodes) return;
    ambientNodes.osc1.stop();
    ambientNodes.osc2.stop();
    ambientNodes = null;
    const btn = document.getElementById('scope-ambient-btn');
    btn.classList.remove('active');
    btn.textContent = '🔊 Ambiance';
  }

  function toggleAmbientSound() {
    if (ambientNodes) {
      ambientWantsPlaying = false;
      stopAmbientSound();
    } else {
      ambientWantsPlaying = true;
      startAmbientSound();
    }
  }

  // Activé par défaut : le bouton l'affiche tout de suite comme actif, et
  // le son démarre réellement dès la toute première interaction sur la
  // page (clic, touche...), contournement standard du blocage autoplay.
  document.getElementById('scope-ambient-btn').classList.add('active');
  document.getElementById('scope-ambient-btn').textContent = '🔇 Ambiance';
  function primeAmbientOnFirstInteraction() {
    if (ambientWantsPlaying) startAmbientSound();
    document.removeEventListener('click', primeAmbientOnFirstInteraction);
    document.removeEventListener('keydown', primeAmbientOnFirstInteraction);
  }
  document.addEventListener('click', primeAmbientOnFirstInteraction);
  document.addEventListener('keydown', primeAmbientOnFirstInteraction);

  document.getElementById('scope-ambient-btn').addEventListener('click', toggleAmbientSound);

  // ---------------------------------------------------------------------
  // Son de clic — léger tick synthétisé sur CHAQUE clic dans la page.
  // ---------------------------------------------------------------------
  function playClickSound() {
    try {
      const ctx = ambientAudioCtx || (ambientAudioCtx = new (window.AudioContext || window.webkitAudioContext)());
      ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1200;
      gain.gain.value = 0.02;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.04);
      osc.stop(ctx.currentTime + 0.05);
    } catch (err) {
      // Silencieux — un clic sans son n'est pas bloquant.
    }
  }
  document.addEventListener('click', playClickSound);

  checkAccessAndInit();
</script>

</body>
