<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bureau — Administratif — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://voidline-studio.com/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #0A0B0E;
    --void-2: #101218;
    --panel: #14161D;
    --panel-raised: #191c25;
    --line: #2A2D38;
    --line-soft: rgba(255,255,255,0.06);
    --accent: #6E76FF;
    --line-bright: #6E76FF;
    --line-bright-2: #A78BFA;
    --ink: #ECEDF1;
    --ink-dim: #9297A8;
    --ink-faint: #5A5F6E;
    --good: #4FD895;
    --warn: #F0A83C;
    --bad: #F0525A;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:var(--void); color:var(--ink); font-family:'Inter', sans-serif; overflow:hidden;
  }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .topbar{
    height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 18px;
    background:var(--void-2); border-bottom:1px solid var(--line);
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim); padding:6px 10px;
    border-radius:5px; border:1px solid var(--line); transition:color .15s ease, border-color .15s ease;
  }
  .back-link:hover{ color:var(--ink); border-color:var(--line-bright); }
  .back-link svg{ width:14px; height:14px; }
  .topbar-title{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; }
  .topbar-status{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); }

  .center-msg{ display:flex; align-items:center; justify-content:center; height:calc(100vh - 48px); color:var(--ink-dim); font-size:14px; text-align:center; padding:20px; }

  /* ---- Bureau (faux OS SCP) ---- */
  .desktop-shell{
    position:relative; width:100%; height:calc(100vh - 48px); overflow:hidden; user-select:none;
    background:
      radial-gradient(ellipse 1100px 600px at 70% -10%, rgba(110,118,255,0.08), transparent 60%),
      linear-gradient(160deg, #0c0d11, #06070a 70%);
  }
  .desktop-shell::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0.04;
    background-image:
      linear-gradient(to right, #fff 1px, transparent 1px),
      linear-gradient(to bottom, #fff 1px, transparent 1px);
    background-size:40px 40px;
  }
  .desktop-watermark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:420px; opacity:0.035;
    pointer-events:none; filter:grayscale(1);
  }
  .desktop-icons{ position:absolute; top:24px; left:24px; display:flex; flex-direction:column; gap:18px; z-index:1; }
  .desktop-icon{
    width:82px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    padding:8px 4px; border-radius:6px; text-align:center;
  }
  .desktop-icon:hover{ background:rgba(255,255,255,0.06); }
  .desktop-icon-glyph{
    width:44px; height:44px; border-radius:9px; background:var(--accent); display:flex; align-items:center;
    justify-content:center; color:#fff; box-shadow:0 6px 16px rgba(110,118,255,0.35);
  }
  .desktop-icon-glyph svg{ width:24px; height:24px; }
  .desktop-icon-label{ font-size:11.5px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.8); line-height:1.3; }

  .desktop-window{
    position:absolute; min-width:340px; min-height:240px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; box-shadow:0 24px 60px rgba(0,0,0,0.55); display:flex; flex-direction:column; overflow:hidden;
  }
  .desktop-window.focused{ border-color:var(--accent); }
  .desktop-window-titlebar{
    display:flex; align-items:center; justify-content:space-between; padding:0 8px 0 14px; height:38px;
    background:linear-gradient(180deg, #1c1f29, #14161d); border-bottom:1px solid var(--line); cursor:move; flex-shrink:0;
  }
  .desktop-window-title{ font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:600; color:var(--ink); }
  .desktop-window-controls{ display:flex; gap:6px; }
  .desktop-window-btn{
    width:22px; height:22px; border-radius:4px; border:none; background:transparent; color:var(--ink-faint);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .desktop-window-btn:hover{ background:rgba(255,255,255,0.08); color:var(--ink); }
  .desktop-window-btn.close:hover{ background:var(--bad); color:#fff; }
  .desktop-window-body{ flex:1; overflow-y:auto; padding:20px; }
  .desktop-window-resize{ position:absolute; bottom:0; right:0; width:16px; height:16px; cursor:nwse-resize; }
  .desktop-window-resize::after{
    content:''; position:absolute; bottom:4px; right:4px; width:7px; height:7px;
    border-right:2px solid var(--line-bright); border-bottom:2px solid var(--line-bright);
  }

  .desktop-taskbar{
    position:absolute; bottom:0; left:0; right:0; height:44px; background:rgba(12,13,17,0.9);
    backdrop-filter:blur(6px); border-top:1px solid var(--line); display:flex; align-items:center;
    gap:8px; padding:0 14px; z-index:50;
  }
  .desktop-start-btn{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:5px; background:var(--accent);
    color:#fff; font-size:11.5px; font-weight:600; font-family:'JetBrains Mono', monospace;
  }
  .desktop-taskbar-item{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:5px; background:var(--void-2);
    border:1px solid var(--line); color:var(--ink-dim); font-size:11.5px; cursor:pointer;
  }
  .desktop-taskbar-item.active{ border-color:var(--accent); color:var(--ink); }
  .desktop-clock{ margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-faint); }

  /* ---- Éléments réutilisés du panel (formulaires, tableaux, cartes) ---- */
  .med-subnav{ display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .med-subnav-btn{
    padding:9px 14px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink-faint); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent;
  }
  .med-subnav-btn.active{ color:var(--line-bright-2); border-bottom-color:var(--accent); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-soft); }
  th{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); }
  input, select, textarea{
    width:100%; background:var(--void-2); border:1px solid var(--line); border-radius:5px; padding:8px 10px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:13px;
  }
  .field-row{ margin-bottom:12px; }
  .field-row label{ display:block; font-size:11.5px; color:var(--ink-faint); margin-bottom:5px; font-family:'JetBrains Mono', monospace; letter-spacing:0.03em; text-transform:uppercase; }
  .btn{
    padding:9px 16px; border-radius:5px; border:1px solid var(--line); background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .btn.small{ padding:6px 12px; font-size:12px; }
  .btn.danger{ background:var(--bad); }
  .record-block{ margin-bottom:20px; }
  .record-block-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .record-block-head h2{ font-family:'Space Grotesk', sans-serif; font-size:14px; }
  .count{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); }
  .post-card{ background:var(--void-2); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:8px; }
  .post-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .post-card-title{ font-weight:600; font-size:13px; }
  .post-card-meta{ font-size:11.5px; color:var(--ink-faint); }
  .post-card-body{ font-size:12.5px; color:var(--ink-dim); }
  .empty-row{ color:var(--ink-faint); font-size:12.5px; padding:12px 0; }
  .subsection{ margin-top:20px; padding:16px; border:1px solid var(--line); border-radius:8px; background:var(--void-2); }
  .subsection h3{ font-family:'Space Grotesk', sans-serif; font-size:13px; margin-bottom:12px; }
  .status-pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:10.5px; font-family:'JetBrains Mono', monospace; text-transform:uppercase; }
  .status-actif{ background:rgba(79,216,149,0.12); color:var(--good); }
  .status-inactif{ background:rgba(240,168,60,0.12); color:var(--warn); }
  .status-archivé{ background:rgba(240,82,90,0.12); color:var(--bad); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/rp/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
      Retour à l'intranet
    </a>
    <span class="topbar-title">Bureau — Administratif</span>
  </div>
  <span class="topbar-status mono" id="topbar-status">SCP-OS v3.11</span>
</div>

<div id="page-root">
  <div class="center-msg">Chargement…</div>
</div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';
  const ADMIN_DEPT_ID = 'administratif_mmqbmvq8ikle';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() { return localStorage.getItem(TOKEN_KEY); }

  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }

  function showToast(message) {
    // Pas de système de toast sur cette page indépendante — simple alerte discrète en console + alert natif en cas d'erreur bloquante.
    console.log(message);
  }

  const pageRoot = document.getElementById('page-root');

  // ---------------------------------------------------------------------
  // Contrôle d'accès : nécessite un personnage actif Administratif.
  // ---------------------------------------------------------------------
  async function checkAccessAndInit() {
    if (!getToken()) {
      pageRoot.innerHTML = '<div class="center-msg">Connecte-toi depuis le site avant d\'accéder au Bureau.</div>';
      return;
    }

    let context;
    try {
      context = await apiFetch('/api/rp/context');
    } catch (err) {
      pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    if (context.banned) {
      pageRoot.innerHTML = '<div class="center-msg">Accès révoqué.</div>';
      return;
    }

    const isAdmin = (context.characters || []).some((c) => c.deptId === ADMIN_DEPT_ID);
    if (!isAdmin) {
      pageRoot.innerHTML = '<div class="center-msg">Accès refusé — le Bureau est réservé au personnel actif du département Administratif.</div>';
      return;
    }

    loadDesktop();
  }

  // ---------------------------------------------------------------------
  // Gestionnaire de fenêtres
  // ---------------------------------------------------------------------
  let desktopWindows = [];
  let desktopZCounter = 10;
  let desktopClockInterval = null;
  let activeDragWindow = null;
  let activeResizeWindow = null;

  document.addEventListener('mousemove', (e) => {
    if (activeDragWindow) {
      const win = desktopWindows.find((w) => w.id === activeDragWindow.winId);
      if (win) {
        win.x = e.clientX - activeDragWindow.offsetX;
        win.y = e.clientY - activeDragWindow.offsetY;
        updateDesktopWindowGeometry(win);
      }
    }
    if (activeResizeWindow) {
      const win = desktopWindows.find((w) => w.id === activeResizeWindow.winId);
      if (win) {
        win.width = Math.max(340, activeResizeWindow.startW + (e.clientX - activeResizeWindow.startX));
        win.height = Math.max(240, activeResizeWindow.startH + (e.clientY - activeResizeWindow.startY));
        updateDesktopWindowGeometry(win);
      }
    }
  });
  document.addEventListener('mouseup', () => {
    activeDragWindow = null;
    activeResizeWindow = null;
  });

  function updateDesktopWindowGeometry(win) {
    const el = document.getElementById(`desktop-window-${win.id}`);
    if (!el) return;
    el.style.left = `${win.x}px`;
    el.style.top = `${win.y}px`;
    el.style.width = `${win.width}px`;
    el.style.height = `${win.height}px`;
  }

  function focusDesktopWindow(id) {
    desktopZCounter += 1;
    const win = desktopWindows.find((w) => w.id === id);
    if (!win) return;
    win.zIndex = desktopZCounter;
    win.minimized = false;
    document.querySelectorAll('.desktop-window').forEach((el) => el.classList.remove('focused'));
    const el = document.getElementById(`desktop-window-${id}`);
    if (el) {
      el.style.zIndex = win.zIndex;
      el.style.display = 'flex';
      el.classList.add('focused');
    }
    renderDesktopTaskbar();
  }

  function closeDesktopWindow(id) {
    desktopWindows = desktopWindows.filter((w) => w.id !== id);
    const el = document.getElementById(`desktop-window-${id}`);
    if (el) el.remove();
    renderDesktopTaskbar();
  }

  function minimizeDesktopWindow(id) {
    const win = desktopWindows.find((w) => w.id === id);
    if (!win) return;
    win.minimized = true;
    const el = document.getElementById(`desktop-window-${id}`);
    if (el) el.style.display = 'none';
    renderDesktopTaskbar();
  }

  function renderDesktopTaskbar() {
    const bar = document.getElementById('desktop-taskbar-items');
    if (!bar) return;
    bar.innerHTML = desktopWindows
      .map((w) => `<button class="desktop-taskbar-item${!w.minimized ? ' active' : ''}" data-win-id="${w.id}">${escapeHtml(w.title)}</button>`)
      .join('');
    bar.querySelectorAll('.desktop-taskbar-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.winId;
        const win = desktopWindows.find((w) => w.id === id);
        if (win && !win.minimized) minimizeDesktopWindow(id);
        else focusDesktopWindow(id);
      });
    });
  }

  function openDesktopWindow(appId, title, bodyHtml, onMount, size) {
    const existing = desktopWindows.find((w) => w.appId === appId);
    if (existing) {
      focusDesktopWindow(existing.id);
      return;
    }

    const id = `${appId}-${Date.now()}`;
    const win = {
      id, appId, title,
      x: 60 + desktopWindows.length * 24,
      y: 40 + desktopWindows.length * 24,
      width: (size && size.width) || 620, height: (size && size.height) || 460,
      zIndex: (desktopZCounter += 1),
      minimized: false,
    };
    desktopWindows.push(win);

    const layer = document.getElementById('desktop-windows-layer');
    const winEl = document.createElement('div');
    winEl.className = 'desktop-window focused';
    winEl.id = `desktop-window-${id}`;
    winEl.style.left = `${win.x}px`;
    winEl.style.top = `${win.y}px`;
    winEl.style.width = `${win.width}px`;
    winEl.style.height = `${win.height}px`;
    winEl.style.zIndex = win.zIndex;
    winEl.innerHTML = `
      <div class="desktop-window-titlebar" data-win-id="${id}">
        <span class="desktop-window-title">${escapeHtml(title)}</span>
        <div class="desktop-window-controls">
          <button class="desktop-window-btn minimize-btn" data-win-id="${id}">–</button>
          <button class="desktop-window-btn close close-btn" data-win-id="${id}">×</button>
        </div>
      </div>
      <div class="desktop-window-body" id="desktop-window-body-${id}">${bodyHtml}</div>
      <div class="desktop-window-resize" data-win-id="${id}"></div>
    `;
    layer.appendChild(winEl);

    winEl.addEventListener('mousedown', () => focusDesktopWindow(id));

    const titlebar = winEl.querySelector('.desktop-window-titlebar');
    titlebar.addEventListener('mousedown', (e) => {
      if (e.target.closest('.desktop-window-btn')) return;
      activeDragWindow = { winId: id, offsetX: e.clientX - win.x, offsetY: e.clientY - win.y };
      focusDesktopWindow(id);
      e.preventDefault();
    });

    winEl.querySelector('.minimize-btn').addEventListener('click', () => minimizeDesktopWindow(id));
    winEl.querySelector('.close-btn').addEventListener('click', () => closeDesktopWindow(id));

    winEl.querySelector('.desktop-window-resize').addEventListener('mousedown', (e) => {
      activeResizeWindow = { winId: id, startX: e.clientX, startY: e.clientY, startW: win.width, startH: win.height };
      e.preventDefault();
      e.stopPropagation();
    });

    renderDesktopTaskbar();
    if (onMount) onMount(id);
  }

  const ICON_DOCUMENT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v3h3M9 9h6M9 13h6M9 17h4"/></svg>';
  const ICON_MONITOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>';
  const ICON_NOTEPAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M16 3v3h3"/><path d="M9 21v-5l7-7 3 3-7 7z"/></svg>';
  const ICON_CALCULATOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6.5h8"/><circle cx="8.3" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="15.7" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="8.3" cy="14.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="15.7" cy="14.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="8.3" cy="18" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="0.9" fill="currentColor" stroke="none"/><circle cx="15.7" cy="18" r="0.9" fill="currentColor" stroke="none"/></svg>';
  const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13.5h10L18 7"/><path d="M10 11v6M14 11v6"/></svg>';
  const ICON_TERMINAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l4 3-4 3"/><path d="M13 15h4"/></svg>';

  function loadDesktop() {
    desktopWindows = [];
    pageRoot.innerHTML = `
      <div class="desktop-shell" id="desktop-shell">
        <img class="desktop-watermark" src="/ressources/voidline-logo-white.png" alt="" aria-hidden="true">
        <div class="desktop-icons">
          <div class="desktop-icon" id="icon-budget">
            <div class="desktop-icon-glyph">${ICON_DOCUMENT}</div>
            <span class="desktop-icon-label">Budget<br>Départemental</span>
          </div>
          <div class="desktop-icon" id="icon-notepad">
            <div class="desktop-icon-glyph" style="background:#F0A83C;">${ICON_NOTEPAD}</div>
            <span class="desktop-icon-label">Bloc-notes</span>
          </div>
          <div class="desktop-icon" id="icon-calculator">
            <div class="desktop-icon-glyph" style="background:#4FD895;">${ICON_CALCULATOR}</div>
            <span class="desktop-icon-label">Calculatrice</span>
          </div>
          <div class="desktop-icon" id="icon-explorer">
            <div class="desktop-icon-glyph" style="background:#F0763C;">${ICON_FOLDER}</div>
            <span class="desktop-icon-label">Explorateur</span>
          </div>
          <div class="desktop-icon" id="icon-trash">
            <div class="desktop-icon-glyph" style="background:#5A5F6E;">${ICON_TRASH}</div>
            <span class="desktop-icon-label">Corbeille</span>
          </div>
          <div class="desktop-icon" id="icon-terminal">
            <div class="desktop-icon-glyph" style="background:#0A0B0E; border:1px solid var(--line);">${ICON_TERMINAL}</div>
            <span class="desktop-icon-label">Terminal</span>
          </div>
        </div>
        <div class="desktop-windows-layer" id="desktop-windows-layer"></div>
        <div class="desktop-taskbar">
          <div class="desktop-start-btn">${ICON_MONITOR} SCP-OS</div>

  async function renderBudgetApp(winId) {
    const body = document.getElementById(`desktop-window-body-${winId}`);
    if (!body) return;
    const TABS = [
      { id: 'allocations', label: 'Allocations' },
      { id: 'requests', label: 'Demandes' },
      { id: 'orders', label: 'Bons de commande' },
      { id: 'catalog', label: 'Catalogue' },
      { id: 'stock', label: 'Stock' },
      { id: 'invoices', label: 'Factures' },
      { id: 'log', label: 'Journal' },
    ];
    body.innerHTML = `
      <div class="med-subnav" style="flex-wrap:wrap;">
        ${TABS.map((t) => `<button class="med-subnav-btn${budgetSubTab === t.id ? ' active' : ''}" data-sub="${t.id}" type="button">${t.label}</button>`).join('')}
      </div>
      <div id="budget-content-${winId}"></div>
    `;
    body.querySelectorAll('.med-subnav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        budgetSubTab = btn.dataset.sub;
        renderBudgetApp(winId);
      });
    });

    if (budgetSubTab === 'allocations') loadBudgetAllocations(winId);
    else if (budgetSubTab === 'requests') loadBudgetRequests(winId);
    else if (budgetSubTab === 'orders') loadBudgetOrders(winId);
    else if (budgetSubTab === 'catalog') loadBudgetCatalog(winId);
    else if (budgetSubTab === 'stock') loadBudgetStock(winId);
    else if (budgetSubTab === 'invoices') loadBudgetInvoices(winId);
    else if (budgetSubTab === 'log') loadBudgetLogTab(winId);
  }

          <div class="field-row"><label>Date</label><input type="text" id="budget-invoice-date-${winId}" placeholder="JJ/MM/AAAA"></div>
          <div class="field-row"><label>Notes</label><textarea id="budget-invoice-notes-${winId}" rows="2"></textarea></div>

    `;

    content.querySelectorAll('.budget-invoice-delete-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/rp/admin-ops/budget/invoices/${encodeURIComponent(btn.dataset.invoiceId)}`, { method: 'DELETE' });
          showToast('Facture supprimée.');
          loadBudgetInvoices(winId);
        } catch (err) {
          alert(`Erreur : ${err.message}`);
        }
      });
    });

    document.getElementById(`budget-invoice-form-${winId}`).addEventListener('submit', async (e) => {
      e.preventDefault();
      const deptId = document.getElementById(`budget-invoice-dept-${winId}`).value;
      const deptName = BUDGET_DEPTS_LABELS[deptId];
      const title = document.getElementById(`budget-invoice-title-${winId}`).value.trim();
      const amount = document.getElementById(`budget-invoice-amount-${winId}`).value;
      const date = document.getElementById(`budget-invoice-date-${winId}`).value.trim();
      const notes = document.getElementById(`budget-invoice-notes-${winId}`).value.trim();
      if (!title) { alert('Le titre est obligatoire.'); return; }
      try {
        await apiFetch('/api/rp/admin-ops/budget/invoices', { method: 'POST', body: JSON.stringify({ deptId, deptName, title, amount, date, notes }) });
        showToast('Facture enregistrée.');
        loadBudgetInvoices(winId);
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

    if (!content) return;

      data = await apiFetch('/api/rp/admin-ops/budget/log');

  // ---------------------------------------------------------------------
  // App : Calculatrice
  // ---------------------------------------------------------------------
  function openCalculatorApp() {
    openDesktopWindow(
      'calculator',
      'Calculatrice',
      `
      <div style="display:flex; flex-direction:column; gap:10px; height:100%;">
        <div id="calc-display" style="background:var(--void-2); border:1px solid var(--line); border-radius:6px; padding:14px; text-align:right; font-family:'JetBrains Mono', monospace; font-size:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">0</div>
        <div id="calc-grid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; flex:1;"></div>
      </div>
    `,
      () => initCalculator()
    );
  }

  function initCalculator() {
    const display = document.getElementById('calc-display');
    const grid = document.getElementById('calc-grid');
    let current = '0';
    let previous = null;
    let operator = null;
    let resetOnNextDigit = false;

    const BUTTONS = [
      'C', '±', '%', '÷',
      '7', '8', '9', '×',
      '4', '5', '6', '-',
      '1', '2', '3', '+',
      '0', '.', '=',
    ];

    function refreshDisplay() {
      display.textContent = current;
    }

    function inputDigit(d) {
      if (resetOnNextDigit || current === '0') {
        current = d === '.' ? '0.' : d;
        resetOnNextDigit = false;
      } else if (d === '.' && current.includes('.')) {
        return;
      } else {
        current += d;
      }
      refreshDisplay();
    }

    function applyOperator(op) {
      if (operator && !resetOnNextDigit) {
        compute();
      }
      previous = parseFloat(current);
      operator = op;
      resetOnNextDigit = true;
    }

    function compute() {
      if (operator === null || previous === null) return;
      const cur = parseFloat(current);
      let result = cur;
      if (operator === '+') result = previous + cur;
      else if (operator === '-') result = previous - cur;
      else if (operator === '×') result = previous * cur;
      else if (operator === '÷') result = cur === 0 ? NaN : previous / cur;
      current = Number.isFinite(result) ? String(Math.round(result * 1e10) / 1e10) : 'Erreur';
      operator = null;
      previous = null;
      resetOnNextDigit = true;
      refreshDisplay();
    }

    grid.innerHTML = BUTTONS.map((b) => {
      const isOperator = ['÷', '×', '-', '+', '='].includes(b);
      const span = b === '0' ? 'grid-column:span 2;' : '';
      return `<button class="calc-btn" data-btn="${escapeHtml(b)}" style="${span} border:1px solid var(--line); border-radius:6px; background:${isOperator ? 'var(--accent)' : 'var(--void-2)'}; color:${isOperator ? '#fff' : 'var(--ink)'}; font-size:15px; cursor:pointer;">${escapeHtml(b)}</button>`;
    }).join('');

    grid.querySelectorAll('.calc-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.btn;
        if (val === 'C') {
          current = '0'; previous = null; operator = null; resetOnNextDigit = false;
        } else if (val === '±') {
          current = String(parseFloat(current) * -1);
        } else if (val === '%') {
          current = String(parseFloat(current) / 100);
        } else if (val === '=') {
          compute();
        } else if (['÷', '×', '-', '+'].includes(val)) {
          applyOperator(val);
        } else {
          inputDigit(val);
        }
        refreshDisplay();
      });
    });

    refreshDisplay();
  }

  function initExplorer() {

  const TRASH_STORAGE_KEY = 'bureau_trash_emptied';

  function openTrashApp() {
    openDesktopWindow('trash', 'Corbeille', '<div id="trash-content"></div>', () => renderTrash());
  }

  function renderTrash() {
    const content = document.getElementById('trash-content');
    if (!content) return;
    const emptied = localStorage.getItem(TRASH_STORAGE_KEY) === '1';

    if (emptied) {
      content.innerHTML = '<div class="empty-row">La corbeille est vide.</div>';
      return;
    }

    const FAKE_TRASH_ITEMS = ['brouillon_note.txt', 'ancien_rapport.txt', 'sans_titre.txt', 'copie_de_copie.txt'];
    content.innerHTML = `
      <div class="record-block">
        <div class="record-block-head"><h2>Éléments supprimés</h2><span class="count">${FAKE_TRASH_ITEMS.length}</span></div>

      </div>

  // App : Terminal (factice, quelques commandes canon SCP-OS)
  // ---------------------------------------------------------------------
  function openTerminalApp() {
    openDesktopWindow(
      'terminal',
      'Terminal',
      `
      <div id="terminal-output" style="font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--good); height:calc(100% - 30px); overflow-y:auto; white-space:pre-wrap; margin-bottom:8px;">SCP-OS Terminal v3.11
Tape "help" pour la liste des commandes.
</div>
      <div style="display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--good);">
        <span>&gt;</span>
        <input type="text" id="terminal-input" style="flex:1; background:none; border:none; color:var(--good); padding:0; font-family:'JetBrains Mono', monospace; font-size:12.5px;" autocomplete="off">
      </div>
    `,
      () => initTerminal()
    );
  }

  function initTerminal() {
    const output = document.getElementById('terminal-output');
    const input = document.getElementById('terminal-input');

    const COMMANDS = {
      help: () => 'Commandes disponibles : help, whoami, date, status, ls, clear',
      whoami: () => 'utilisateur@SCP-OS — Personnel Administratif, Site-15',
      date: () => new Date().toLocaleString('fr-FR'),
      status: () => 'Tous les systèmes sont opérationnels. Voir voidline-studio.com/statut pour le détail.',
      ls: () => Object.keys(FAKE_FS).join('    '),
    };

    function printLine(text) {
      output.textContent += `\n${text}`;
      output.scrollTop = output.scrollHeight;
    }

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const cmd = input.value.trim();
      input.value = '';
      if (!cmd) return;
      printLine(`> ${cmd}`);

      if (cmd === 'clear') {
        output.textContent = 'SCP-OS Terminal v3.11';
        return;
      }
      const handler = COMMANDS[cmd.toLowerCase()];
      printLine(handler ? handler() : `Commande inconnue : "${cmd}". Tape "help" pour la liste.`);
    });

    input.focus();
  }

  checkAccessAndInit();
