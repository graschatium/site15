<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuaire — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://voidline-studio.com/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #08090C; --void-2: #0D0F14; --panel: #12141B; --line: #23262F; --line-soft: rgba(255,255,255,0.06);
    --accent: #6E76FF; --accent-soft: rgba(110,118,255,0.10); --accent-2: #A78BFA;
    --ink: #ECEDF1; --ink-dim: #9297A8; --ink-faint: #565B6B;
    --good: #4FD895; --warn: #F0A83C; --bad: #F0525A;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  *{ scrollbar-width:thin; scrollbar-color:#3a3d4a var(--void-2); }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:var(--void-2); }
  *::-webkit-scrollbar-thumb{ background:#3a3d4a; border-radius:4px; }
  html, body{ height:100%; }
  body{ background:var(--void); color:var(--ink); font-family:'Inter', sans-serif; overflow:hidden; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .topbar{ height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--void-2); border-bottom:1px solid var(--line); }
  .topbar-left{ display:flex; align-items:center; gap:16px; }
  .back-link{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim); padding:6px 10px; border-radius:5px; border:1px solid var(--line); }
  .back-link:hover{ color:var(--ink); border-color:var(--accent); }
  .back-link svg{ width:14px; height:14px; }
  .topbar-title{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; }
  .topbar-tabs{ display:flex; gap:4px; }
  .topbar-tab{ padding:7px 14px; border-radius:6px; border:1px solid transparent; background:none; color:var(--ink-faint); font-size:12.5px; font-weight:600; cursor:pointer; }
  .topbar-tab:hover{ color:var(--ink); }
  .topbar-tab.active{ background:var(--accent-soft); color:var(--accent-2); border-color:var(--accent); }
  .topbar-status{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); }

  .center-msg{ display:flex; align-items:center; justify-content:center; height:calc(100vh - 48px); color:var(--ink-dim); font-size:14px; text-align:center; padding:20px; }
  .page-body{ height:calc(100vh - 48px); overflow-y:auto; padding:28px 24px; }

  input, select{ background:var(--void-2); border:1px solid var(--line); border-radius:7px; padding:9px 12px; color:var(--ink); font-family:'Inter', sans-serif; font-size:13px; }
  input:focus, select:focus{ outline:none; border-color:var(--accent); }
  .btn{ padding:10px 18px; border-radius:7px; border:none; background:var(--accent); color:#fff; font-size:12.5px; font-weight:600; cursor:pointer; }
  .btn.small{ padding:7px 13px; font-size:11.5px; }
  .empty-row{ color:var(--ink-faint); font-size:12.5px; padding:16px 0; text-align:center; }

  /* ---- Trombinoscope ---- */
  .directory-controls{ display:flex; gap:10px; margin-bottom:22px; max-width:1200px; flex-wrap:wrap; align-items:center; }
  .directory-controls input{ flex:1; min-width:200px; }
  .inactive-toggle{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim); white-space:nowrap; cursor:pointer; }
  .inactive-toggle input{ width:auto; flex:none; }
  .directory-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:14px; max-width:1200px; }
  .person-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; gap:12px; align-items:center; }
  .person-card.inactive-card{ opacity:0.55; }
  .inactive-tag{ font-family:'JetBrains Mono', monospace; font-size:8.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--warn); border:1px solid var(--warn); border-radius:10px; padding:1px 6px; margin-left:4px; }
  .person-avatar{ width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700; color:#fff; flex-shrink:0; overflow:hidden; }
  .person-avatar img{ width:100%; height:100%; object-fit:cover; }
  .person-name{ font-size:13px; font-weight:600; }
  .person-rank{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .person-dept{
    display:inline-block; margin-top:6px; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.05em; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
  }

  /* ---- Fiche personnelle (modal) ---- */
  .person-modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .person-modal{
    width:480px; max-width:100%; max-height:85vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:24px; box-shadow:0 30px 70px rgba(0,0,0,0.6);
  }
  .person-modal-head{ display:flex; align-items:center; gap:14px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .person-modal-section{ margin-bottom:18px; }
  .person-modal-title{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent-2); margin-bottom:10px; }
  .person-modal-actions{ display:flex; justify-content:flex-end; margin-top:6px; }

  .badge-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge-chip{ font-size:11.5px; padding:4px 10px; border-radius:20px; border:1px solid; background:var(--void-2); }

  .career-entry{ background:var(--void-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .career-entry-title{ font-size:12.5px; font-weight:600; }
  .career-entry-desc{ font-size:11.5px; color:var(--ink-dim); margin-top:3px; }
  .career-entry-meta{ font-size:10px; color:var(--ink-faint); margin-top:5px; }
  .hrp-info-row{ display:flex; justify-content:space-between; font-size:11.5px; padding:5px 0; border-bottom:1px solid var(--line-soft); }
  .hrp-info-row:last-child{ border-bottom:none; }
  .hrp-info-row span:first-child{ color:var(--ink-faint); }
  .hrp-info-row span:last-child{ font-family:'JetBrains Mono', monospace; }
  .btn.danger{ background:#F0525A; }

  /* ---- État du site ---- */
  .status-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; max-width:1100px; margin-bottom:24px; }
  .status-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .status-card h2{ font-family:'Space Grotesk', sans-serif; font-size:14px; margin-bottom:14px; }
  .status-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px; }
  .status-row:last-child{ border-bottom:none; }
  .status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:8px; }
  .dot-good{ background:var(--good); box-shadow:0 0 6px var(--good); }
  .dot-warn{ background:var(--warn); box-shadow:0 0 6px var(--warn); }
  .dot-bad{ background:var(--bad); box-shadow:0 0 6px var(--bad); }
  .alert-item{ background:var(--void-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/rp/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
      Retour à l'intranet
    </a>
    <span class="topbar-title">Annuaire — SITE-15</span>
    <div class="topbar-tabs" id="topbar-tabs" style="display:none;">
      <button class="topbar-tab active" data-tab="trombinoscope">Trombinoscope</button>
      <button class="topbar-tab" data-tab="etat-site">État du site</button>
    </div>
  </div>
  <span class="topbar-status mono">ANNUAIRE v1.0</span>
</div>

<div id="page-root">
  <div class="center-msg">Chargement…</div>
</div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';
  const FALLBACK_OVERRIDE_DEPT = 'administratif_mmqbmvq8ikle';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let adminOverrideActive = false;

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(adminOverrideActive ? { 'X-Admin-Override-Dept': FALLBACK_OVERRIDE_DEPT } : {}),
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }

  const pageRoot = document.getElementById('page-root');
  let currentTab = 'trombinoscope';
  let myCharacters = [];

  async function checkAccessAndInit() {
    if (!getToken()) {
      pageRoot.innerHTML = '<div class="center-msg">Connecte-toi depuis le site avant d\'accéder à l\'annuaire.</div>';
      return;
    }

    let context;
    try {
      context = await apiFetch('/api/rp/context');
    } catch (err) {
      pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    if (context.banned) {
      pageRoot.innerHTML = '<div class="center-msg">Accès révoqué.</div>';
      return;
    }

    myCharacters = context.characters || [];
    if (myCharacters.length > 0) {
      startHub();
      return;
    }

    if (context.canUseAdminOverride) {
      pageRoot.innerHTML = `
        <div class="center-msg" style="flex-direction:column; gap:16px;">
          <p>Aucun personnage actif.</p>
          <label style="display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--accent-2); cursor:pointer;">
            <input type="checkbox" id="override-checkbox" style="width:16px; height:16px; accent-color:var(--accent); cursor:pointer;">
            Utiliser les perms administrateur ?
          </label>
          <button class="btn" id="override-enter" style="width:auto;">Entrer</button>
        </div>
      `;
      document.getElementById('override-enter').addEventListener('click', () => {
        if (!document.getElementById('override-checkbox').checked) {
          pageRoot.innerHTML = '<div class="center-msg">Accès refusé — l\'annuaire est réservé aux personnages actifs.</div>';
          return;
        }
        adminOverrideActive = true;
        startHub();
      });
      return;
    }

    pageRoot.innerHTML = '<div class="center-msg">Accès refusé — l\'annuaire est réservé aux personnages actifs.</div>';
  }

  function startHub() {
    document.getElementById('topbar-tabs').style.display = 'flex';
    document.querySelectorAll('.topbar-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll('.topbar-tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === currentTab));
        renderTab();
      });
    });
    renderTab();
  }

  function renderTab() {
    if (currentTab === 'trombinoscope') loadTrombinoscope();
    else loadEtatSite();
  }

  // =======================================================================
  // Trombinoscope
  // =======================================================================
  let directoryCache = [];

  async function loadTrombinoscope() {
    const prefillQuery = new URL(window.location.href).searchParams.get('q') || '';
    pageRoot.innerHTML = `
      <div class="page-body">
        <div class="directory-controls">
          <input type="text" id="directory-search" placeholder="Rechercher un nom, pseudo, grade..." value="${escapeHtml(prefillQuery)}">
          <select id="directory-dept-filter"><option value="">Tous départements</option></select>
          <label class="inactive-toggle"><input type="checkbox" id="show-inactive-toggle"> Afficher les inactifs</label>
          <button class="btn small ghost" id="manage-badges-quick-btn" type="button" style="display:none;">🏅 Gérer les distinctions</button>
        </div>
        <div class="directory-grid" id="directory-grid"><div class="empty-row">Chargement…</div></div>
      </div>
    `;

    try {
      const data = await apiFetch('/api/rp/directory');
      directoryCache = data.personnel || [];
    } catch (err) {
      document.getElementById('directory-grid').innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const deptSelect = document.getElementById('directory-dept-filter');
    const depts = [...new Set(directoryCache.map((p) => p.deptName))].sort();
    deptSelect.innerHTML = '<option value="">Tous départements</option>' + depts.map((d) => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');

    document.getElementById('directory-search').addEventListener('input', renderDirectory);
    deptSelect.addEventListener('change', renderDirectory);
    document.getElementById('show-inactive-toggle').addEventListener('change', renderDirectory);

    // Bouton rapide "Gérer les distinctions" — visible si la personne peut
    // gérer AU MOINS un département (canManage renvoyé par le serveur).
    const manageableDepts = [...new Map(directoryCache.filter((p) => p.canManage).map((p) => [p.deptId, p.deptName])).entries()];
    if (manageableDepts.length) {
      const quickBtn = document.getElementById('manage-badges-quick-btn');
      quickBtn.style.display = 'inline-block';
      quickBtn.addEventListener('click', () => openBadgeManagerModal(manageableDepts));
    }

    renderDirectory();
  }

  function renderDirectory() {
    const grid = document.getElementById('directory-grid');
    const q = document.getElementById('directory-search').value.trim().toLowerCase();
    const deptFilter = document.getElementById('directory-dept-filter').value;
    const showInactive = document.getElementById('show-inactive-toggle').checked;

    const filtered = directoryCache.filter((p) => {
      const matchesQuery = !q || p.name.toLowerCase().includes(q) || p.username.toLowerCase().includes(q) || (p.rank || '').toLowerCase().includes(q);
      const matchesDept = !deptFilter || p.deptName === deptFilter;
      const matchesStatus = showInactive || p.status === 'actif';
      return matchesQuery && matchesDept && matchesStatus;
    });

    grid.innerHTML = filtered.length
      ? filtered
          .map(
            (p, i) => `
        <div class="person-card${p.status !== 'actif' ? ' inactive-card' : ''}" data-person-idx="${i}" style="cursor:pointer;">
          <div class="person-avatar">${escapeHtml((p.name || '?')[0])}</div>
          <div style="min-width:0;">
            <div class="person-name">${escapeHtml(p.name)}${p.status !== 'actif' ? ' <span class="inactive-tag">Inactif</span>' : ''}</div>
            <div class="person-rank">${escapeHtml(p.rank || 'Grade non précisé')}</div>
            <span class="person-dept">${escapeHtml(p.deptName)}</span>
          </div>
        </div>
      `
          )
          .join('')
      : '<div class="empty-row">Aucun résultat.</div>';

    grid.querySelectorAll('[data-person-idx]').forEach((el) => {
      el.addEventListener('click', () => openPersonModal(filtered[Number(el.dataset.personIdx)]));
    });
  }

  // =======================================================================
  // État du site — statut public + alertes RP si accessibles (Médical)
  // =======================================================================
  // =======================================================================
  // Fiche personnelle — carrière + distinctions, avec gestion si la
  // personne qui consulte est Directeur du département de la fiche.
  // =======================================================================
  const BADGE_COLOR_CHOICES = ['#A78BFA', '#4FD895', '#F0A83C', '#F0525A', '#4FA8F0', '#ECEDF1'];

  async function openPersonModal(person) {
    const backdrop = document.createElement('div');
    backdrop.className = 'person-modal-backdrop';
    backdrop.innerHTML = `
      <div class="person-modal">
        <div class="person-modal-head">
          <div class="person-avatar" style="width:52px; height:52px; font-size:18px;">${escapeHtml((person.name || '?')[0])}</div>
          <div>
            <div style="font-family:'Space Grotesk', sans-serif; font-size:17px; font-weight:700;">${escapeHtml(person.name)} ${person.status !== 'actif' ? '<span class="inactive-tag">Inactif</span>' : ''}</div>
            <div style="font-size:12px; color:var(--ink-faint);">${escapeHtml(person.rank || 'Grade non précisé')} — ${escapeHtml(person.deptName)}</div>
          </div>
        </div>

        <div class="person-modal-section">
          <div class="person-modal-title">🏅 Distinctions</div>
          <div id="person-badges-list"><div class="empty-row">Chargement…</div></div>
        </div>

        <div class="person-modal-section">
          <div class="person-modal-title">📈 Carrière</div>
          <div id="person-career-list"><div class="empty-row">Chargement…</div></div>
        </div>

        <div id="person-director-tools"></div>
        <div id="person-hrp-tools"></div>

        <div class="person-modal-actions">
          <button type="button" class="btn ghost" id="person-modal-close">Fermer</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    document.getElementById('person-modal-close').addEventListener('click', () => backdrop.remove());
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

    await Promise.all([loadPersonBadges(person), loadPersonCareer(person)]);

    // Outils RP et HRP — visibles seulement si le serveur confirme le
    // droit de gestion sur CE département précis (Directeur ou accès
    // administrateur complet, revérifié à chaque action de toute façon).
    if (person.canManage) {
      renderDirectorTools(person);
      renderHrpTools(person, backdrop);
    }
  }

  function renderHrpTools(person, backdrop) {
    const box = document.getElementById('person-hrp-tools');
    box.innerHTML = `
      <div class="person-modal-section" style="border-top:1px dashed var(--line); padding-top:14px;">
        <div class="person-modal-title">🗂️ Outils HRP</div>

        <div class="field-row">
          <label>Statut</label>
          <div style="display:flex; gap:8px;">
            <select id="hrp-status-select">
              <option value="actif"${person.status === 'actif' ? ' selected' : ''}>Actif</option>
              <option value="inactif"${person.status !== 'actif' ? ' selected' : ''}>Inactif</option>
            </select>
            <button class="btn small ghost" id="hrp-status-save" style="flex-shrink:0;">Appliquer</button>
          </div>
        </div>

        <div class="field-row">
          <label>Grade</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="hrp-rank-input" value="${escapeHtml(person.rank || '')}">
            <button class="btn small ghost" id="hrp-rank-save" style="flex-shrink:0;">Enregistrer</button>
          </div>
        </div>

        <div class="field-row">
          <label>Division</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="hrp-division-input" value="${escapeHtml(person.division || '')}">
            <button class="btn small ghost" id="hrp-division-save" style="flex-shrink:0;">Enregistrer</button>
          </div>
        </div>

        <div class="field-row">
          <label>Infos HRP</label>
          <div class="hrp-info-row"><span>Pseudo Roblox</span><span>${escapeHtml(person.username)}</span></div>
          <div class="hrp-info-row"><span>Enregistré le</span><span>${escapeHtml(person.registeredDate || 'N/A')}</span></div>
          <div class="hrp-info-row"><span>Discord lié</span><span id="hrp-discord-link">Chargement…</span></div>
        </div>

        <button class="btn danger small" id="hrp-remove-btn" style="width:100%; margin-top:10px;">🗑️ Retirer du roster</button>
      </div>
    `;

    document.getElementById('hrp-status-save').addEventListener('click', async () => {
      const status = document.getElementById('hrp-status-select').value;
      try {
        await apiFetch(`/api/rp/depts/${encodeURIComponent(person.deptId)}/agents/${encodeURIComponent(person.agentId)}/status`, {
          method: 'PATCH', body: JSON.stringify({ status }),
        });
        person.status = status;
        alert('Statut mis à jour.');
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });

    document.getElementById('hrp-rank-save').addEventListener('click', async () => {
      const rank = document.getElementById('hrp-rank-input').value.trim();
      if (!rank) { alert('Le grade ne peut pas être vide.'); return; }
      try {
        await apiFetch(`/api/rp/depts/${encodeURIComponent(person.deptId)}/agents/${encodeURIComponent(person.agentId)}/rank`, {
          method: 'PATCH', body: JSON.stringify({ rank }),
        });
        alert('Grade mis à jour.');
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });

    document.getElementById('hrp-division-save').addEventListener('click', async () => {
      const division = document.getElementById('hrp-division-input').value.trim();
      try {
        await apiFetch(`/api/rp/depts/${encodeURIComponent(person.deptId)}/agents/${encodeURIComponent(person.agentId)}/division`, {
          method: 'PATCH', body: JSON.stringify({ division }),
        });
        alert('Division mise à jour.');
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });

    document.getElementById('hrp-remove-btn').addEventListener('click', async () => {
      if (!confirm(`Retirer définitivement ${person.name} du roster ${person.deptName} ?`)) return;
      try {
        await apiFetch(`/api/rp/depts/${encodeURIComponent(person.deptId)}/agents/${encodeURIComponent(person.agentId)}`, { method: 'DELETE' });
        backdrop.remove();
        loadTrombinoscope();
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });

    apiFetch(`/api/rp/directory/discord-link/${encodeURIComponent(person.deptId)}/${encodeURIComponent(person.username)}`)
      .then((data) => {
        document.getElementById('hrp-discord-link').textContent = data.discordId ? data.discordId : 'Non lié';
      })
      .catch(() => {
        document.getElementById('hrp-discord-link').textContent = 'Erreur';
      });
  }

  async function loadPersonBadges(person) {
    const box = document.getElementById('person-badges-list');
    try {
      const data = await apiFetch(`/api/rp/badges/assigned/${encodeURIComponent(person.username)}`);
      const badges = data.badges || [];
      box.innerHTML = badges.length
        ? `<div class="badge-chips">${badges.map((b) => `<span class="badge-chip" style="border-color:${escapeHtml(b.badgeColor)}; color:${escapeHtml(b.badgeColor)};">${b.badgeIcon} ${escapeHtml(b.badgeName)}</span>`).join('')}</div>`
        : '<div class="empty-row">Aucune distinction.</div>';
    } catch (err) {
      box.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }
  }

  async function loadPersonCareer(person) {
    const box = document.getElementById('person-career-list');
    try {
      const data = await apiFetch(`/api/rp/career/${encodeURIComponent(person.username)}`);
      const entries = data.entries || [];
      box.innerHTML = entries.length
        ? entries
            .map(
              (e) => `
          <div class="career-entry">
            <div class="career-entry-title">${escapeHtml(e.title)}</div>
            ${e.description ? `<div class="career-entry-desc">${escapeHtml(e.description)}</div>` : ''}
            <div class="career-entry-meta">${new Date(e.createdAt).toLocaleDateString('fr-FR')} — ${escapeHtml(e.addedBy)}</div>
          </div>
        `
            )
            .join('')
        : '<div class="empty-row">Aucun événement de carrière consigné.</div>';
    } catch (err) {
      box.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderDirectorTools(person) {
    const box = document.getElementById('person-director-tools');
    box.innerHTML = `
      <div class="person-modal-section" style="border-top:1px dashed var(--line); padding-top:14px;">
        <div class="person-modal-title">🛠️ Outils Directeur</div>

        <form id="add-career-form" style="margin-bottom:16px;">
          <div class="field-row"><label>Nouvel événement de carrière</label><input type="text" id="career-title" placeholder="Titre (ex: Promu Sergent)" required></div>
          <div class="field-row"><input type="text" id="career-desc" placeholder="Description (optionnel)"></div>
          <button class="btn small" type="submit">Ajouter à la carrière</button>
        </form>

        <div id="assign-badge-area"><div class="empty-row">Chargement du catalogue...</div></div>

        <details style="margin-top:12px;">
          <summary style="cursor:pointer; font-size:11.5px; color:var(--ink-faint);">+ Créer une nouvelle distinction pour ce département</summary>
          <form id="new-badge-form" style="margin-top:10px;">
            <div class="field-row"><input type="text" id="new-badge-name" placeholder="Nom (ex: Vétéran EIT)" required></div>
            <div class="field-row"><input type="text" id="new-badge-icon" placeholder="Emoji (ex: 🎖️)" maxlength="4"></div>
            <div class="field-row"><input type="text" id="new-badge-desc" placeholder="Description (optionnel)"></div>
            <button class="btn small ghost" type="submit">Créer la distinction</button>
          </form>
        </details>
      </div>
    `;

    document.getElementById('add-career-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('career-title').value.trim();
      const description = document.getElementById('career-desc').value.trim();
      if (!title) return;
      try {
        await apiFetch(`/api/rp/career/${encodeURIComponent(person.username)}`, {
          method: 'POST',
          body: JSON.stringify({ title, description, deptId: person.deptId }),
        });
        document.getElementById('add-career-form').reset();
        loadPersonCareer(person);
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });

    loadBadgeAssignArea(person);

    document.getElementById('new-badge-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-badge-name').value.trim();
      const icon = document.getElementById('new-badge-icon').value.trim() || '🏅';
      const description = document.getElementById('new-badge-desc').value.trim();
      if (!name) return;
      const color = BADGE_COLOR_CHOICES[Math.floor(Math.random() * BADGE_COLOR_CHOICES.length)];
      try {
        await apiFetch('/api/rp/badges/catalog', {
          method: 'POST',
          body: JSON.stringify({ deptId: person.deptId, name, icon, description, color }),
        });
        document.getElementById('new-badge-form').reset();
        loadBadgeAssignArea(person);
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  // ---- Accès rapide "Gérer les distinctions" — sans passer par une fiche
  // personnelle. Permet juste de créer/retirer des types de distinctions
  // pour un département ; l'attribution à une personne reste dans sa fiche.
  function openBadgeManagerModal(manageableDepts) {
    const backdrop = document.createElement('div');
    backdrop.className = 'person-modal-backdrop';
    backdrop.innerHTML = `
      <div class="person-modal">
        <div class="person-modal-title" style="font-size:15px; margin-bottom:16px;">🏅 Gérer les distinctions</div>
        <div class="field-row">
          <label>Département</label>
          <select id="badge-mgr-dept">
            ${manageableDepts.map(([id, name]) => `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`).join('')}
          </select>
        </div>
        <div id="badge-mgr-list"><div class="empty-row">Chargement…</div></div>
        <form id="badge-mgr-form" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
          <div class="field-row"><input type="text" id="badge-mgr-name" placeholder="Nom (ex: Vétéran EIT)" required></div>
          <div class="field-row"><input type="text" id="badge-mgr-icon" placeholder="Emoji (ex: 🎖️)" maxlength="4"></div>
          <div class="field-row"><input type="text" id="badge-mgr-desc" placeholder="Description (optionnel)"></div>
          <button class="btn small" type="submit">Créer la distinction</button>
        </form>
        <div class="person-modal-actions">
          <button type="button" class="btn ghost" id="badge-mgr-close">Fermer</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    document.getElementById('badge-mgr-close').addEventListener('click', () => backdrop.remove());
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

    const deptSelect = document.getElementById('badge-mgr-dept');

    async function refreshBadgeMgrList() {
      const list = document.getElementById('badge-mgr-list');
      list.innerHTML = '<div class="empty-row">Chargement…</div>';
      try {
        const data = await apiFetch(`/api/rp/badges/catalog/${encodeURIComponent(deptSelect.value)}`);
        const catalog = data.badges || [];
        list.innerHTML = catalog.length
          ? catalog
              .map(
                (b) => `
            <div class="post-card" style="display:flex; justify-content:space-between; align-items:center;">
              <span>${b.icon} ${escapeHtml(b.name)}</span>
              <button class="btn danger small" data-delete-badge="${escapeHtml(b.id)}">Supprimer</button>
            </div>
          `
              )
              .join('')
          : '<div class="empty-row">Aucune distinction pour ce département.</div>';
        list.querySelectorAll('[data-delete-badge]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('Supprimer cette distinction ? Elle sera retirée de tous ceux qui la possèdent.')) return;
            try {
              await apiFetch(`/api/rp/badges/catalog/${encodeURIComponent(btn.dataset.deleteBadge)}`, { method: 'DELETE' });
              refreshBadgeMgrList();
            } catch (err) {
              alert(`Erreur : ${err.message}`);
            }
          });
        });
      } catch (err) {
        list.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      }
    }

    deptSelect.addEventListener('change', refreshBadgeMgrList);
    refreshBadgeMgrList();

    document.getElementById('badge-mgr-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('badge-mgr-name').value.trim();
      const icon = document.getElementById('badge-mgr-icon').value.trim() || '🏅';
      const description = document.getElementById('badge-mgr-desc').value.trim();
      if (!name) return;
      const color = BADGE_COLOR_CHOICES[Math.floor(Math.random() * BADGE_COLOR_CHOICES.length)];
      try {
        await apiFetch('/api/rp/badges/catalog', {
          method: 'POST',
          body: JSON.stringify({ deptId: deptSelect.value, name, icon, description, color }),
        });
        document.getElementById('badge-mgr-form').reset();
        refreshBadgeMgrList();
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  async function loadBadgeAssignArea(person) {
    const area = document.getElementById('assign-badge-area');
    try {
      const data = await apiFetch(`/api/rp/badges/catalog/${encodeURIComponent(person.deptId)}`);
      const catalog = data.badges || [];
      if (!catalog.length) {
        area.innerHTML = '<div class="empty-row">Aucune distinction créée pour ce département pour l\'instant.</div>';
        return;
      }
      area.innerHTML = `
        <div class="field-row">
          <label>Attribuer une distinction</label>
          <div style="display:flex; gap:8px;">
            <select id="assign-badge-select">
              ${catalog.map((b) => `<option value="${escapeHtml(b.id)}">${b.icon} ${escapeHtml(b.name)}</option>`).join('')}
            </select>
            <button class="btn small" id="assign-badge-btn" style="flex-shrink:0;">Attribuer</button>
          </div>
        </div>
      `;
      document.getElementById('assign-badge-btn').addEventListener('click', async () => {
        const badgeId = document.getElementById('assign-badge-select').value;
        try {
          await apiFetch('/api/rp/badges/assign', { method: 'POST', body: JSON.stringify({ username: person.username, badgeId }) });
          loadPersonBadges(person);
        } catch (err) {
          alert(`Erreur : ${err.message}`);
        }
      });
    } catch (err) {
      area.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }
  }

  async function loadEtatSite() {
    pageRoot.innerHTML = `
      <div class="page-body">
        <div class="status-grid" id="status-grid"><div class="empty-row">Chargement…</div></div>
        <div id="rp-alerts"></div>
      </div>
    `;

    try {
      const statusData = await fetch(`${API_BASE}/api/status`).then((r) => r.json());
      const grid = document.getElementById('status-grid');
      const components = statusData.components || [];
      const incidents = (statusData.incidents || []).filter((i) => i.status !== 'resolved');

      grid.innerHTML = `
        <div class="status-card">
          <h2>Composants</h2>
          ${
            components.length
              ? components
                  .map((c) => {
                    const dotClass = c.status === 'operational' ? 'dot-good' : c.status === 'major_outage' || c.status === 'offline' ? 'dot-bad' : 'dot-warn';
                    return `<div class="status-row"><span><span class="status-dot ${dotClass}"></span>${escapeHtml(c.name)}</span><span class="mono" style="color:var(--ink-faint); font-size:10.5px;">${escapeHtml(c.status)}</span></div>`;
                  })
                  .join('')
              : '<div class="empty-row">Aucune donnée.</div>'
          }
        </div>
        <div class="status-card">
          <h2>Incidents en cours</h2>
          ${
            incidents.length
              ? incidents.map((i) => `<div class="alert-item"><strong>${escapeHtml(i.title)}</strong></div>`).join('')
              : '<div class="empty-row">Aucun incident en cours.</div>'
          }
        </div>
      `;
    } catch (err) {
      document.getElementById('status-grid').innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }

    // Alertes RP (urgences/quarantaines DoctoSCP) — visibles seulement si
    // la personne a accès à Médical, silencieux sinon (pas une erreur).
    try {
      const [emergenciesData, quarantineData] = await Promise.all([
        apiFetch('/api/rp/doctoscp/emergencies'),
        apiFetch('/api/rp/doctoscp/quarantine'),
      ]);
      const openEmergencies = (emergenciesData.emergencies || []).filter((e) => e.status === 'open');
      const activeQuarantines = (quarantineData.quarantines || []).filter((q) => !q.endedAt);

      if (openEmergencies.length || activeQuarantines.length) {
        document.getElementById('rp-alerts').innerHTML = `
          <div class="status-grid" style="margin-top:0;">
            <div class="status-card">
              <h2>🚨 Urgences médicales ouvertes</h2>
              ${openEmergencies.length ? openEmergencies.map((e) => `<div class="alert-item">${escapeHtml(e.patientCharacterName)}</div>`).join('') : '<div class="empty-row">Aucune.</div>'}
            </div>
            <div class="status-card">
              <h2>🔒 Quarantaines actives</h2>
              ${activeQuarantines.length ? activeQuarantines.map((q) => `<div class="alert-item">${escapeHtml(q.characterName)}</div>`).join('') : '<div class="empty-row">Aucune.</div>'}
            </div>
          </div>
        `;
      }
    } catch (err) {
      // Pas d'accès Médical — silencieux, pas grave, ce sont des infos
      // secondaires réservées à ce département.
    }
  }

  checkAccessAndInit();
</script>

</body>
</html>
