  async function loadPpaExams() {
    const content = document.getElementById('med-division-content');
    content.innerHTML = '<div class="center-msg">Chargement…</div>';

    let data;
    try {
      data = await apiFetch('/api/rp/medical-ops/ppa');
    } catch (err) {
      content.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const { exams, canExamine, canValidate } = data;
    const pending = exams.filter((e) => e.status !== 'validated');
    const validated = exams.filter((e) => e.status === 'validated');

    function examCard(e) {
      return `
        <div class="post-card" data-exam-id="${escapeHtml(e.id)}">
          <div class="post-card-head">
            <span class="post-card-title">${escapeHtml(e.targetCharacterName)}</span>
            <span class="status-pill ${e.status === 'validated' ? 'status-open' : 'status-taken'}">${e.status === 'validated' ? 'Validé' : 'En attente'}</span>
          </div>
          <div class="post-card-meta" style="margin-bottom:6px;">Examinateur : ${escapeHtml(e.examinerCharacterName)} — ${e.createdAt ? new Date(e.createdAt).toLocaleDateString('fr-FR') : ''}</div>
          ${e.result ? `<div class="post-card-meta" style="margin-bottom:6px;">Résultat : ${escapeHtml(e.result)}</div>` : ''}
          <div class="post-card-body">${escapeHtml(e.content || '')}</div>
          ${
            e.status === 'validated'
              ? `<div class="post-card-meta" style="margin-top:8px;">Validé par ${escapeHtml(e.validatedBy || '—')}</div>`
              : canValidate
              ? `<div class="sci-card-actions"><button class="btn small med-ppa-validate-btn" data-exam-id="${escapeHtml(e.id)}">Valider</button></div>`
              : ''
          }
        </div>
      `;
    }

    content.innerHTML = `
      <div class="record-block">
        <div class="record-block-head"><h2>Examens PPA — en attente</h2><span class="count">${pending.length}</span></div>
        ${pending.length ? pending.map(examCard).join('') : '<div class="empty-row">Aucun examen en attente.</div>'}
      </div>
      ${
        validated.length
          ? `<div class="record-block">
              <div class="record-block-head"><h2>Validés</h2><span class="count">${validated.length}</span></div>
              ${validated.slice(0, 10).map(examCard).join('')}
            </div>`
          : ''
      }
      ${
        canExamine
          ? `<div class="subsection">
              <h3>Nouvel examen PPA</h3>
              <form id="med-ppa-form">
                <div class="field-row"><label>Personnage examiné *</label><input type="text" id="med-ppa-target" required></div>
                <div class="field-row"><label>Résultat</label><input type="text" id="med-ppa-result" placeholder="Ex: Apte / Inapte / Sous surveillance"></div>
                <div class="field-row"><label>Notes d'examen</label><textarea id="med-ppa-content" rows="6"></textarea></div>
                <button class="btn" type="submit">Soumettre l'examen</button>
              </form>
            </div>`
          : ''
      }
    `;

    content.querySelectorAll('.med-ppa-validate-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/rp/medical-ops/ppa/${encodeURIComponent(btn.dataset.examId)}/validate`, { method: 'PATCH' });
          showToast('Examen validé.', 'success');
          loadPpaExams();
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
    });

    document.getElementById('med-ppa-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const targetCharacterName = document.getElementById('med-ppa-target').value.trim();
      const result = document.getElementById('med-ppa-result').value.trim();
      const contentVal = document.getElementById('med-ppa-content').value.trim();
      if (!targetCharacterName) { showToast('Le nom du personnage examiné est obligatoire.', 'error'); return; }
      try {
        await apiFetch('/api/rp/medical-ops/ppa', { method: 'POST', body: JSON.stringify({ targetCharacterName, result, content: contentVal }) });
        showToast('Examen soumis.', 'success');
        loadPpaExams();
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    });
  }

  function renderAdmDocToc(canManage) {
    const list = document.getElementById('adm-doc-toc-list');
    if (!admDocsCache.length) { list.innerHTML = '<div class="empty-row">Aucun document.</div>'; return; }
    list.innerHTML = admDocsCache
      .map((d) => `
      <button class="wiki-toc-item${d.id === admDocsSelectedId ? ' active' : ''}" data-doc-id="${escapeHtml(d.id)}" type="button">
        <span class="wiki-toc-title">${escapeHtml(d.title)}</span>
        <span class="wiki-toc-meta">${escapeHtml(d.authorCharacterName)}</span>
      </button>
    `)
      .join('');
    list.querySelectorAll('.wiki-toc-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        admDocsSelectedId = btn.dataset.docId;
        renderAdmDocToc(canManage);
        renderAdmDocArticle(canManage);
      });
    });
  }

  function renderAdmDocArticle(canManage) {
    const article = document.getElementById('adm-doc-article');
    if (admDocsSelectedId === 'new' || (typeof admDocsSelectedId === 'string' && admDocsSelectedId.startsWith('edit:'))) {
      const isEdit = admDocsSelectedId.startsWith('edit:');
      const editingDoc = isEdit ? admDocsCache.find((d) => d.id === admDocsSelectedId.slice(5)) : null;
      article.innerHTML = `
        <h3 style="font-family:'Space Grotesk', sans-serif; font-size:16px; margin-bottom:16px;">${isEdit ? 'Modifier' : 'Nouveau document'}</h3>
        <form id="adm-doc-form">
          <div class="field-row"><label>Titre *</label><input type="text" id="adm-doc-title" required value="${isEdit ? escapeHtml(editingDoc.title) : ''}"></div>
          <div class="field-row"><label>Contenu (Markdown) *</label><textarea id="adm-doc-content" rows="12" required>${isEdit ? escapeHtml(editingDoc.content) : ''}</textarea></div>
          <div style="display:flex; gap:10px;">
            <button class="btn" type="submit">${isEdit ? 'Enregistrer' : 'Publier'}</button>
            ${isEdit ? '<button class="btn ghost" type="button" id="adm-doc-cancel-btn">Annuler</button>' : ''}
          </div>
        </form>
      `;
      document.getElementById('adm-doc-cancel-btn')?.addEventListener('click', () => {
        admDocsSelectedId = isEdit ? editingDoc.id : null;
        renderAdmDocArticle(canManage);
      });
      document.getElementById('adm-doc-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('adm-doc-title').value.trim();
        const content = document.getElementById('adm-doc-content').value.trim();
        if (!title || !content) { showToast('Titre et contenu sont obligatoires.', 'error'); return; }
        try {
          if (isEdit) {
            await apiFetch(`/api/rp/admin-ops/documents/${encodeURIComponent(editingDoc.id)}`, { method: 'PATCH', body: JSON.stringify({ title, content }) });
            showToast('Document modifié.', 'success');
            admDocsSelectedId = editingDoc.id;
          } else {
            await apiFetch('/api/rp/admin-ops/documents', { method: 'POST', body: JSON.stringify({ title, content }) });
            showToast('Document publié.', 'success');
            admDocsSelectedId = null;
          }
          loadAdminDocuments();
        } catch (err) {
          showToast(`Erreur : ${err.message}`, 'error');
        }
      });
      return;
    }

    const doc = admDocsCache.find((d) => d.id === admDocsSelectedId);
    if (!doc) {
      article.innerHTML = `<div class="wiki-empty"><div class="wiki-empty-title">Docs DA</div><p>Sélectionne un document${canManage ? ', ou clique sur "+ Nouveau document".' : '.'}</p></div>`;
      return;
    }
    article.innerHTML = `
      <h2 class="wiki-article-title">${escapeHtml(doc.title)}</h2>
      <div class="post-card-meta" style="margin-bottom:20px;">${escapeHtml(doc.authorCharacterName)} — ${doc.createdAt ? new Date(doc.createdAt).toLocaleDateString('fr-FR') : ''}</div>
      <div class="sci-body-rendered">${renderMarkdown(doc.content)}</div>
      ${canManage ? `<div class="sci-card-actions" style="margin-top:24px;"><button class="btn ghost small" id="adm-doc-edit-btn">Modifier</button><button class="btn danger small" id="adm-doc-delete-btn">Supprimer</button></div>` : ''}
    `;
    document.getElementById('adm-doc-edit-btn')?.addEventListener('click', () => {
      admDocsSelectedId = `edit:${doc.id}`;
      renderAdmDocArticle(canManage);
    });
    document.getElementById('adm-doc-delete-btn')?.addEventListener('click', async () => {
      if (!confirm('Supprimer ce document ?')) return;
      try {
        await apiFetch(`/api/rp/admin-ops/documents/${encodeURIComponent(doc.id)}`, { method: 'DELETE' });
        showToast('Document supprimé.', 'success');
        admDocsSelectedId = null;
        loadAdminDocuments();
      } catch (err) {
        showToast(`Erreur : ${err.message}`, 'error');
      }
    });
  }

  // -----------------------------------------------------------------
  // Archives — fiches SCP rédigées par le département Scientifique,
  // rendues en Markdown (titres, gras, listes, images...). Tronc commun en
  // lecture pour tout le monde ayant un accès RP ; écriture réservée aux
  // membres actifs Scientifique.
  // -----------------------------------------------------------------
  const SCIENCE_CLASSIFICATIONS = {
    safe: { label: 'SÛR', cls: 'sci-safe' },
    euclid: { label: 'EUCLIDE', cls: 'sci-euclid' },
    keter: { label: 'KETER', cls: 'sci-keter' },
  };
  const SCIENCE_DOC_TYPES = {
    objet: 'Fiche d\'objet',
    directive: 'Directive',
    lore: 'Lore',
    rapport: 'Rapport',
  };

  let scienceAllPublications = [];
  let scienceSelectedId = null; // id de la fiche affichée, 'new' pour le formulaire, ou null (accueil)

  function renderMarkdown(md) {
    let html;
    if (window.marked && window.DOMPurify) {
      html = DOMPurify.sanitize(marked.parse(md || ''));
    } else {
      // Filet de sécurité si les libs CDN n'ont pas chargé : texte brut échappé.
      html = `<p>${escapeHtml(md || '').replace(/\n/g, '<br>')}</p>`;
    }
    return applyRedacted(html);
  }

  // Texte encadré par {{comme ceci}} dans le Markdown source s'affiche en
  // bandeau "classifié" noir (police mono, façon document caviardé SCP) —
  // cliquable pour révéler. S'applique partout où renderMarkdown est
  // utilisé (Archives comme Docs DSE).
  function applyRedacted(html) {
    return (html || '').replace(/\{\{(.+?)\}\}/g, (match, hidden) => {
      return `<span class="redacted-text" tabindex="0" role="button" title="Cliquer pour révéler">${hidden}</span>`;
    });
  }

  // Délégation d'événement globale : les blocs redacted sont insérés
  // dynamiquement, donc on écoute au niveau document plutôt que d'attacher
  // un listener à chaque rendu.
  document.addEventListener('click', (e) => {
    const target = e.target.closest('.redacted-text');
    if (target) target.classList.toggle('revealed');
  });

  // Colore automatiquement les mentions "CODE VERT/JAUNE/ORANGE/ROUGE/
  // MAUVE/BLANC/NOIR" dans le HTML déjà rendu — spécifique aux Docs DSE
  // (protocoles de codes d'alerte), pas appliqué aux Archives Scientifique.
  const DSE_CODE_STYLES = {
    vert: { color: '#4FD895' },
    jaune: { color: '#F0D93C' },
    orange: { color: '#F0A83C' },
    rouge: { color: '#F0525A' },
    mauve: { color: '#A78BFA' },
    blanc: { color: '#ECEDF1' },
    // "Noir" en texte noir serait invisible sur le fond sombre du site —
    // badge inversé (fond clair, texte noir) pour rester lisible.
    noir: { color: '#08090C', background: '#ECEDF1' },
  };

  function highlightDseCodes(html) {
    return (html || '').replace(/\bCODE\s+(VERT|JAUNE|ORANGE|ROUGE|MAUVE|BLANC|NOIR)\b/gi, (match, colorWord) => {
      const style = DSE_CODE_STYLES[colorWord.toLowerCase()];
      if (!style) return match;
      const bg = style.background ? `background:${style.background}; padding:2px 7px; border-radius:2px;` : '';
      return `<span class="dse-code-badge" style="color:${style.color}; ${bg}">${match}</span>`;
    });
  }

  async function loadScienceModule() {
    const main = document.getElementById('terminal-main');

    main.innerHTML = `

            <select id="sci-doctype-filter">
              <option value="">Tous les types</option>
              <option value="objet">Fiche d'objet</option>

          <div class="wiki-toc-list" id="wiki-toc-list"></div>
        </div>
        <div class="wiki-article" id="wiki-article"></div>

    document.getElementById('sci-search').addEventListener('input', applyScienceFilters);

      scienceSelectedId = 'new';
      renderWikiToc(scienceAllPublications);
      renderWikiArticle();
    });

    renderWikiToc(publications);
    renderWikiArticle();
  }

  function applyScienceFilters() {
    const query = document.getElementById('sci-search').value.trim().toLowerCase();
    const docType = document.getElementById('sci-doctype-filter').value;
    const classification = document.getElementById('sci-classification-filter').value;

    const filtered = scienceAllPublications.filter((p) => {
      if (docType && (p.docType || 'objet') !== docType) return false;
      if (classification && p.classification !== classification) return false;
      if (!query) return true;
      const haystack = `${p.title} ${p.subject || ''} ${p.authorCharacterName || ''}`.toLowerCase();
      return haystack.includes(query);
    });

    renderWikiToc(filtered);
  }

  // Sommaire (colonne de gauche) : liste cliquable de toutes les fiches.
  function renderWikiToc(publications) {
    const list = document.getElementById('wiki-toc-list');

    if (!publications.length) {
      list.innerHTML = '<div class="empty-row">Aucune fiche ne correspond.</div>';

    list.innerHTML = publications
      .map((p) => {
        const cls = SCIENCE_CLASSIFICATIONS[p.classification];
        const typeLabel = SCIENCE_DOC_TYPES[p.docType || 'objet'];
        return `
        <button class="wiki-toc-item${p.id === scienceSelectedId ? ' active' : ''}" data-publication-id="${escapeHtml(p.id)}" type="button">
          <span class="wiki-toc-title">${escapeHtml(p.subject ? `${p.subject} — ${p.title}` : p.title)}</span>
          <span class="wiki-toc-meta">${escapeHtml(typeLabel)}${cls ? ` · ${cls.label}` : ''} · ${escapeHtml(p.authorCharacterName)}</span>

      })
      .join('');

    list.querySelectorAll('.wiki-toc-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        scienceSelectedId = btn.dataset.publicationId;
        list.querySelectorAll('.wiki-toc-item').forEach((b) => b.classList.remove('active'));

        renderWikiArticle();
      });
    });
  }

  // Article (colonne de droite) : fiche sélectionnée, formulaire de
  // création, ou état d'accueil si rien n'est encore choisi.
  function renderWikiArticle() {
    const article = document.getElementById('wiki-article');

      article.innerHTML = `

            <div class="field-row"><label>Référence</label><input type="text" id="publication-subject" placeholder="Ex: SCP-1547"></div>

            <textarea id="publication-content" rows="12" required placeholder="## Procédures de Confinement Spéciales&#10;...&#10;&#10;## Description&#10;...&#10;&#10;![légende](https://exemple.com/image.png)"></textarea>
          </div>

      const doctypeSelect = document.getElementById('publication-doctype');
      const classificationRow = document.getElementById('publication-classification-row');
      // La classification d'objet (Sûr/Euclide/Keter) ne concerne que les
      // fiches d'objet — masquée pour les autres types de fichiers.
      function toggleClassificationRow() {

  // -----------------------------------------------------------------
  // Séquence de boot — animation plein écran "connexion au serveur de la
  // Fondation" affichée pendant le chargement initial de l'intranet.
  // Tourne en parallèle du vrai appel réseau (/api/rp/context) : la durée
  // totale affichée est le max des deux, pour que l'animation ne soit
  // jamais coupée en plein milieu même si la réponse serveur est rapide.
  // Rendue directement dans <body> (pas dans mainRoot) pour recouvrir
  // vraiment tout l'écran, header compris.
  // -----------------------------------------------------------------
  const BOOT_LINES = [
    { text: 'Connexion sécurisée au réseau IRC-15...' },
    { text: "Vérification du protocole d'authentification...", status: 'OK' },
    { text: 'Récupération de votre identité Discord...', status: 'OK' },
    { text: 'Synchronisation du registre du personnel...', status: 'OK' },
    { text: 'Chargement des accès départementaux...', status: 'OK' },
    { text: '2 anomalies en observation active.', status: 'WARN', warn: true },
    { text: 'Connexion établie — bienvenue sur IRC-15.', status: 'OK' },
  ];

  function renderBootSequence() {
    const overlay = document.createElement('div');
    overlay.className = 'boot-overlay';
    overlay.id = 'boot-overlay';
    overlay.innerHTML = `
      <img class="boot-watermark" src="/ressources/voidline-logo-white.png" alt="" aria-hidden="true">
      <div class="boot-scanbar"></div>
      <div class="boot-content">
        <div class="boot-header">
          <div class="boot-badge">S15</div>
          <div class="boot-header-text">
            <div class="boot-network">IRC-15 — RÉSEAU FONDATION</div>
            <div class="boot-title">INITIALISATION DU TERMINAL</div>
          </div>
        </div>
        <div class="boot-log" id="boot-log"></div>
      </div>
    `;
    document.body.appendChild(overlay);
  }

  function removeBootSequence() {
    document.getElementById('boot-overlay')?.remove();
  }

  function runBootAnimation() {
    return new Promise((resolve) => {
      const logEl = document.getElementById('boot-log');
      let i = 0;

      function refreshOpacities() {
        const lines = [...logEl.children];
        const total = lines.length;
        lines.forEach((el, idx) => {
          const distanceFromEnd = total - 1 - idx;
          const opacity = distanceFromEnd === 0 ? 1 : distanceFromEnd === 1 ? 0.55 : distanceFromEnd === 2 ? 0.28 : distanceFromEnd === 3 ? 0.12 : 0.04;
          el.style.opacity = opacity;
        });
      }

      function next() {
        if (!logEl) { resolve(); return; }
        if (i >= BOOT_LINES.length) {
          const cursor = document.createElement('span');
          cursor.className = 'boot-cursor';
          logEl.lastElementChild?.querySelector('.boot-line-text')?.appendChild(cursor);
          setTimeout(resolve, 550);
          return;
        }
        const line = BOOT_LINES[i];
        const div = document.createElement('div');
        div.className = 'boot-line';
        div.innerHTML = `
          <span class="boot-line-text">› ${escapeHtml(line.text)}</span>
          ${line.status ? `<span class="boot-line-status${line.warn ? ' warn' : ''}">${line.status}</span>` : ''}
        `;
        logEl.appendChild(div);
        refreshOpacities();
        i += 1;
        setTimeout(next, 620 + Math.random() * 480);
      }

      setTimeout(next, 650);
    });
  }

  async function init() {
    const token = getToken();
    if (!token) { renderLoggedOut(); return; }

    renderBootSequence();
    const bootPromise = runBootAnimation();
    const contextPromise = apiFetch('/api/rp/context')
      .then((data) => ({ ok: true, data }))
      .catch((err) => ({ ok: false, error: err.message }));

    const [, result] = await Promise.all([bootPromise, contextPromise]);
    removeBootSequence();

    if (!result.ok) {
      renderError(`Impossible de charger l'intranet RP : ${result.error}`);
      return;
    }
    context = result.data;

    if (context.banned) {
      renderBanScreen(context.banReason);
      return;
    }

    if (!context.hasAnyAccess) {
      renderNoAccess(context);
      return;
    }

    renderTopChoice();
  }

  init();
</script>
<script src="/assets/auth-menu.js" defer></script>
</body>
</html>
