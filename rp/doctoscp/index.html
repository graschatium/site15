<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoctoSCP — Médical — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://voidline-studio.com/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #0A0B0E;
    --void-2: #101218;
    --panel: #14161D;
    --panel-raised: #191c25;
    --sidebar: #0D0F14;
    --line: #24262F;
    --line-soft: rgba(255,255,255,0.06);
    --accent: #2FAE7A;
    --accent-2: #4FD895;
    --accent-soft: rgba(47,174,122,0.12);
    --line-bright: #2FAE7A;
    --line-bright-2: #4FD895;
    --ink: #F2F3F5;
    --ink-dim: #9297A8;
    --ink-faint: #5A5F6E;
    --good: #4FD895;
    --warn: #F0A83C;
    --bad: #F0525A;
    --blue: #4FA8F0;
    --purple: #A78BFA;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  *{ scrollbar-width:thin; scrollbar-color:#3a3d4a var(--void-2); }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:var(--void-2); }
  *::-webkit-scrollbar-thumb{ background:#3a3d4a; border-radius:4px; }
  *::-webkit-scrollbar-thumb:hover{ background:#4a4d5e; }

  html, body{ height:100%; }
  body{ background:var(--void); color:var(--ink); font-family:'Inter', sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .center-msg{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--ink-dim); font-size:14px; text-align:center; padding:20px; }

  /* ---------------------------------------------------------------- */
  /* Coquille app : sidebar fixe + zone de contenu avec en-tête         */
  /* ---------------------------------------------------------------- */
  .app-shell{ height:100vh; display:flex; }

  .app-sidebar{
    width:236px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 14px;
  }
  .app-brand{ display:flex; align-items:center; gap:10px; padding:0 8px 22px; margin-bottom:14px; border-bottom:1px solid var(--line-soft); }
  .app-brand-icon{
    width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, var(--accent), #1f7a56);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 14px rgba(47,174,122,0.35);
  }
  .app-brand-icon svg{ width:19px; height:19px; color:#fff; }
  .app-brand-text{ display:flex; flex-direction:column; }
  .app-brand-title{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:700; letter-spacing:-0.01em; }
  .app-brand-sub{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--ink-faint); letter-spacing:0.06em; }

  .app-back{
    display:flex; align-items:center; gap:8px; padding:9px 10px; margin-bottom:16px; border-radius:8px;
    font-size:12px; color:var(--ink-faint); border:1px solid var(--line); transition:all .15s ease;
  }
  .app-back:hover{ color:var(--ink); border-color:var(--line-bright); background:var(--panel); }
  .app-back svg{ width:13px; height:13px; }

  .app-nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .app-nav-label{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-faint); padding:10px 10px 6px;
  }
  .app-nav-btn{
    display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:8px; border:none; background:none;
    color:var(--ink-dim); font-size:13px; font-weight:500; cursor:pointer; text-align:left; width:100%;
    transition:all .12s ease; position:relative;
  }
  .app-nav-btn svg{ width:17px; height:17px; flex-shrink:0; opacity:0.85; }
  .app-nav-btn:hover{ background:var(--panel); color:var(--ink); }
  .app-nav-btn.active{ background:var(--accent-soft); color:var(--accent-2); font-weight:600; }
  .app-nav-btn.active svg{ opacity:1; }
  .app-nav-badge{
    margin-left:auto; background:var(--bad); color:#fff; font-family:'JetBrains Mono', monospace; font-size:9.5px;
    font-weight:700; padding:1px 6px; border-radius:20px; min-width:16px; text-align:center;
  }

  .app-sidebar-footer{
    display:flex; align-items:center; gap:10px; padding:10px; margin-top:10px; border-top:1px solid var(--line-soft);
  }
  .app-user-avatar{
    width:30px; height:30px; border-radius:50%; background:var(--panel-raised); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:12px; color:var(--accent-2); flex-shrink:0;
  }
  .app-user-name{ font-size:12px; font-weight:600; }
  .app-user-role{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--ink-faint); }

  .app-main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .app-header{
    height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; border-bottom:1px solid var(--line); background:var(--void);
  }
  .app-header-title{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700; }
  .app-header-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .app-header-status{
    display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint);
  }
  .app-header-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--good); box-shadow:0 0 6px var(--good); }

  .app-content{ flex:1; overflow-y:auto; padding:28px; }

  /* ---------------------------------------------------------------- */
  /* Cartes / composants                                               */
  /* ---------------------------------------------------------------- */
  .dsc-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; max-width:1240px; margin-bottom:20px; }
  .dsc-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px;
    box-shadow:0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.18);
  }
  .dsc-panel h2{ font-family:'Space Grotesk', sans-serif; font-size:14.5px; font-weight:600; margin-bottom:14px; }
  .dsc-two-col{ display:grid; grid-template-columns:1.4fr 1fr; gap:22px; max-width:1240px; align-items:start; }
  @media (max-width: 980px){ .dsc-two-col{ grid-template-columns:1fr; } }

  /* Cartes stats avec badge icône coloré */
  .dsc-kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; max-width:1240px; margin-bottom:22px; }
  .dsc-kpi-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px;
    display:flex; align-items:center; gap:14px; box-shadow:0 8px 24px rgba(0,0,0,0.18);
  }
  .dsc-kpi-icon{
    width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .dsc-kpi-icon svg{ width:21px; height:21px; }
  .dsc-kpi-value{ font-family:'Space Grotesk', sans-serif; font-size:24px; font-weight:700; line-height:1; }
  .dsc-kpi-label{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }

  .field-row{ margin-bottom:13px; }
  .field-row label{ display:block; font-size:11px; color:var(--ink-faint); margin-bottom:6px; font-family:'JetBrains Mono', monospace; letter-spacing:0.04em; text-transform:uppercase; }
  input, select, textarea{
    width:100%; background:var(--void-2); border:1px solid var(--line); border-radius:7px; padding:10px 12px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:13px; transition:border-color .12s ease;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn{
    padding:10px 18px; border-radius:7px; border:1px solid transparent; background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:600; cursor:pointer; transition:filter .12s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.small{ padding:7px 13px; font-size:11.5px; }
  .btn.ghost{ background:var(--void-2); color:var(--ink-dim); border:1px solid var(--line); }
  .btn.danger{ background:var(--bad); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .post-card{
    background:var(--void-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px;
    transition:border-color .12s ease;
  }
  .post-card:hover{ border-color:#333644; }
  .post-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:10px; }
  .post-card-title{ font-weight:600; font-size:13.5px; }
  .post-card-meta{ font-size:11.5px; color:var(--ink-faint); }
  .post-card-body{ font-size:12.5px; color:var(--ink-dim); white-space:pre-wrap; line-height:1.5; }
  .empty-row{ color:var(--ink-faint); font-size:12.5px; padding:20px 0; text-align:center; }
  .record-block-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .record-block-head h2{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:700; }
  .count{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); background:var(--void-2); padding:2px 8px; border-radius:20px; border:1px solid var(--line); }

  .status-pill{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:10px; font-family:'JetBrains Mono', monospace;
    text-transform:uppercase; letter-spacing:0.05em; font-weight:600;
  }
  .status-good{ background:rgba(79,216,149,0.12); color:var(--good); }
  .status-warn{ background:rgba(240,168,60,0.12); color:var(--warn); }
  .status-bad{ background:rgba(240,82,90,0.12); color:var(--bad); }
  .status-neutral{ background:rgba(146,151,168,0.12); color:var(--ink-dim); }

  .dsc-doctor-card{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .dsc-avatar{
    width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg, var(--accent), #1f7a56);
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:13px; color:#fff; flex-shrink:0;
  }

  .dsc-stat-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px; }
  .dsc-stat-row:last-child{ border-bottom:none; }
  .dsc-stat-label{ color:var(--ink-faint); }
  .dsc-stat-value{ color:var(--ink); font-weight:600; }

  .dsc-thread-item{
    display:flex; justify-content:space-between; align-items:center; padding:11px 12px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; transition:all .12s ease;
  }
  .dsc-thread-item:hover{ background:var(--void-2); }
  .dsc-thread-item.active{ background:var(--accent-soft); border-color:var(--accent); }
  .dsc-chat-bubble{ max-width:75%; padding:9px 13px; border-radius:12px; margin-bottom:9px; font-size:12.5px; line-height:1.45; }
  .dsc-chat-bubble.mine{ background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:3px; }
  .dsc-chat-bubble.theirs{ background:var(--void-2); border:1px solid var(--line); border-bottom-left-radius:3px; }
</style>
</head>
<body>

<div id="page-root">
  <div class="center-msg">Chargement…</div>
</div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';
  const MEDICAL_DEPT_ID = 'medical';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() { return localStorage.getItem(TOKEN_KEY); }

  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  let adminOverrideActive = false;

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(adminOverrideActive ? { 'X-Admin-Override-Dept': MEDICAL_DEPT_ID } : {}),
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }

  const pageRoot = document.getElementById('page-root');

  let myCharacterName = '';

  // ---------------------------------------------------------------------
  // Contrôle d'accès — même mécanisme que Bureau/Microscope : personnage
  // Médical réel, ou Mode Administrateur (canManagePermissions/rpFullAccess)
  // via case à cocher opt-in.
  // ---------------------------------------------------------------------
  async function checkAccessAndInit() {
    if (!getToken()) {
      pageRoot.innerHTML = '<div class="center-msg">Connecte-toi depuis le site avant d\'accéder à DoctoSCP.</div>';
      return;
    }

    let context;
    try {
      context = await apiFetch('/api/rp/context');
    } catch (err) {
      pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    if (context.banned) {
      pageRoot.innerHTML = '<div class="center-msg">Accès révoqué.</div>';
      return;
    }

    const medicalChar = (context.characters || []).find((c) => c.deptId === MEDICAL_DEPT_ID);
    if (medicalChar) {
      myCharacterName = medicalChar.name;
      loadDoctoscp();
      return;
    }

    if (context.canUseAdminOverride) {
      pageRoot.innerHTML = `
        <div class="center-msg" style="flex-direction:column; gap:16px;">
          <p>Aucun personnage actif dans Médical.</p>
          <label style="display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--accent-2); cursor:pointer;">
            <input type="checkbox" id="dsc-admin-override-checkbox" style="width:16px; height:16px; accent-color:var(--accent); cursor:pointer;">
            Utiliser les perms administrateur ?
          </label>
          <button class="btn" id="dsc-admin-override-enter" style="width:auto; padding:9px 20px;">Entrer</button>
        </div>
      `;
      document.getElementById('dsc-admin-override-enter').addEventListener('click', async () => {
        const checked = document.getElementById('dsc-admin-override-checkbox').checked;
        if (!checked) {
          pageRoot.innerHTML = '<div class="center-msg">Accès refusé — DoctoSCP est réservé au personnel actif du département Médical.</div>';
          return;
        }
        adminOverrideActive = true;
        pageRoot.innerHTML = '<div class="center-msg">Chargement…</div>';
        try {
          context = await apiFetch('/api/rp/context');
        } catch (err) {
          pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
          return;
        }
        const overrideChar = (context.characters || []).find((c) => c.deptId === MEDICAL_DEPT_ID);
        myCharacterName = overrideChar ? overrideChar.name : 'Mode Administrateur';
        loadDoctoscp();
      });
      return;
    }

    pageRoot.innerHTML = '<div class="center-msg">Accès refusé — DoctoSCP est réservé au personnel actif du département Médical.</div>';
  }

  // =======================================================================
  // Coquille à onglets
  // =======================================================================
  const NAV_ICONS = {
    accueil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
    rdv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    medecins: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V3"/><path d="M7 8v3a5 5 0 0 0 10 0V8"/><path d="M12 16v4"/><circle cx="12" cy="21" r="1"/></svg>',
    dossier: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>',
    messagerie: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-11.9 7.8L3 21l1.7-6.1A8.5 8.5 0 1 1 21 11.5z"/></svg>',
    urgences: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    quarantaine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6z"/></svg>',
    certificats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M9 12.5 7 21l5-3 5 3-2-8.5"/></svg>',
  };
  const TABS = [
    { id: 'accueil', label: 'Accueil' },
    { id: 'rdv', label: 'Rendez-vous' },
    { id: 'medecins', label: 'Médecins' },
    { id: 'dossier', label: 'Dossier médical' },
    { id: 'messagerie', label: 'Messagerie' },
    { id: 'urgences', label: 'Urgences' },
    { id: 'quarantaine', label: 'Quarantaine' },
    { id: 'certificats', label: 'Certificats' },
  ];
  const TAB_SUBTITLES = {
    accueil: "Vue d'ensemble de votre activité",
    rdv: 'Prise de rendez-vous et suivi',
    medecins: 'Annuaire des professionnels disponibles',
    dossier: 'Historique médical centralisé',
    messagerie: 'Téléconsultation et échanges',
    urgences: 'Signalement et prise en charge',
    quarantaine: 'Isolement et suivi des sujets',
    certificats: "Certificats d'aptitude au service",
  };
  let currentTab = 'accueil';

  function loadDoctoscp() {
    const initials = myCharacterName
      .split(/[\s.]+/)
      .filter(Boolean)
      .slice(0, 2)
      .map((w) => w[0])
      .join('')
      .toUpperCase() || '?';

    pageRoot.innerHTML = `
      <div class="app-shell">
        <div class="app-sidebar">
          <div class="app-brand">
            <div class="app-brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v8M8 12h8"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg></div>
            <div class="app-brand-text">
              <span class="app-brand-title">DoctoSCP</span>
              <span class="app-brand-sub">SITE-15 // MÉDICAL</span>
            </div>
          </div>
          <a href="/rp/" class="app-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
            Retour à l'intranet
          </a>
          <div class="app-nav-label">Navigation</div>
          <div class="app-nav" id="app-nav">
            ${TABS.map((t) => `
              <button class="app-nav-btn${t.id === currentTab ? ' active' : ''}" data-tab="${t.id}">
                ${NAV_ICONS[t.id]}
                <span>${t.label}</span>
                ${t.id === 'urgences' ? '<span class="app-nav-badge" id="urgence-badge" style="display:none;"></span>' : ''}
              </button>
            `).join('')}
          </div>
          <div class="app-sidebar-footer">
            <div class="app-user-avatar">${escapeHtml(initials)}</div>
            <div>
              <div class="app-user-name">${escapeHtml(myCharacterName)}</div>
              <div class="app-user-role">Personnel Médical</div>
            </div>
          </div>
        </div>

        <div class="app-main">
          <div class="app-header">
            <div>
              <div class="app-header-title" id="app-header-title">Accueil</div>
              <div class="app-header-sub" id="app-header-sub">${TAB_SUBTITLES.accueil}</div>
            </div>
            <div class="app-header-status"><span class="dot"></span> Système en ligne</div>
          </div>
          <div class="app-content" id="doctoscp-content"></div>
        </div>
      </div>
    `;
    document.querySelectorAll('.app-nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll('.app-nav-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === currentTab));
        document.getElementById('app-header-title').textContent = TABS.find((t) => t.id === currentTab).label;
        document.getElementById('app-header-sub').textContent = TAB_SUBTITLES[currentTab];
        renderTab(currentTab);
      });
    });
    renderTab(currentTab);
    refreshUrgenceBadge();
  }

  async function refreshUrgenceBadge() {
    try {
      const data = await apiFetch('/api/rp/doctoscp/emergencies');
      const openCount = (data.emergencies || []).filter((e) => e.status === 'open').length;
      const badge = document.getElementById('urgence-badge');
      if (!badge) return;
      if (openCount > 0) {
        badge.textContent = openCount;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    } catch (err) {
      // silencieux — le badge est un bonus, pas critique
    }
  }

  function renderTab(tabId) {
    if (tabId === 'accueil') loadAccueilTab();
    else if (tabId === 'rdv') loadRdvTab();
    else if (tabId === 'medecins') loadMedecinsTab();
    else if (tabId === 'dossier') loadDossierTab();
    else if (tabId === 'messagerie') loadMessagerieTab();
    else if (tabId === 'urgences') loadUrgencesTab();
    else if (tabId === 'quarantaine') loadQuarantaineTab();
    else if (tabId === 'certificats') loadCertificatsTab();
  }

  const SPECIALTIES = ['Médecine générale', 'Chirurgie', 'Psychologie', 'Biologie', 'Urgentiste'];

        <div class="dsc-kpi-card">
          <div class="dsc-kpi-icon" style="background:${activeQuarantines.length ? 'rgba(240,168,60,0.12)' : 'rgba(79,216,149,0.12)'}; color:${activeQuarantines.length ? 'var(--warn)' : 'var(--good)'};">${NAV_ICONS.quarantaine}</div>

  // =======================================================================
  // 📅 Rendez-vous
  // =======================================================================
  async function loadRdvTab() {
    const content = document.getElementById('doctoscp-content');
    content.innerHTML = '<div class="empty-row">Chargement…</div>';

    let appointmentsData, doctorsData;
    try {
      [appointmentsData, doctorsData] = await Promise.all([
        apiFetch('/api/rp/doctoscp/appointments'),
        apiFetch('/api/rp/doctoscp/doctors'),
      ]);
    } catch (err) {
      content.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const appointments = appointmentsData.appointments || [];
    const doctors = doctorsData.doctors || [];
    const STATUS_META = {
      confirmed: { label: 'Confirmé', cls: 'status-good' },
      cancelled: { label: 'Annulé', cls: 'status-bad' },
      completed: { label: 'Terminé', cls: 'status-neutral' },
    };

    content.innerHTML = `
      <div class="dsc-two-col">
        <div>
          <div class="record-block-head"><h2>Tous les rendez-vous</h2><span class="count">${appointments.length}</span></div>
          <input type="text" id="dsc-rdv-search" placeholder="Rechercher (patient, médecin)..." style="margin-bottom:12px;">
          <div id="dsc-rdv-list">
            ${
              appointments.length
                ? appointments
                    .map((a) => {
                      const meta = STATUS_META[a.status] || STATUS_META.confirmed;
                      return `
                <div class="post-card" data-search="${escapeHtml((a.patientCharacterName + ' ' + a.doctorName).toLowerCase())}">
                  <div class="post-card-head">
                    <span class="post-card-title">${escapeHtml(a.patientCharacterName)} → ${escapeHtml(a.doctorName)}</span>
                    <span class="status-pill ${meta.cls}">${meta.label}</span>
                  </div>
                  <div class="post-card-meta">${escapeHtml(a.date)} à ${escapeHtml(a.time)} — ${escapeHtml(a.specialty || 'Non précisé')}</div>
                  ${a.reason ? `<div class="post-card-body" style="margin-top:6px;">${escapeHtml(a.reason)}</div>` : ''}
                  ${
                    a.status === 'confirmed'
                      ? `<div id="dsc-rdv-edit-${escapeHtml(a.id)}"></div>
                        <div style="display:flex; gap:8px; margin-top:8px;">
                          <button class="btn ghost small" data-action="reschedule" data-appt-id="${escapeHtml(a.id)}" data-date="${escapeHtml(a.date)}" data-time="${escapeHtml(a.time)}">Reprogrammer</button>
                          <button class="btn small" data-appt-id="${escapeHtml(a.id)}" data-status="completed">Marquer terminé</button>
                          <button class="btn danger small" data-appt-id="${escapeHtml(a.id)}" data-status="cancelled">Annuler</button>
                        </div>`
                      : ''
                  }
                </div>

                    })
                    .join('')

        </div>

        <div class="dsc-panel">
          <h2>Nouveau rendez-vous</h2>
          <form id="dsc-rdv-form">
            <div class="field-row"><label>Patient *</label><input type="text" id="dsc-rdv-patient" required placeholder="Nom du personnage"></div>
            <div class="field-row">
              <label>Spécialité</label>
              <select id="dsc-rdv-specialty">
                <option value="">Peu importe</option>
                ${SPECIALTIES.map((s) => `<option value="${s}">${s}</option>`).join('')}
              </select>
            </div>
            <div class="field-row">
              <label>Médecin</label>
              <select id="dsc-rdv-doctor">
                <option value="">Affectation automatique</option>
                ${doctors.filter((d) => d.available).map((d) => `<option value="${escapeHtml(d.characterName)}">${escapeHtml(d.characterName)} — ${escapeHtml(d.specialty || '')}</option>`).join('')}
              </select>
            </div>
            <div class="field-grid">

              <div class="field-row"><label>Heure</label><input type="text" id="dsc-rdv-time" placeholder="14h30"></div>

            <div class="field-row"><label>Motif</label><textarea id="dsc-rdv-reason" rows="2"></textarea></div>
            <button class="btn" type="submit">Réserver</button>
          </form>
        </div>
      </div>
    `;

    content.querySelectorAll('[data-status]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/rp/doctoscp/appointments/${encodeURIComponent(btn.dataset.apptId)}/status`, {
            method: 'PATCH',
            body: JSON.stringify({ status: btn.dataset.status }),
          });
          loadRdvTab();
        } catch (err) {
          alert(`Erreur : ${err.message}`);
        }
      });
    });

    content.querySelectorAll('[data-action="reschedule"]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(`dsc-rdv-edit-${btn.dataset.apptId}`);
        target.innerHTML = `
          <div style="display:flex; gap:8px; margin-top:8px; align-items:flex-end;">
            <div class="field-row" style="margin:0; flex:1;"><label>Nouvelle date</label><input type="text" class="dsc-reschedule-date" value="${escapeHtml(btn.dataset.date)}"></div>
            <div class="field-row" style="margin:0; flex:1;"><label>Nouvelle heure</label><input type="text" class="dsc-reschedule-time" value="${escapeHtml(btn.dataset.time)}"></div>
            <button class="btn small" data-confirm-reschedule="${escapeHtml(btn.dataset.apptId)}" style="flex-shrink:0;">Valider</button>
          </div>
        `;
        target.querySelector('[data-confirm-reschedule]').addEventListener('click', async () => {
          const date = target.querySelector('.dsc-reschedule-date').value.trim();
          const time = target.querySelector('.dsc-reschedule-time').value.trim();
          try {
            await apiFetch(`/api/rp/doctoscp/appointments/${encodeURIComponent(btn.dataset.apptId)}/reschedule`, {
              method: 'PATCH',
              body: JSON.stringify({ date, time }),

            loadRdvTab();
          } catch (err) {
            alert(`Erreur : ${err.message}`);
          }
        });
      });

    const rdvSearch = document.getElementById('dsc-rdv-search');
    rdvSearch.addEventListener('input', () => {
      const q = rdvSearch.value.trim().toLowerCase();
      document.querySelectorAll('#dsc-rdv-list [data-search]').forEach((card) => {
        card.style.display = card.dataset.search.includes(q) ? '' : 'none';
      });
    });

    document.getElementById('dsc-rdv-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const patientCharacterName = document.getElementById('dsc-rdv-patient').value.trim();
      const specialty = document.getElementById('dsc-rdv-specialty').value;
      const doctorName = document.getElementById('dsc-rdv-doctor').value;
      const date = document.getElementById('dsc-rdv-date').value.trim();
      const time = document.getElementById('dsc-rdv-time').value.trim();
      const reason = document.getElementById('dsc-rdv-reason').value.trim();
      if (!patientCharacterName) { alert('Le nom du patient est obligatoire.'); return; }
      try {
        const result = await apiFetch('/api/rp/doctoscp/appointments', {
          method: 'POST',
          body: JSON.stringify({ patientCharacterName, doctorName, specialty, date, time, reason }),
        });
        alert(`Rendez-vous confirmé avec ${result.assignedDoctor}.`);
        loadRdvTab();
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  const RECORD_TYPE_META = {
    consultation: { label: 'Consultation', color: '#4FD895' },
    ordonnance: { label: 'Ordonnance', color: '#4FA8F0' },
    blessure: { label: 'Blessure RP', color: '#F0525A' },
    rapport: { label: "Rapport d'intervention", color: '#F0A83C' },
    examen: { label: 'Examen médical', color: '#A78BFA' },
  };
  let currentPatientName = null;

  async function loadDossierTab() {
    const content = document.getElementById('doctoscp-content');
    content.innerHTML = `
      <div class="dsc-two-col">
        <div>
          <div class="dsc-panel" style="margin-bottom:16px;">
            <h2>Rechercher un patient</h2>
            <div style="display:flex; gap:8px;">
              <input type="text" id="dsc-patient-search" placeholder="Nom du personnage...">

            </div>
          </div>
          <div id="dsc-record-view"><div class="empty-row">Recherche un patient pour voir son dossier.</div></div>
        </div>
        <div class="dsc-panel">
          <h2>Patients connus</h2>
          <div id="dsc-patients-list"><div class="empty-row">Chargement…</div></div>
        </div>
      </div>
    `;

    document.getElementById('dsc-patient-search-btn').addEventListener('click', () => {
      const name = document.getElementById('dsc-patient-search').value.trim();
      if (name) openPatientRecord(name);
    });
    document.getElementById('dsc-patient-search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('dsc-patient-search-btn').click();
    });

    try {
      const data = await apiFetch('/api/rp/doctoscp/patients');
      const list = document.getElementById('dsc-patients-list');
      const patients = data.patients || [];
      list.innerHTML = patients.length
        ? patients
            .map((p) => `<div class="post-card" style="cursor:pointer;" data-patient-name="${escapeHtml(p.patientCharacterName)}"><span class="post-card-title" style="font-size:12.5px;">${escapeHtml(p.patientCharacterName)}</span><div class="post-card-meta">${p.entryCount} entrée(s)</div></div>`)
            .join('')
        : '<div class="empty-row">Aucun patient enregistré.</div>';
      list.querySelectorAll('[data-patient-name]').forEach((el) => {
        el.addEventListener('click', () => openPatientRecord(el.dataset.patientName));
      });
    } catch (err) {
      document.getElementById('dsc-patients-list').innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }

    if (currentPatientName) openPatientRecord(currentPatientName);
  }

  async function openPatientRecord(patientName) {
    currentPatientName = patientName;
    const view = document.getElementById('dsc-record-view');
    view.innerHTML = '<div class="empty-row">Chargement…</div>';

    let data;
    try {
      data = await apiFetch(`/api/rp/doctoscp/records/${encodeURIComponent(patientName)}`);
    } catch (err) {
      view.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    const record = data.record;
    const entries = record.entries || [];
    const filterType = document.getElementById('dsc-record-filter')?.value || '';
    const visibleEntries = filterType ? entries.filter((e) => e.type === filterType) : entries;

    view.innerHTML = `
      <div class="record-block-head">
        <h2>Dossier — ${escapeHtml(record.patientCharacterName)}</h2>
        <span class="count">${visibleEntries.length}/${entries.length}</span>
      </div>
      <select id="dsc-record-filter" style="margin-bottom:12px;">
        <option value="">Toutes les entrées</option>
        ${Object.entries(RECORD_TYPE_META).map(([id, m]) => `<option value="${id}"${filterType === id ? ' selected' : ''}>${m.label} uniquement</option>`).join('')}
      </select>
      ${
        visibleEntries.length
          ? visibleEntries
              .map((e) => {
                const meta = RECORD_TYPE_META[e.type] || RECORD_TYPE_META.consultation;
                return `
          <div class="post-card">
            <div class="post-card-head">
              <span class="status-pill" style="background:${meta.color}22; color:${meta.color};">${meta.label}</span>
              <span class="post-card-meta">${escapeHtml(e.authorCharacterName)} — ${e.createdAt ? new Date(e.createdAt).toLocaleString('fr-FR') : ''}</span>
            </div>
            <div class="post-card-body">${escapeHtml(e.content)}</div>
            <button class="btn danger small" style="margin-top:8px;" data-entry-id="${escapeHtml(e.id)}">Supprimer</button>
          </div>
        `;
              })
              .join('')
          : '<div class="empty-row">Dossier vide.</div>'
      }
      <div class="dsc-panel" style="margin-top:14px;">
        <h2>Ajouter une entrée</h2>
        <form id="dsc-record-form">
          <div class="field-row">
            <label>Type</label>
            <select id="dsc-record-type">
              ${Object.entries(RECORD_TYPE_META).map(([id, m]) => `<option value="${id}">${m.label}</option>`).join('')}
            </select>
          </div>
          <div class="field-row"><label>Contenu *</label><textarea id="dsc-record-content" rows="3" required></textarea></div>
          <button class="btn small" type="submit">Ajouter au dossier</button>
        </form>
      </div>
    `;

    document.getElementById('dsc-record-filter').addEventListener('change', () => openPatientRecord(patientName));

    view.querySelectorAll('[data-entry-id]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Supprimer cette entrée du dossier ?')) return;
        try {
          await apiFetch(`/api/rp/doctoscp/records/${encodeURIComponent(patientName)}/${encodeURIComponent(btn.dataset.entryId)}`, { method: 'DELETE' });
          openPatientRecord(patientName);
        } catch (err) {
          alert(`Erreur : ${err.message}`);
        }
      });
    });

    document.getElementById('dsc-record-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('dsc-record-type').value;
      const contentVal = document.getElementById('dsc-record-content').value.trim();
      if (!contentVal) { alert('Le contenu est obligatoire.'); return; }
      try {
        await apiFetch(`/api/rp/doctoscp/records/${encodeURIComponent(patientName)}`, { method: 'POST', body: JSON.stringify({ type, content: contentVal }) });
        openPatientRecord(patientName);
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  async function loadMessagerieTab() {

          <h2>Conversations</h2>
          <div id="dsc-threads-list"><div class="empty-row">Chargement…</div></div>
          <div class="field-row" style="margin-top:14px;">
            <label>Nouveau message à...</label>
            <div style="display:flex; gap:8px;">
              <input type="text" id="dsc-new-thread-name" placeholder="Nom du personnage">
              <button class="btn small" id="dsc-new-thread-btn" style="flex-shrink:0;">Ouvrir</button>
            </div>
          </div>
        </div>
        <div class="dsc-panel" style="display:flex; flex-direction:column; height:540px;">
          <h2 id="dsc-chat-title">Sélectionne une conversation</h2>
          <div id="dsc-chat-messages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:8px 0;"></div>
          <div id="dsc-chat-input-row" style="display:none; gap:8px;">
            <input type="text" id="dsc-chat-input" placeholder="Écris un message...">
            <button class="btn small" id="dsc-chat-send-btn" style="flex-shrink:0;">Envoyer</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('dsc-new-thread-btn').addEventListener('click', () => {
      const name = document.getElementById('dsc-new-thread-name').value.trim();
      if (name) openThread(name);
    });

    try {
      const data = await apiFetch('/api/rp/doctoscp/threads');
      renderThreadsList(data.threads || []);
    } catch (err) {
      document.getElementById('dsc-threads-list').innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }

    if (currentThreadWith) openThread(currentThreadWith);
  }

  function renderThreadsList(threads) {
    const list = document.getElementById('dsc-threads-list');
    list.innerHTML = threads.length
      ? threads
          .map(
            (t) => `
      <div class="dsc-thread-item${t.otherCharacterName === currentThreadWith ? ' active' : ''}" data-thread-name="${escapeHtml(t.otherCharacterName)}">
        <div>
          <div style="font-size:12.5px; font-weight:600;">${escapeHtml(t.otherCharacterName)}</div>
          <div class="post-card-meta">${escapeHtml((t.lastMessage || '').slice(0, 40))}</div>
        </div>
      </div>
    `
          )
          .join('')
      : '<div class="empty-row">Aucune conversation.</div>';
    list.querySelectorAll('[data-thread-name]').forEach((el) => {
      el.addEventListener('click', () => openThread(el.dataset.threadName));
    });
  }

  async function openThread(otherName) {
    currentThreadWith = otherName;
    document.getElementById('dsc-chat-title').textContent = otherName;
    document.getElementById('dsc-chat-input-row').style.display = 'flex';
    const box = document.getElementById('dsc-chat-messages');
    box.innerHTML = '<div class="empty-row">Chargement…</div>';

    try {
      const data = await apiFetch(`/api/rp/doctoscp/messages/${encodeURIComponent(otherName)}`);
      const messages = data.messages || [];
      box.innerHTML = messages.length
        ? messages
            .map((m) => `<div class="dsc-chat-bubble ${m.fromCharacterName === myCharacterName ? 'mine' : 'theirs'}">${escapeHtml(m.content)}</div>`)
            .join('')
        : '<div class="empty-row">Aucun message. Lance la conversation !</div>';
      box.scrollTop = box.scrollHeight;
    } catch (err) {
      box.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }

    document.getElementById('dsc-chat-send-btn').onclick = async () => {
      const input = document.getElementById('dsc-chat-input');
      const contentVal = input.value.trim();
      if (!contentVal) return;
      try {
        await apiFetch('/api/rp/doctoscp/messages', { method: 'POST', body: JSON.stringify({ toCharacterName: otherName, content: contentVal }) });
        input.value = '';
        openThread(otherName);
        apiFetch('/api/rp/doctoscp/threads').then((d) => renderThreadsList(d.threads || []));
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    };
  }

  // =======================================================================
  // 🚨 Urgences
  // =======================================================================
  async function loadUrgencesTab() {
    const content = document.getElementById('doctoscp-content');
    content.innerHTML = '<div class="empty-row">Chargement…</div>';

    let data;
    try {
      data = await apiFetch('/api/rp/doctoscp/emergencies');
    } catch (err) {
      content.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }
    const emergencies = data.emergencies || [];

    content.innerHTML = `
      <div class="dsc-two-col">
        <div>
          <div class="record-block-head"><h2>Urgences</h2><span class="count">${emergencies.length}</span></div>
          ${
            emergencies.length
              ? emergencies
                  .map(
                    (e) => `
            <div class="post-card">
              <div class="post-card-head">
                <span class="post-card-title">${escapeHtml(e.patientCharacterName)}</span>
                <span class="status-pill ${e.status === 'open' ? 'status-bad' : 'status-good'}">${e.status === 'open' ? 'Ouverte' : 'Traitée'}</span>
              </div>
              <div class="post-card-meta">Signalé par ${escapeHtml(e.reportedBy)}${e.handledBy ? ` — Pris en charge par ${escapeHtml(e.handledBy)}` : ''}</div>
              <div class="post-card-body" style="margin-top:6px;">${escapeHtml(e.description || '')}</div>
              ${e.status === 'open' ? `<button class="btn small" style="margin-top:8px;" data-emergency-id="${escapeHtml(e.id)}">Prendre en charge</button>` : ''}
            </div>
          `
                  )
                  .join('')
              : '<div class="empty-row">Aucune urgence.</div>'
          }
        </div>
        <div class="dsc-panel">
          <h2>Signaler une urgence</h2>
          <form id="dsc-emergency-form">
            <div class="field-row"><label>Patient *</label><input type="text" id="dsc-emergency-patient" required></div>
            <div class="field-row"><label>Description</label><textarea id="dsc-emergency-desc" rows="3"></textarea></div>
            <button class="btn danger" type="submit">🚨 Signaler</button>
          </form>
        </div>
      </div>
    `;

    content.querySelectorAll('[data-emergency-id]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/rp/doctoscp/emergencies/${encodeURIComponent(btn.dataset.emergencyId)}/resolve`, { method: 'PATCH' });
          loadUrgencesTab();
        } catch (err) {
          alert(`Erreur : ${err.message}`);
        }
      });
    });

    document.getElementById('dsc-emergency-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const patientCharacterName = document.getElementById('dsc-emergency-patient').value.trim();
      const description = document.getElementById('dsc-emergency-desc').value.trim();
      if (!patientCharacterName) { alert('Le nom du patient est obligatoire.'); return; }
      try {
        await apiFetch('/api/rp/doctoscp/emergencies', { method: 'POST', body: JSON.stringify({ patientCharacterName, description }) });
        loadUrgencesTab();
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  // =======================================================================
  // 🔒 Quarantaine
  // =======================================================================
  async function loadQuarantaineTab() {
    const content = document.getElementById('doctoscp-content');
    content.innerHTML = '<div class="empty-row">Chargement…</div>';

    let data;
    try {
      data = await apiFetch('/api/rp/doctoscp/quarantine');
    } catch (err) {
      content.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }
    const quarantines = data.quarantines || [];

    content.innerHTML = `
      <div class="dsc-two-col">
        <div>
          <div class="record-block-head"><h2>Quarantaines</h2><span class="count">${quarantines.length}</span></div>
          ${
            quarantines.length
              ? quarantines
                  .map(
                    (q) => `
            <div class="post-card">
              <div class="post-card-head">
                <span class="post-card-title">${escapeHtml(q.characterName)}</span>
                <span class="status-pill ${q.endedAt ? 'status-good' : 'status-warn'}">${q.endedAt ? 'Levée' : 'Active'}</span>
              </div>
              <div class="post-card-meta">Ordonné par ${escapeHtml(q.orderedBy)} — ${q.startedAt ? new Date(q.startedAt).toLocaleString('fr-FR') : ''}</div>
              <div class="post-card-body" style="margin-top:6px;">${escapeHtml(q.reason || '')}</div>
              ${!q.endedAt ? `<button class="btn small" style="margin-top:8px;" data-quarantine-id="${escapeHtml(q.id)}">Lever la quarantaine</button>` : ''}
            </div>
          `
                  )
                  .join('')
              : '<div class="empty-row">Aucune quarantaine enregistrée.</div>'
          }
        </div>
        <div class="dsc-panel">
          <h2>Mettre en quarantaine</h2>
          <form id="dsc-quarantine-form">
            <div class="field-row"><label>Personnage *</label><input type="text" id="dsc-quarantine-name" required></div>
            <div class="field-row"><label>Motif</label><textarea id="dsc-quarantine-reason" rows="3"></textarea></div>
            <button class="btn" type="submit">🔒 Placer en quarantaine</button>
          </form>
        </div>
      </div>
    `;

    content.querySelectorAll('[data-quarantine-id]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/rp/doctoscp/quarantine/${encodeURIComponent(btn.dataset.quarantineId)}/end`, { method: 'PATCH' });
          loadQuarantaineTab();
        } catch (err) {
          alert(`Erreur : ${err.message}`);
        }
      });
    });

    document.getElementById('dsc-quarantine-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const characterName = document.getElementById('dsc-quarantine-name').value.trim();
      const reason = document.getElementById('dsc-quarantine-reason').value.trim();
      if (!characterName) { alert('Le nom est obligatoire.'); return; }
      try {
        await apiFetch('/api/rp/doctoscp/quarantine', { method: 'POST', body: JSON.stringify({ characterName, reason }) });
        loadQuarantaineTab();
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  // =======================================================================
  // 📜 Certificats d'aptitude
  // =======================================================================
  const CERT_STATUS_META = {
    apte: { label: 'Apte', cls: 'status-good' },
    apte_surveillance: { label: 'Apte avec surveillance', cls: 'status-warn' },
    inapte: { label: 'Inapte', cls: 'status-bad' },
  };

  async function loadCertificatsTab() {
    const content = document.getElementById('doctoscp-content');
    content.innerHTML = '<div class="empty-row">Chargement…</div>';

    let data;
    try {
      data = await apiFetch('/api/rp/doctoscp/certificates');
    } catch (err) {
      content.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }
    const certificates = data.certificates || [];

    content.innerHTML = `
      <div class="dsc-two-col">
        <div>
          <div class="record-block-head"><h2>Certificats délivrés</h2><span class="count">${certificates.length}</span></div>
          ${
            certificates.length
              ? certificates
                  .map((c) => {
                    const meta = CERT_STATUS_META[c.status] || CERT_STATUS_META.apte;
                    return `
            <div class="post-card">
              <div class="post-card-head">
                <span class="post-card-title">${escapeHtml(c.characterName)}</span>
                <span class="status-pill ${meta.cls}">${meta.label}</span>
              </div>
              <div class="post-card-meta">Délivré par ${escapeHtml(c.issuedBy)} — ${c.createdAt ? new Date(c.createdAt).toLocaleDateString('fr-FR') : ''}</div>
              ${c.notes ? `<div class="post-card-body" style="margin-top:6px;">${escapeHtml(c.notes)}</div>` : ''}
            </div>
          `;
                  })
                  .join('')
              : '<div class="empty-row">Aucun certificat délivré.</div>'
          }
        </div>
        <div class="dsc-panel">
          <h2>Délivrer un certificat</h2>
          <form id="dsc-cert-form">
            <div class="field-row"><label>Personnage *</label><input type="text" id="dsc-cert-name" required></div>
            <div class="field-row">
              <label>Statut</label>
              <select id="dsc-cert-status">
                ${Object.entries(CERT_STATUS_META).map(([id, m]) => `<option value="${id}">${m.label}</option>`).join('')}
              </select>
            </div>
            <div class="field-row"><label>Notes</label><textarea id="dsc-cert-notes" rows="2"></textarea></div>
            <button class="btn" type="submit">Délivrer</button>
          </form>
        </div>
      </div>
    `;

    document.getElementById('dsc-cert-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const characterName = document.getElementById('dsc-cert-name').value.trim();
      const status = document.getElementById('dsc-cert-status').value;
      const notes = document.getElementById('dsc-cert-notes').value.trim();
      if (!characterName) { alert('Le nom est obligatoire.'); return; }
      try {
        await apiFetch('/api/rp/doctoscp/certificates', { method: 'POST', body: JSON.stringify({ characterName, status, notes }) });
        loadCertificatsTab();
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  checkAccessAndInit();
</script>

</body>
</html>
