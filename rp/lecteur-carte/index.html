<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur de carte — Sécurité — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://voidline-studio.com/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #08090C;
    --void-2: #0D0F14;
    --panel: #12141B;
    --panel-raised: #171922;
    --line: #23262F;
    --line-soft: rgba(255,255,255,0.06);
    --accent: #6E76FF;
    --accent-soft: rgba(110,118,255,0.10);
    --accent-2: #A78BFA;
    --ink: #ECEDF1;
    --ink-dim: #9297A8;
    --ink-faint: #565B6B;
    --good: #4FD895;
    --warn: #F0A83C;
    --bad: #F0525A;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  *{ scrollbar-width:thin; scrollbar-color:#3a3d4a var(--void-2); }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:var(--void-2); }
  *::-webkit-scrollbar-thumb{ background:#3a3d4a; border-radius:4px; }
  html, body{ height:100%; }
  body{ background:var(--void); color:var(--ink); font-family:'Inter', sans-serif; overflow:hidden; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .topbar{
    height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 18px;
    background:var(--void-2); border-bottom:1px solid var(--line);
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim); padding:6px 10px;
    border-radius:5px; border:1px solid var(--line);
  }
  .back-link:hover{ color:var(--ink); border-color:var(--accent); }
  .back-link svg{ width:14px; height:14px; }
  .topbar-title{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; }
  .topbar-status{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); }

  .center-msg{ display:flex; align-items:center; justify-content:center; height:calc(100vh - 48px); color:var(--ink-dim); font-size:14px; text-align:center; padding:20px; }

  .reader-page{
    height:calc(100vh - 48px); overflow-y:auto; padding:36px 20px;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(110,118,255,0.06), transparent 60%);
  }
  .reader-columns{ display:flex; gap:24px; justify-content:center; align-items:flex-start; flex-wrap:wrap; max-width:1000px; margin:0 auto; }

  .history-panel{ width:280px; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .history-head{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; margin-bottom:12px; }
  .history-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft); gap:8px; }
  .history-filters{ display:flex; gap:6px; margin-bottom:12px; }
  .history-filters select{ font-size:11px; padding:6px 8px; }
  .history-item:last-child{ border-bottom:none; }
  .history-name{ font-size:12px; font-weight:600; }
  .history-meta{ font-size:10.5px; color:var(--ink-faint); }
  .history-result{ font-family:'JetBrains Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; flex-shrink:0; }

  .access-result{
    width:360px; max-width:100%; border-radius:14px; padding:36px 20px; text-align:center;
    animation:accessPulse 0.4s ease;
  }
  .access-result.granted{ background:rgba(79,216,149,0.1); border:2px solid var(--good); }
  .access-result.denied{ background:rgba(240,82,90,0.1); border:2px solid var(--bad); animation:accessPulse 0.4s ease, accessShake 0.4s ease 0.1s; }
  @keyframes accessPulse{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes accessShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
  .access-result-icon{ font-size:52px; font-weight:700; margin-bottom:10px; }
  .access-result.granted .access-result-icon{ color:var(--good); }
  .access-result.denied .access-result-icon{ color:var(--bad); }
  .access-result-label{ font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:700; margin-bottom:8px; }
  .access-result.granted .access-result-label{ color:var(--good); }
  .access-result.denied .access-result-label{ color:var(--bad); }
  .access-result-sub{ font-size:12.5px; color:var(--ink-dim); }
  .access-result.suspicious{ animation:accessPulse 0.4s ease, suspiciousShake 0.5s ease 0.4s 2; }
  @keyframes suspiciousShake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-10px); } 40%{ transform:translateX(10px); }
    60%{ transform:translateX(-7px); } 80%{ transform:translateX(7px); }
  }
  .suspicious-warning{
    margin-top:14px; padding:8px 12px; border-radius:6px; background:rgba(240,82,90,0.15); border:1px solid var(--bad);
    color:var(--bad); font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:600;
  }

  /* ---- Le boîtier du lecteur ---- */
  .device{
    width:360px; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:26px; box-shadow:0 30px 70px rgba(0,0,0,0.5);
  }
  .device-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-faint); text-align:center; margin-bottom:16px;
  }
  .scan-slot{
    position:relative; height:64px; border-radius:8px; background:var(--void); border:1px solid var(--line);
    overflow:hidden; margin-bottom:20px; display:flex; align-items:center; justify-content:center;
  }
  .scan-slot-icon{ color:var(--ink-faint); }
  .scan-slot-icon svg{ width:26px; height:26px; }
  .scan-line{
    position:absolute; top:0; bottom:0; width:3px; background:linear-gradient(180deg, transparent, var(--accent-2), transparent);
    box-shadow:0 0 14px var(--accent-2); left:-10%; opacity:0;
  }
  .scan-line.scanning{ animation:scanSweep 1.1s linear; }
  @keyframes scanSweep{
    0%{ left:-5%; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ left:105%; opacity:0; }
  }

  /* ---- Carte physique qui apparaît après le scan ---- */
  .physical-card{
    width:100%; background:linear-gradient(135deg, #1c1f2e, #12141b); border:1px solid var(--accent); border-radius:8px;
    padding:0 14px; box-shadow:0 14px 30px rgba(0,0,0,0.4); overflow:hidden;
    max-height:0; opacity:0; margin-bottom:0; transition:max-height .5s ease, opacity .4s ease, padding .5s ease, margin .5s ease;
  }
  .physical-card.ejecting{ max-height:90px; opacity:1; padding:12px 14px; margin-bottom:16px; }
  .card-visual-brand{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.12em; color:var(--accent-2); margin-bottom:6px; }
  .card-visual-name{ font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:700; color:var(--ink); }
  .card-visual-dept{ font-size:10.5px; color:var(--ink-faint); margin-top:3px; }

  .quick-scan-toggle{
    display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-dim); margin-bottom:14px; cursor:pointer;
  }
  .quick-scan-toggle input{ width:auto; }

  .field-row{ margin-bottom:14px; }
  .field-row label{ display:block; font-size:11px; color:var(--ink-faint); margin-bottom:6px; font-family:'JetBrains Mono', monospace; letter-spacing:0.04em; text-transform:uppercase; }
  input, select{
    width:100%; background:var(--void-2); border:1px solid var(--line); border-radius:7px; padding:10px 12px;
    color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:13px; text-align:center; letter-spacing:0.03em;
  }
  input:focus, select:focus{ outline:none; border-color:var(--accent); }
  select option{ background:var(--void-2); color:var(--ink); }
  .btn{
    width:100%; padding:11px 18px; border-radius:7px; border:none; background:var(--accent); color:#fff;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ---- Résultats ---- */
  .results-wrap{ width:360px; max-width:100%; display:flex; flex-direction:column; gap:12px; }
  .results-wrap:empty{ display:none; }
  .badge-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; position:relative; overflow:hidden;
  }
  .badge-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:5px;
  }
  .badge-card.level-0::before{ background:var(--bad); }
  .badge-card.level-1::before{ background:var(--good); }
  .badge-card.level-2::before{ background:var(--warn); }
  .badge-card.level-3::before{ background:#4FA8F0; }
  .badge-card.level-4::before{ background:var(--accent-2); }

  .dossier-stamp{
    position:absolute; top:14px; right:-30px; transform:rotate(35deg); background:rgba(240,82,90,0.15);
    border:1px solid var(--bad); color:var(--bad); font-family:'JetBrains Mono', monospace; font-size:9px;
    letter-spacing:0.1em; padding:2px 34px; opacity:0.75;
  }
  .dossier-header{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:16px; padding-bottom:10px; border-bottom:1px dashed var(--line);
  }
  .dossier-section{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft); }
  .dossier-section:first-of-type{ margin-top:16px; }
  .dossier-section-title{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent-2); margin-bottom:10px;
  }
  .dossier-command{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-dim); background:var(--void-2);
    border:1px solid var(--line); border-radius:6px; padding:10px 12px; white-space:pre-wrap; line-height:1.5;
  }

  .badge-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .badge-avatar{
    width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:16px; color:#fff; flex-shrink:0;
  }
  .badge-name{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; }
  .badge-rank{ font-size:12px; color:var(--ink-faint); margin-top:2px; }

  .accred-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .accred-label{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-faint); }
  .accred-value{ font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:700; }
  .accred-bars{ display:flex; gap:4px; margin-bottom:14px; }
  .accred-bar{ flex:1; height:8px; border-radius:3px; background:var(--void-2); border:1px solid var(--line); }
  .accred-bar.filled{ background:var(--accent-2); border-color:var(--accent-2); }

  .badge-detail-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:12px; }
  .badge-detail-row:last-child{ border-bottom:none; }
  .repeat-warning{
    margin:12px 0; padding:8px 12px; border-radius:6px; background:rgba(240,168,60,0.12); border:1px solid var(--warn);
    color:var(--warn); font-size:11.5px; font-weight:600;
  }
  .badge-actions{ display:flex; gap:8px; margin-top:16px; }
  .btn.small{ padding:8px 12px; font-size:11.5px; width:auto; }
  .btn.ghost{ background:var(--void-2); color:var(--ink-dim); border:1px solid var(--line); }

  .reader-modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100;
  }
  .reader-modal{
    width:420px; max-width:90vw; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px;
    box-shadow:0 30px 70px rgba(0,0,0,0.6);
  }
  .reader-modal h3{ font-family:'Space Grotesk', sans-serif; font-size:15px; margin-bottom:16px; }
  .reader-modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .badge-detail-label{ color:var(--ink-faint); }
  .badge-detail-value{ font-family:'JetBrains Mono', monospace; }

  .status-tag{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:9.5px; font-family:'JetBrains Mono', monospace;
    text-transform:uppercase; letter-spacing:0.04em; margin-left:8px;
  }
  .status-actif{ background:rgba(79,216,149,0.12); color:var(--good); }
  .status-inactif{ background:rgba(240,168,60,0.12); color:var(--warn); }

  .empty-row{ color:var(--ink-faint); font-size:12.5px; text-align:center; padding:10px 0; }
  .multi-match{
    background:var(--void-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; margin-bottom:6px;
    font-size:12.5px;
  }
  .multi-match:hover{ border-color:var(--accent); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/rp/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
      Retour à l'intranet
    </a>
    <span class="topbar-title">Lecteur de carte — Sécurité</span>
  </div>
  <span class="topbar-status mono" id="topbar-status">CARD-READER v1.0</span>
</div>

<div id="page-root">
  <div class="center-msg">Chargement…</div>
</div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';
  const SECURITY_DEPT_ID = 'security';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() { return localStorage.getItem(TOKEN_KEY); }

  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  let adminOverrideActive = false;

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(adminOverrideActive ? { 'X-Admin-Override-Dept': SECURITY_DEPT_ID } : {}),
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }

  const pageRoot = document.getElementById('page-root');

  async function checkAccessAndInit() {
    if (!getToken()) {
      pageRoot.innerHTML = '<div class="center-msg">Connecte-toi depuis le site avant d\'accéder au Lecteur de carte.</div>';
      return;
    }

    let context;
    try {
      context = await apiFetch('/api/rp/context');
    } catch (err) {
      pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    if (context.banned) {
      pageRoot.innerHTML = '<div class="center-msg">Accès révoqué.</div>';
      return;
    }

    const isSecurity = (context.characters || []).some((c) => c.deptId === SECURITY_DEPT_ID);
    if (isSecurity) {
      loadReader();
      return;
    }

    if (context.canUseAdminOverride) {
      pageRoot.innerHTML = `
        <div class="center-msg" style="flex-direction:column; gap:16px;">
          <p>Aucun personnage actif dans Sécurité.</p>
          <label style="display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--accent-2); cursor:pointer;">
            <input type="checkbox" id="reader-admin-override-checkbox" style="width:16px; height:16px; accent-color:var(--accent); cursor:pointer;">
            Utiliser les perms administrateur ?
          </label>
          <button class="btn" id="reader-admin-override-enter" style="width:auto; padding:9px 20px;">Entrer</button>
        </div>
      `;
      document.getElementById('reader-admin-override-enter').addEventListener('click', async () => {
        const checked = document.getElementById('reader-admin-override-checkbox').checked;
        if (!checked) {
          pageRoot.innerHTML = '<div class="center-msg">Accès refusé — le Lecteur de carte est réservé au personnel actif du département Sécurité.</div>';
          return;
        }
        adminOverrideActive = true;
        pageRoot.innerHTML = '<div class="center-msg">Chargement…</div>';
        loadReader();
      });
      return;
    }

    pageRoot.innerHTML = '<div class="center-msg">Accès refusé — le Lecteur de carte est réservé au personnel actif du département Sécurité.</div>';
  }

  const ACCRED_META = {
    0: { label: 'Non reconnu', color: 'var(--bad)' },
    1: { label: 'Niveau 1', color: 'var(--good)' },
    2: { label: 'Niveau 2', color: 'var(--warn)' },
    3: { label: 'Niveau 3', color: '#4FA8F0' },
    4: { label: 'Niveau 4', color: 'var(--accent-2)' },
  };

  let consecutiveDenials = 0;
  let lastScannedUsername = null;
  let quickScanMode = false;
  let historyCache = [];

  function loadReader() {
    pageRoot.innerHTML = `
      <div class="reader-page">
        <div class="reader-columns">
          <div class="device">
            <div class="device-label">Placer le badge sur le lecteur</div>
            <div class="scan-slot">
              <div class="scan-slot-icon" id="scan-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h4M6 14h8"/></svg>
              </div>
              <div class="scan-line" id="scan-line"></div>
            </div>
            <div class="physical-card" id="physical-card"></div>
            <div class="field-row"><label>Nom ou pseudo à scanner</label><input type="text" id="card-query" placeholder="ex: C.FLANDEU"></div>
            <div class="field-row">
              <label>Niveau requis (contrôle d'accès)</label>
              <select id="required-level">
                <option value="">Aucun — juste consulter</option>
                <option value="1">Niveau 1</option>
                <option value="2">Niveau 2</option>
                <option value="3">Niveau 3</option>
                <option value="4">Niveau 4</option>
              </select>
            </div>
            <label class="quick-scan-toggle">
              <input type="checkbox" id="quick-scan-checkbox">
              ⚡ Mode scan rapide (patrouille — Entrée relance direct)
            </label>
            <button class="btn" id="scan-btn">🔍 Scanner</button>
          </div>

          <div class="results-wrap" id="results-wrap"></div>

          <div class="history-panel">
            <div class="history-head">Derniers accès</div>
            <div class="history-filters">
              <select id="history-filter-dept"><option value="">Tous départements</option></select>
              <select id="history-filter-result">
                <option value="">Tous résultats</option>
                <option value="granted">Autorisé</option>
                <option value="denied">Refusé</option>
                <option value="info">Consulté</option>
              </select>
            </div>
            <div id="history-list"><div class="empty-row">Chargement…</div></div>
          </div>
        </div>
      </div>
    `;

    const input = document.getElementById('card-query');
    const btn = document.getElementById('scan-btn');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
    btn.addEventListener('click', runScan);

    document.getElementById('quick-scan-checkbox').addEventListener('change', (e) => {
      quickScanMode = e.target.checked;
    });
    // Mode scan rapide : Entrée relance un scan même si le focus n'est pas
    // dans le champ (pratique en patrouille, sans re-cliquer à chaque fois).
    document.addEventListener('keydown', (e) => {
      if (quickScanMode && e.key === 'Enter' && document.activeElement !== input) {
        runScan();
      }
    });

    document.getElementById('history-filter-dept').addEventListener('change', renderHistory);
    document.getElementById('history-filter-result').addEventListener('change', renderHistory);

    loadHistory();
  }

  async function loadHistory() {
    const list = document.getElementById('history-list');
    try {
      const data = await apiFetch('/api/rp/security/card-scans');
      historyCache = data.scans || [];

      // Peuple le filtre "Département" une seule fois avec les valeurs
      // réellement présentes dans l'historique.
      const deptSelect = document.getElementById('history-filter-dept');
      const currentDeptValue = deptSelect.value;
      const depts = [...new Set(historyCache.map((s) => s.deptName).filter(Boolean))];
      deptSelect.innerHTML = '<option value="">Tous départements</option>' + depts.map((d) => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
      deptSelect.value = currentDeptValue;

      renderHistory();
    } catch (err) {
      list.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    const deptFilter = document.getElementById('history-filter-dept').value;
    const resultFilter = document.getElementById('history-filter-result').value;

    const filtered = historyCache.filter(
      (s) => (!deptFilter || s.deptName === deptFilter) && (!resultFilter || s.result === resultFilter)
    );

    list.innerHTML = filtered.length
      ? filtered
          .map((s) => {
            const resultColor = s.result === 'granted' ? 'var(--good)' : s.result === 'denied' ? 'var(--bad)' : 'var(--ink-faint)';
            const resultLabel = s.result === 'granted' ? 'Autorisé' : s.result === 'denied' ? 'Refusé' : 'Consulté';
            return `
          <div class="history-item">
            <div>
              <div class="history-name">${escapeHtml(s.scannedName)}</div>
              <div class="history-meta">${escapeHtml(s.deptName || '')} — par ${escapeHtml(s.scannedBy)}</div>
            </div>
            <span class="history-result" style="color:${resultColor};">${resultLabel}</span>
          </div>
        `;
          })
          .join('')
      : '<div class="empty-row">Aucun scan ne correspond.</div>';
  }

  // Compte les refus déjà enregistrés aujourd'hui pour cette personne —
  // basé sur l'historique déjà en cache (pas d'appel réseau en plus).
  function countTodayDenials(username) {
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);
    return historyCache.filter(
      (s) => s.scannedUsername === username && s.result === 'denied' && (s.createdAt || 0) >= startOfDay.getTime()
    ).length;
  }

  // ---- Sons (Web Audio API, pas de fichier externe) ----
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playTone(freq, duration, type = 'sine', delay = 0, gainValue = 0.05) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = gainValue;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + delay;
      osc.start(start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.stop(start + duration + 0.05);
    } catch (err) {
      // silencieux
    }
  }
  function playScanBeep() { playTone(1600, 0.08, 'square', 0, 0.03); }
  // "sensitive" = profil EIT/accréditation élevée — ton plus grave et plus
  // long, façon alarme feutrée, pour marquer que ce n'est pas un scan anodin.
  function playGrantedChime(sensitive) {
    if (sensitive) {
      playTone(440, 0.2, 'sine', 0, 0.05); playTone(660, 0.3, 'sine', 0.15, 0.05);
    } else {
      playTone(880, 0.15, 'sine', 0, 0.05); playTone(1320, 0.2, 'sine', 0.12, 0.05);
    }
  }
  function playDeniedBuzz(sensitive) {
    playTone(sensitive ? 110 : 180, sensitive ? 0.5 : 0.35, 'sawtooth', 0, sensitive ? 0.08 : 0.06);
    if (sensitive) playTone(90, 0.4, 'sawtooth', 0.15, 0.07);
  }

  async function runScan() {
    const query = document.getElementById('card-query').value.trim();
    const requiredLevel = document.getElementById('required-level').value;
    const results = document.getElementById('results-wrap');
    if (!query) { results.innerHTML = '<div class="empty-row">Saisis un nom ou pseudo à scanner.</div>'; return; }

    const btn = document.getElementById('scan-btn');
    btn.disabled = true;
    const scanLine = document.getElementById('scan-line');
    scanLine.classList.remove('scanning');
    void scanLine.offsetWidth;
    scanLine.classList.add('scanning');
    playScanBeep();
    results.innerHTML = '<div class="empty-row">Lecture en cours…</div>';

    let data;
    try {
      const qs = new URLSearchParams({ query, ...(requiredLevel ? { requiredLevel } : {}) });
      [data] = await Promise.all([
        apiFetch(`/api/rp/security/card-check?${qs.toString()}`),
        new Promise((resolve) => setTimeout(resolve, 900)),
      ]);
    } catch (err) {
      results.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      return;
    }
    btn.disabled = false;

    const matches = data.matches || [];
    if (!matches.length) {
      playDeniedBuzz();
      results.innerHTML = `
        <div class="badge-card level-0">
          <div class="badge-head">
            <div class="badge-avatar" style="background:var(--bad);">?</div>
            <div>
              <div class="badge-name">Aucun agent trouvé</div>
              <div class="badge-rank">Badge non reconnu</div>
            </div>
          </div>
        </div>
      `;
      return;
    }

    if (matches.length === 1) {
      renderBadge(matches[0]);
      loadHistory();
      return;
    }

    // Plusieurs correspondances : on liste, un clic affiche le badge complet.
    results.innerHTML = `
      <div class="empty-row" style="text-align:left; padding:4px 0 10px;">${matches.length} correspondances :</div>
      ${matches.map((m, i) => `<div class="multi-match" data-idx="${i}"><strong>${escapeHtml(m.name)}</strong> — ${escapeHtml(m.username)} <span style="color:var(--ink-faint);">(${escapeHtml(m.deptName)})</span></div>`).join('')}
    `;
    results.querySelectorAll('.multi-match').forEach((el) => {
      el.addEventListener('click', () => renderBadge(matches[Number(el.dataset.idx)]));
    });
  }

  function renderBadge(agent) {
    const results = document.getElementById('results-wrap');
    const isSensitive = (agent.division || '').toUpperCase().includes('EIT') || agent.accreditation >= 3;

    // Carte physique qui "sort" du lecteur avant tout le reste.
    const physicalCard = document.getElementById('physical-card');
    physicalCard.innerHTML = `
      <div class="card-visual-brand">SITE-15</div>
      <div class="card-visual-name">${escapeHtml(agent.name)}</div>
      <div class="card-visual-dept">${escapeHtml(agent.deptName || '')}</div>
    `;
    physicalCard.classList.remove('ejecting');
    void physicalCard.offsetWidth;
    physicalCard.classList.add('ejecting');

    // Écran plein cadre accordé/refusé si un contrôle d'accès a été
    // demandé (requiredLevel envoyé et une seule correspondance).
    if (agent.accessResult) {
      const granted = agent.accessResult === 'granted';

      if (!granted) {
        if (lastScannedUsername === agent.username) consecutiveDenials += 1;
        else consecutiveDenials = 1;
      } else {
        consecutiveDenials = 0;
      }
      lastScannedUsername = agent.username;

      if (granted) playGrantedChime(isSensitive); else playDeniedBuzz(isSensitive);

      const suspicious = !granted && consecutiveDenials >= 2;

      results.innerHTML = `
        <div class="access-result ${granted ? 'granted' : 'denied'}${suspicious ? ' suspicious' : ''}">
          <div class="access-result-icon">${granted ? '✓' : '✕'}</div>
          <div class="access-result-label">${granted ? 'ACCÈS AUTORISÉ' : 'ACCÈS REFUSÉ'}</div>
          <div class="access-result-sub">${escapeHtml(agent.name)} — ${escapeHtml(ACCRED_META[agent.accreditation]?.label || 'Niveau 0')}</div>
          ${suspicious ? `<div class="suspicious-warning">⚠ ${consecutiveDenials}ᵉ refus consécutif — tentative suspecte</div>` : ''}
        </div>
      `;
      setTimeout(() => renderBadgeDetails(agent), 1400);
      return;
    }

    lastScannedUsername = agent.username;
    consecutiveDenials = 0;
    renderBadgeDetails(agent);
  }

  // Calcule les indicateurs de la section "Journal de checkpoint" à partir
  // de l'historique déjà en cache — passages, dernier passage, fouille
  // aléatoire (tirage à chaque affichage, ~15% de chance), et un niveau de
  // vigilance recommandé dérivé du profil (sanctions, accréditation, EIT).
  function computeCheckpointStats(agent) {
    const passages = historyCache.filter((s) => s.scannedUsername === agent.username);
    const passageCount = passages.length || 'N/A';
    const lastPassage = passages.length ? new Date(passages[0].createdAt).toLocaleString('fr-FR') : 'N/A';
    const searchFlag = Math.random() < 0.15;

    let vigilanceLabel = 'Normale';
    let vigilanceColor = 'var(--good)';
    const isSensitive = (agent.division || '').toUpperCase().includes('EIT') || agent.accreditation >= 3;
    if (agent.sanctionCount > 0) {
      vigilanceLabel = 'Maximale';
      vigilanceColor = 'var(--bad)';
    } else if (isSensitive) {
      vigilanceLabel = 'Renforcée';
      vigilanceColor = 'var(--warn)';
    }

    return { passageCount, lastPassage, searchFlag, vigilanceLabel, vigilanceColor };
  }

  function renderBadgeDetails(agent) {
    const results = document.getElementById('results-wrap');
    const meta = ACCRED_META[agent.accreditation] || ACCRED_META[0];
    const bars = [1, 2, 3, 4].map((i) => `<div class="accred-bar${i <= agent.accreditation ? ' filled' : ''}"></div>`).join('');
    const isActive = (agent.status || 'actif') === 'actif';
    const avatarInner = agent.avatarUrl
      ? `<img src="${escapeHtml(agent.avatarUrl)}" alt="" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`
      : escapeHtml((agent.name || '?')[0]);
    const todayDenials = countTodayDenials(agent.username);
    const checkpointStats = computeCheckpointStats(agent);

    results.innerHTML = `
      <div class="badge-card level-${agent.accreditation}">
        <div class="dossier-stamp">CONFIDENTIEL</div>
        <div class="dossier-header">Dossier personnel — SITE-15</div>

        <div class="badge-head">
          <div class="badge-avatar">${avatarInner}</div>
          <div>
            <div class="badge-name">${escapeHtml(agent.name)} <span class="status-tag ${isActive ? 'status-actif' : 'status-inactif'}">${isActive ? 'Actif' : 'Inactif'}</span></div>
            <div class="badge-rank">${escapeHtml(agent.rank || 'Grade non précisé')} — ${escapeHtml(agent.deptName || '')}</div>
          </div>
        </div>

        ${todayDenials >= 2 ? `<div class="repeat-warning">⚠ ${todayDenials} refus déjà enregistrés aujourd'hui pour cette personne</div>` : ''}

        <div class="dossier-section">
          <div class="dossier-section-title">Habilitation</div>
          <div class="accred-row">
            <span class="accred-label">Accréditation</span>
            <span class="accred-value" style="color:${meta.color};">${meta.label}</span>
          </div>
          <div class="accred-bars">${bars}</div>
          ${agent.division ? `<div class="badge-detail-row"><span class="badge-detail-label">Division</span><span class="badge-detail-value">${escapeHtml(agent.division)}</span></div>` : ''}
        </div>

        <div class="dossier-section">
          <div class="dossier-section-title">Identité</div>
          <div class="badge-detail-row"><span class="badge-detail-label">Pseudo Roblox</span><span class="badge-detail-value">${escapeHtml(agent.username)}</span></div>
          <div class="badge-detail-row"><span class="badge-detail-label">Département</span><span class="badge-detail-value">${escapeHtml(agent.deptName || '—')}</span></div>
          ${agent.registeredDate ? `<div class="badge-detail-row"><span class="badge-detail-label">Enregistré le</span><span class="badge-detail-value">${escapeHtml(agent.registeredDate)}</span></div>` : ''}
        </div>

        <div class="dossier-section">
          <div class="dossier-section-title">Journal de checkpoint</div>
          <div class="badge-detail-row">
            <span class="badge-detail-label">Passages enregistrés</span>
            <span class="badge-detail-value">${checkpointStats.passageCount || 'N/A'}</span>
          </div>
          <div class="badge-detail-row">
            <span class="badge-detail-label">Dernier passage</span>
            <span class="badge-detail-value">${checkpointStats.lastPassage || 'N/A'}</span>
          </div>
          <div class="badge-detail-row">
            <span class="badge-detail-label">Fouille aléatoire</span>
            <span class="badge-detail-value" style="color:${checkpointStats.searchFlag ? 'var(--warn)' : 'var(--ink-faint)'};">${checkpointStats.searchFlag ? '⚠ Fouille recommandée' : 'N/A'}</span>
          </div>
          <div class="badge-detail-row">
            <span class="badge-detail-label">Vigilance recommandée</span>
            <span class="badge-detail-value" style="color:${checkpointStats.vigilanceColor};">${checkpointStats.vigilanceLabel}</span>
          </div>
        </div>

        <div class="dossier-section">
          <div class="dossier-section-title">Antécédents</div>
          <div class="badge-detail-row">
            <span class="badge-detail-label">Sanctions RP</span>
            <span class="badge-detail-value" style="color:${agent.sanctionCount ? 'var(--bad)' : 'var(--good)'};">${agent.sanctionCount || 0}${agent.sanctionCount ? ' infraction(s)' : ' — casier vierge'}</span>
          </div>
        </div>

        <div class="badge-actions">
          ${agent.accessResult === 'denied' ? `<button class="btn small ghost" id="create-report-btn">📄 Créer un rapport</button>` : ''}
          <button class="btn small ghost" id="print-badge-btn">🖨️ Imprimer</button>
        </div>
      </div>
    `;

    const reportBtn = document.getElementById('create-report-btn');
    if (reportBtn) reportBtn.addEventListener('click', () => openIncidentReportModal(agent));
    document.getElementById('print-badge-btn').addEventListener('click', () => printBadge(agent));
  }

  // ---- Rapport d'incident lié à un refus ----
  function openIncidentReportModal(agent) {
    const backdrop = document.createElement('div');
    backdrop.className = 'reader-modal-backdrop';
    backdrop.innerHTML = `
      <div class="reader-modal">
        <h3>Créer un rapport d'incident</h3>
        <form id="incident-report-form">
          <div class="field-row"><label>Titre *</label><input type="text" id="report-title" value="Refus d'accès — ${escapeHtml(agent.name)}" required></div>
          <div class="field-row"><label>Impliqué(s)</label><input type="text" id="report-involved" value="${escapeHtml(agent.name)}"></div>
          <div class="field-row"><label>Description</label><textarea id="report-description" rows="5">${escapeHtml(agent.name)} (${escapeHtml(agent.rank || 'grade non précisé')}, accréditation ${agent.accreditation}) s'est vu refuser l'accès lors d'un contrôle au lecteur de carte.</textarea></div>
          <div class="reader-modal-actions">
            <button type="button" class="btn ghost" id="report-cancel-btn">Annuler</button>
            <button type="submit" class="btn">Créer le rapport</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(backdrop);
    document.getElementById('report-cancel-btn').addEventListener('click', () => backdrop.remove());
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

    document.getElementById('incident-report-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('report-title').value.trim();
      const involved = document.getElementById('report-involved').value.trim();
      const description = document.getElementById('report-description').value.trim();
      if (!title) { alert('Le titre est obligatoire.'); return; }
      try {
        await apiFetch('/api/rp/security/reports', { method: 'POST', body: JSON.stringify({ title, involved, description }) });
        backdrop.remove();
        alert('Rapport créé — retrouve-le dans l\'onglet Rapport du terminal Sécurité.');
      } catch (err) {
        alert(`Erreur : ${err.message}`);
      }
    });
  }

  // ---- Fiche imprimable ----
  function printBadge(agent) {
    const meta = ACCRED_META[agent.accreditation] || ACCRED_META[0];
    const win = window.open('', '_blank', 'width=500,height=650');
    win.document.write(`
      <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Badge — ${escapeHtml(agent.name)}</title>
      <style>
        body{ font-family:'Courier New', monospace; padding:40px; color:#111; }
        h1{ font-size:18px; border-bottom:2px solid #111; padding-bottom:10px; }
        .row{ margin:10px 0; } .label{ font-weight:bold; display:inline-block; width:150px; }
      </style></head><body>
        <h1>FICHE DE CONTRÔLE — LECTEUR DE CARTE</h1>
        <div class="row"><span class="label">Nom :</span> ${escapeHtml(agent.name)}</div>
        <div class="row"><span class="label">Département :</span> ${escapeHtml(agent.deptName || '—')}</div>
        <div class="row"><span class="label">Grade :</span> ${escapeHtml(agent.rank || '—')}</div>
        <div class="row"><span class="label">Division :</span> ${escapeHtml(agent.division || '—')}</div>
        <div class="row"><span class="label">Accréditation :</span> ${escapeHtml(meta.label)}</div>
        <div class="row"><span class="label">Statut :</span> ${(agent.status || 'actif') === 'actif' ? 'Actif' : 'Inactif'}</div>
        <div class="row"><span class="label">Sanctions RP :</span> ${agent.sanctionCount || 0}</div>
        <div class="row"><span class="label">Contrôlé le :</span> ${new Date().toLocaleString('fr-FR')}</div>
      </body></html>
    `);
    win.document.close();
    win.focus();
    win.print();
  }

  checkAccessAndInit();
</script>

</body>
