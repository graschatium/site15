<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messagerie — SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="https://voidline-studio.com/ressources/voidline.ico" type="image/x-icon">
<style>
  :root{
    --void: #08090C; --void-2: #0D0F14; --panel: #12141B; --line: #23262F; --line-soft: rgba(255,255,255,0.06);
    --accent: #6E76FF; --accent-soft: rgba(110,118,255,0.10); --accent-2: #A78BFA;
    --ink: #ECEDF1; --ink-dim: #9297A8; --ink-faint: #565B6B;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  *{ scrollbar-width:thin; scrollbar-color:#3a3d4a var(--void-2); }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:var(--void-2); }
  *::-webkit-scrollbar-thumb{ background:#3a3d4a; border-radius:4px; }
  html, body{ height:100%; }
  body{ background:var(--void); color:var(--ink); font-family:'Inter', sans-serif; overflow:hidden; }
  a{ color:inherit; text-decoration:none; }

  .topbar{ height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--void-2); border-bottom:1px solid var(--line); }
  .topbar-left{ display:flex; align-items:center; gap:16px; }
  .back-link{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim); padding:6px 10px; border-radius:5px; border:1px solid var(--line); }
  .back-link:hover{ color:var(--ink); border-color:var(--accent); }
  .back-link svg{ width:14px; height:14px; }
  .topbar-title{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; }

  .center-msg{ display:flex; align-items:center; justify-content:center; height:calc(100vh - 48px); color:var(--ink-dim); font-size:14px; text-align:center; padding:20px; }

  .msg-shell{ height:calc(100vh - 48px); display:flex; }
  .msg-sidebar{ width:280px; flex-shrink:0; border-right:1px solid var(--line); background:var(--void-2); display:flex; flex-direction:column; }
  .msg-identity{ padding:14px; border-bottom:1px solid var(--line); }
  .msg-identity label{ display:block; font-size:10.5px; color:var(--ink-faint); margin-bottom:6px; font-family:'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:0.04em; }
  select{ width:100%; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; color:var(--ink); font-size:12.5px; }
  .msg-new-row{ padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .msg-new-row input{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; color:var(--ink); font-size:12px; }
  .btn{ padding:8px 14px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .thread-list{ flex:1; overflow-y:auto; padding:8px; }
  .thread-item{ padding:11px 12px; border-radius:8px; cursor:pointer; margin-bottom:2px; border:1px solid transparent; }
  .thread-item:hover{ background:var(--panel); }
  .thread-item.active{ background:var(--accent-soft); border-color:var(--accent); }
  .thread-name{ font-size:12.5px; font-weight:600; }
  .thread-preview{ font-size:11px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty-row{ color:var(--ink-faint); font-size:12px; text-align:center; padding:20px; }

  .msg-main{ flex:1; display:flex; flex-direction:column; }
  .msg-header{ height:56px; flex-shrink:0; display:flex; align-items:center; padding:0 20px; border-bottom:1px solid var(--line); font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; }
  .msg-thread-body{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; }
  .bubble{ max-width:60%; padding:9px 13px; border-radius:12px; margin-bottom:9px; font-size:13px; line-height:1.45; }
  .bubble.mine{ background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:3px; }
  .bubble.theirs{ background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .msg-input-row{ padding:16px 20px; border-top:1px solid var(--line); display:flex; gap:10px; }
  .msg-input-row input{ flex:1; background:var(--void-2); border:1px solid var(--line); border-radius:8px; padding:11px 14px; color:var(--ink); font-size:13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/rp/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
      Retour à l'intranet
    </a>
    <span class="topbar-title">Messagerie interne</span>
  </div>
</div>

<div id="page-root">
  <div class="center-msg">Chargement…</div>
</div>

<script>
  const API_BASE = 'https://site15-bot.onrender.com';
  const TOKEN_KEY = 'vs_token';

  (function captureTokenFromUrl() {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      url.searchParams.delete('token');
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    }
  })();

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function escapeHtml(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token}`,
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }

  const pageRoot = document.getElementById('page-root');
  let myCharacters = [];
  let currentIdentity = null;
  let currentThreadWith = null;

  async function checkAccessAndInit() {
    if (!getToken()) {
      pageRoot.innerHTML = '<div class="center-msg">Connecte-toi depuis le site avant d\'accéder à la messagerie.</div>';
      return;
    }

    let context;
    try {
      context = await apiFetch('/api/rp/context');
    } catch (err) {
      pageRoot.innerHTML = `<div class="center-msg">Erreur : ${escapeHtml(err.message)}</div>`;
      return;
    }

    if (context.banned) {
      pageRoot.innerHTML = '<div class="center-msg">Accès révoqué.</div>';
      return;
    }

    myCharacters = context.characters || [];
    if (!myCharacters.length) {
      pageRoot.innerHTML = '<div class="center-msg">Tu dois avoir au moins un personnage actif pour utiliser la messagerie.</div>';
      return;
    }

    currentIdentity = myCharacters[0].name;
    loadShell();
  }

  function loadShell() {
    pageRoot.innerHTML = `
      <div class="msg-shell">
        <div class="msg-sidebar">
          <div class="msg-identity">
            <label>Envoyer en tant que</label>
            <select id="identity-select">
              ${myCharacters.map((c) => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)} — ${escapeHtml(c.rank || 'Sans grade')}</option>`).join('')}
            </select>
          </div>
          <div class="msg-new-row">
            <input type="text" id="new-thread-name" placeholder="Nouveau message à...">
            <button class="btn" id="new-thread-btn">Ouvrir</button>
          </div>
          <div class="thread-list" id="thread-list"><div class="empty-row">Chargement…</div></div>
        </div>
        <div class="msg-main">
          <div class="msg-header" id="msg-header">Sélectionne une conversation</div>
          <div class="msg-thread-body" id="msg-thread-body"></div>
          <div class="msg-input-row" id="msg-input-row" style="display:none;">
            <input type="text" id="msg-input" placeholder="Écris un message...">
            <button class="btn" id="msg-send-btn">Envoyer</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('identity-select').addEventListener('change', (e) => {
      currentIdentity = e.target.value;
      currentThreadWith = null;
      document.getElementById('msg-header').textContent = 'Sélectionne une conversation';
      document.getElementById('msg-thread-body').innerHTML = '';
      document.getElementById('msg-input-row').style.display = 'none';
      loadThreads();
    });

    document.getElementById('new-thread-btn').addEventListener('click', () => {
      const name = document.getElementById('new-thread-name').value.trim();
      if (name) openThread(name);
    });

    loadThreads();
  }

  async function loadThreads() {
    const list = document.getElementById('thread-list');
    try {
      const data = await apiFetch(`/api/rp/messages/threads?as=${encodeURIComponent(currentIdentity)}`);
      const threads = data.threads || [];
      list.innerHTML = threads.length
        ? threads
            .map(
              (t) => `
          <div class="thread-item${t.otherCharacterName === currentThreadWith ? ' active' : ''}" data-name="${escapeHtml(t.otherCharacterName)}">
            <div class="thread-name">${escapeHtml(t.otherCharacterName)}</div>
            <div class="thread-preview">${escapeHtml(t.lastMessage || '')}</div>
          </div>
        `
            )
            .join('')
        : '<div class="empty-row">Aucune conversation.</div>';
      list.querySelectorAll('[data-name]').forEach((el) => {
        el.addEventListener('click', () => openThread(el.dataset.name));
      });
    } catch (err) {
      list.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }
  }

  async function openThread(otherName) {
    currentThreadWith = otherName;
    document.getElementById('msg-header').textContent = otherName;
    document.getElementById('msg-input-row').style.display = 'flex';
    const box = document.getElementById('msg-thread-body');
    box.innerHTML = '<div class="empty-row">Chargement…</div>';

    try {
      const data = await apiFetch(`/api/rp/messages/${encodeURIComponent(otherName)}?as=${encodeURIComponent(currentIdentity)}`);
      const messages = data.messages || [];
      box.innerHTML = messages.length
        ? messages.map((m) => `<div class="bubble ${m.fromCharacterName === currentIdentity ? 'mine' : 'theirs'}">${escapeHtml(m.content)}</div>`).join('')
        : '<div class="empty-row">Aucun message. Lance la conversation !</div>';
      box.scrollTop = box.scrollHeight;
    } catch (err) {
      box.innerHTML = `<div class="empty-row">Erreur : ${escapeHtml(err.message)}</div>`;
    }

    document.getElementById('msg-send-btn').onclick = sendCurrentMessage;
    document.getElementById('msg-input').onkeydown = (e) => { if (e.key === 'Enter') sendCurrentMessage(); };
  }

  async function sendCurrentMessage() {
    const input = document.getElementById('msg-input');
    const content = input.value.trim();
    if (!content || !currentThreadWith) return;
    try {
      await apiFetch('/api/rp/messages', {
        method: 'POST',
        body: JSON.stringify({ asCharacter: currentIdentity, toCharacterName: currentThreadWith, content }),
      });
      input.value = '';
      openThread(currentThreadWith);
      loadThreads();
    } catch (err) {
      alert(`Erreur : ${err.message}`);
    }
  }

  checkAccessAndInit();
</script>

</body>
</html>
