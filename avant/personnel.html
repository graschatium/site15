<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCiPNET — Personnel SITE-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="https://graschatium.github.io/site15/ressources/favicon.ico" type="image/x-icon">
<style>
  :root{
    --bg: #050409;
    --panel: #0d0b16;
    --border: #221d38;
    --violet: #8b5cf6;
    --violet-soft: rgba(139,92,246,0.12);
    --text: #d9d4ea;
    --text-muted: #8b82a8;
    --text-dim: #4d4666;
    --green: #7ee787;
    --amber: #f0b429;
    --danger: #ff3355;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 50% -10%, #140f26 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.6;
  }
  nav.topbar{ display:flex; align-items:center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid var(--border); }
  .brand{ display:flex; align-items:center; gap: 12px; }
  .brand .logo{ width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 50%; display:flex; align-items:center; justify-content:center; overflow: hidden; }
  .brand .logo img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand .eyebrow{ font-size: 0.62rem; letter-spacing: 0.22em; color: var(--text-dim); text-transform: uppercase; }
  .brand .netname{ font-size: 0.92rem; font-weight: 800; letter-spacing: 0.06em; color: #f4f2fc; text-transform: uppercase; }
  .nav-links{ display:flex; align-items:center; gap: 30px; font-size: 0.78rem; letter-spacing: 0.1em; }
  .nav-links a{ color: var(--text-muted); text-decoration:none; text-transform: uppercase; padding-bottom: 4px; border-bottom: 2px solid transparent; }
  .nav-links a:hover{ color: var(--text); }
  .nav-links a.active{ color: var(--violet); border-bottom-color: var(--violet); }
  .nav-right{ display:flex; align-items:center; gap: 14px; }
  .auth-btn{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 14px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; }
  .auth-btn.connected{ border-color:var(--green); color:var(--green); background:rgba(126,231,135,0.06); }

  .hero{ max-width: 1080px; margin: 0 auto; padding: 60px 24px 24px; }
  .pill{ display:inline-block; font-size: 0.68rem; letter-spacing: 0.16em; color: var(--violet); background: var(--violet-soft); border: 1px solid rgba(139,92,246,0.35); padding: 5px 14px; border-radius: 2px; margin-bottom: 20px; text-transform: uppercase; }
  h1.title{ font-size: 2rem; font-weight: 800; letter-spacing: 0.03em; margin: 0 0 8px; color: #f4f2fc; text-transform: uppercase; }
  .hero .sub{ color: var(--text-muted); font-size: 0.9rem; }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 10px 24px 60px; }

  .dept-section{ margin-bottom: 46px; }
  .dept-head{ display:flex; align-items:baseline; gap:12px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .dept-head h2{ font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: #f4f2fc; margin:0; }
  .dept-head .count{ font-size: 0.72rem; color: var(--text-dim); }

  .roster-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
  .agent-card{ background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px; display:flex; gap: 12px; }
  .agent-card img{ width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); flex-shrink:0; }
  .agent-main{ flex:1; min-width:0; }
  .agent-name{ font-size: 0.92rem; font-weight: 700; color: #f4f2fc; }
  .agent-grade{ font-size: 0.72rem; letter-spacing: 0.06em; color: var(--violet); text-transform: uppercase; margin-top: 2px; }
  .agent-player{ font-size: 0.7rem; color: var(--text-dim); margin-top: 6px; }
  .agent-status{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .agent-status.actif{ background: var(--green); }
  .agent-status.inactif{ background: var(--text-dim); }
  .agent-edit{ display:none; margin-top:10px; gap:6px; flex-direction:column; }
  .agent-edit.open{ display:flex; }
  .agent-edit input, .agent-edit select{ background:#120f1e; border:1px solid var(--border); color:#f4f2fc; font-family:'JetBrains Mono',monospace; font-size:11px; padding:6px 8px; outline:none; }
  .agent-edit input:focus, .agent-edit select:focus{ border-color: var(--violet); }
  .agent-edit-actions{ display:flex; gap:6px; }
  .mini-btn{ font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:5px 8px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; }
  .mini-btn:hover{ border-color: var(--violet); color: var(--violet); }
  .mini-btn.danger:hover{ border-color: var(--danger); color: var(--danger); }
  .mini-btn.edit-toggle{ margin-top:8px; align-self:flex-start; }

  .empty-slot{ background: transparent; border: 1px dashed var(--border); border-radius: 6px; padding: 16px; display:flex; flex-direction:column; gap:8px; justify-content:center; align-items:flex-start; }
  .empty-slot .msg{ font-size: 0.72rem; color: var(--text-dim); }
  .empty-slot input{ width:100%; background:#120f1e; border:1px solid var(--border); color:#f4f2fc; font-family:'JetBrains Mono',monospace; font-size:11px; padding:7px 9px; outline:none; }
  .empty-slot input:focus{ border-color: var(--violet); }

  .admin-panel{ margin-top: 50px; padding-top: 24px; border-top: 1px solid var(--border); }
  .admin-panel h3{ font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--danger); margin-bottom: 14px; }
  .mgr-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom: 1px solid var(--border-soft, var(--border)); font-size: 0.78rem; }
  .mgr-row .who{ flex:1; color: var(--text); }
  .mgr-checks{ display:flex; gap:10px; font-size: 0.68rem; color: var(--text-muted); }
  .mgr-checks label{ display:flex; align-items:center; gap:4px; }

  .msg-line{ font-size: 0.78rem; color: var(--text-dim); padding: 20px 0; }
  footer{ max-width: 1080px; margin: 40px auto 0; padding: 20px 24px 60px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-dim); }
</style>
</head>
<body>

<nav class="topbar">
  <div class="brand">
    <div class="logo"><img src="ressources/favicon.ico" alt="SITE-15"></div>
    <div>
      <div class="eyebrow">SCiPNET</div>
      <div class="netname">SITE-15 NETWORK</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="index.html">Accueil</a>
    <a class="active" href="personnel.html">Personnel</a>
    <a href="cgu.html">CGU</a>
    <a href="statut.html">Statut</a>
  </div>
  <div class="nav-right">
    <button class="auth-btn" id="authBtn">🔑 Connexion</button>
  </div>
</nav>

<div class="hero">
  <span class="pill">Registre</span>
  <h1 class="title">Personnel — Site-15</h1>
  <p class="sub">Listing des agents affectés par département. Un joueur peut incarner un personnage par département.</p>
</div>

<div class="wrap" id="wrap">
  <p class="msg-line" id="loadingMsg">Chargement du registre…</p>
</div>

<footer>SITE-15 — Un projet © Voidline Studios 2026, tout droit réservé</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAKnnxGUTpNWtkYetID8UwTp6cJgbcj9Kc",
  authDomain: "scp-site19.firebaseapp.com",
  projectId: "scp-site19",
  storageBucket: "scp-site19.firebasestorage.app",
  messagingSenderId: "245750946774",
  appId: "1:245750946774:web:821944a85e207094b22277"
});
const db = getFirestore(app);

// Départements du site — garder en phase avec index.html
const DEPARTEMENTS = [
  { slug: 'medical',        nom: 'Médical' },
  { slug: 'securite',       nom: 'Sécurité' },
  { slug: 'administratif',  nom: 'Administratif' },
  { slug: 'scientifique',   nom: 'Scientifique' }
];

const SESSION_KEY = 'scp_sec_session_discord';
let me = null; // { _id, discordId, role, departmentManagerOf, characters, ... }
let allUsers = [];

function esc(str){ const d=document.createElement('div'); d.innerText=str??''; return d.innerHTML; }
function loadSession(){ try{ const raw=localStorage.getItem(SESSION_KEY); return raw?JSON.parse(raw):null; }catch{ return null; } }

function canManage(deptSlug){
  if(!me) return false;
  if(me.role === 'admin') return true;
  return Array.isArray(me.departmentManagerOf) && me.departmentManagerOf.includes(deptSlug);
}

async function loadUsers(){
  const snap = await getDocs(collection(db,'users'));
  const users = [];
  snap.forEach(d => users.push({ _id: d.id, ...d.data() }));
  return users;
}

function render(){
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';

  DEPARTEMENTS.forEach(dept => {
    const members = allUsers.filter(u => u.characters && u.characters[dept.slug]);

    const section = document.createElement('div');
    section.className = 'dept-section';
    section.innerHTML = `
      <div class="dept-head"><h2>${esc(dept.nom)}</h2><span class="count">${members.length} agent(s)</span></div>
      <div class="roster-grid" id="grid-${dept.slug}"></div>
    `;
    wrap.appendChild(section);

    const grid = section.querySelector(`#grid-${dept.slug}`);

    members.forEach(u => {
      const c = u.characters[dept.slug];
      const card = document.createElement('div');
      card.className = 'agent-card';
      const managed = canManage(dept.slug);
      card.innerHTML = `
        <img src="${esc(u.avatarUrl || '')}" alt="">
        <div class="agent-main">
          <div class="agent-name">${esc(c.name)}</div>
          <div class="agent-grade">${esc(c.grade || 'Sans grade')}</div>
          <div class="agent-player"><span class="agent-status ${c.statut === 'inactif' ? 'inactif' : 'actif'}"></span>Joueur : ${esc(u.displayName || u.discordUsername || 'Inconnu')}</div>
          ${managed ? `
            <button class="mini-btn edit-toggle" data-toggle="edit-${u._id}-${dept.slug}">Modifier</button>
            <div class="agent-edit" id="edit-${u._id}-${dept.slug}">
              <input type="text" placeholder="Grade" value="${esc(c.grade || '')}" data-field="grade">
              <select data-field="statut">
                <option value="actif" ${c.statut !== 'inactif' ? 'selected' : ''}>Actif</option>
                <option value="inactif" ${c.statut === 'inactif' ? 'selected' : ''}>Inactif</option>
              </select>
              <div class="agent-edit-actions">
                <button class="mini-btn" data-save="${u._id}|${dept.slug}">Enregistrer</button>
                <button class="mini-btn danger" data-remove="${u._id}|${dept.slug}">Retirer le personnage</button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
      grid.appendChild(card);
    });

    // Emplacement pour créer son propre personnage dans ce département
    if(me && (!me.characters || !me.characters[dept.slug])){
      const slot = document.createElement('div');
      slot.className = 'empty-slot';
      slot.innerHTML = `
        <div class="msg">Vous n'avez pas encore de personnage ici (1 max / département).</div>
        <input type="text" placeholder="Nom du personnage" id="newchar-${dept.slug}">
        <button class="mini-btn" data-create="${dept.slug}">Créer mon personnage</button>
      `;
      grid.appendChild(slot);
    }

    if(members.length === 0 && !(me && (!me.characters || !me.characters[dept.slug]))){
      grid.innerHTML = '<div class="msg-line">Aucun agent affecté pour le moment.</div>';
    }
  });

  wireActions();
  if(me && me.role === 'admin') renderAdminPanel();
}

function wireActions(){
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.onclick = () => document.getElementById(btn.dataset.toggle).classList.toggle('open');
  });
  document.querySelectorAll('[data-create]').forEach(btn=>{
    btn.onclick = async () => {
      const dept = btn.dataset.create;
      const input = document.getElementById('newchar-'+dept);
      const name = input.value.trim();
      if(!name) return;
      const characters = { ...(me.characters||{}), [dept]: { name, grade:'', statut:'actif' } };
      await updateDoc(doc(db,'users', me._id), { characters });
      me.characters = characters;
      const idx = allUsers.findIndex(u=>u._id===me._id);
      if(idx>-1) allUsers[idx] = { ...allUsers[idx], characters };
      render();
    };
  });
  document.querySelectorAll('[data-save]').forEach(btn=>{
    btn.onclick = async () => {
      const [uid, dept] = btn.dataset.save.split('|');
      const card = btn.closest('.agent-edit');
      const grade = card.querySelector('[data-field="grade"]').value.trim();
      const statut = card.querySelector('[data-field="statut"]').value;
      const target = allUsers.find(u=>u._id===uid);
      if(!target) return;
      const characters = { ...target.characters, [dept]: { ...target.characters[dept], grade, statut } };
      await updateDoc(doc(db,'users', uid), { characters });
      target.characters = characters;
      render();
    };
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = async () => {
      if(!confirm('Retirer ce personnage du département ?')) return;
      const [uid, dept] = btn.dataset.remove.split('|');
      const target = allUsers.find(u=>u._id===uid);
      if(!target) return;
      const characters = { ...target.characters };
      delete characters[dept];
      await updateDoc(doc(db,'users', uid), { characters });
      target.characters = characters;
      if(uid === me?._id) me.characters = characters;
      render();
    };
  });
}

function renderAdminPanel(){
  const wrap = document.getElementById('wrap');
  const panel = document.createElement('div');
  panel.className = 'admin-panel';
  panel.innerHTML = `<h3>⚠ Gestion des gérants de département</h3>`;
  allUsers.filter(u => u.role !== 'admin').forEach(u => {
    const row = document.createElement('div');
    row.className = 'mgr-row';
    const managerOf = u.departmentManagerOf || [];
    row.innerHTML = `
      <span class="who">${esc(u.displayName || u.discordUsername || u._id)}</span>
      <div class="mgr-checks">
        ${DEPARTEMENTS.map(d => `
          <label><input type="checkbox" data-mgr="${u._id}" data-dept="${d.slug}" ${managerOf.includes(d.slug)?'checked':''}> ${esc(d.nom)}</label>
        `).join('')}
      </div>
    `;
    panel.appendChild(row);
  });
  wrap.appendChild(panel);

  panel.querySelectorAll('[data-mgr]').forEach(cb=>{
    cb.onchange = async () => {
      const uid = cb.dataset.mgr, dept = cb.dataset.dept;
      const target = allUsers.find(u=>u._id===uid);
      if(!target) return;
      let list = new Set(target.departmentManagerOf || []);
      cb.checked ? list.add(dept) : list.delete(dept);
      const departmentManagerOf = Array.from(list);
      await updateDoc(doc(db,'users', uid), { departmentManagerOf });
      target.departmentManagerOf = departmentManagerOf;
    };
  });
}

async function init(){
  const session = loadSession();
  allUsers = await loadUsers();
  if(session?.discordId){
    me = allUsers.find(u => u.discordId === session.discordId) || null;
    const btn = document.getElementById('authBtn');
    if(me){ btn.textContent = '✓ ' + (me.displayName||me.discordUsername||'').split(' ')[0]; btn.className='auth-btn connected'; }
  }
  document.getElementById('authBtn').onclick = () => window.location.href = 'index.html';
  document.getElementById('loadingMsg')?.remove();
  render();
}

init();
</script>
</body>
</html>
